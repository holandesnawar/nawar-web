  <script>
    (function () {
      const q = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const D = 7.275, LEAD = 0.04, W = 896, SL = 0.42;
      const T = { y: 0.12, no: 0.28, menos: 0.41, imp: 0.93, los: 1.43, ej: 1.68, escribes: 2.86, ordenas: 3.60, frases: 3.95,

      const word = (id, cue) => tl.fromTo(q(id), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, cue - LEAD);
      const head = (id, cue) => tl.fromTo(q(id), { opacity: 0, y: 40, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, cue - LEAD);
      // a row arrives: its empty ring + the verb rise together
      const row = (n, verbId, cue) => {
        tl.fromTo(q("f32-ck" + n), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, cue - LEAD);
        word(verbId, cue);
      };
      // the ring fills green and the tick draws (no overshoot)
      const check = (n, t) => {
        tl.fromTo(q("f32-dot" + n), { scale: 0.4, svgOrigin: "20 20" }, { scale: 1, svgOrigin: "20 20", duration: 0.3, ease: "power3.out" }, t);
        tl.fromTo(q("f32-dot" + n), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, t);
        tl.fromTo(q("f32-tk" + n), { strokeDashoffset: 24 }, { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" }, t + 0.08);
      };
      const dim = (id, t) => tl.fromTo(q(id), { opacity: 1 }, { opacity: 0.55, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
      // the window's content slides to the next exercise (clean horizontal page slide)
      const slide = (a, b, t) => {
        tl.fromTo(q(a), { x: 0 }, { x: -W, duration: SL, ease: "power3.inOut", immediateRender: false }, t);
        tl.fromTo(q(b), { x: W }, { x: 0, duration: SL, ease: "power3.inOut" }, t);
      };

      // ===== ENTRANCE: the window rises into place, the lead line starts on «Y» =====
      tl.fromTo(q("f32-rise"), { y: 70 }, { y: 0, duration: 0.8, ease: "expo.out" }, 0);
      tl.fromTo(q("f32-win"), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, 0);
      tl.fromTo(q("f32-stage"), { scale: 1 }, { scale: 1.012, duration: D, ease: "none" }, 0);
      word("f32-w-y", T.y); word("f32-w-no", T.no); word("f32-w-menos", T.menos); word("f32-w-imp", T.imp);
      head("f32-w-los", T.los); head("f32-w-ej", T.ej);
      // panes 2–4 wait off to the right
      tl.set([q("f32-p2"), q("f32-p3"), q("f32-p4")], { x: W }, 0);

      // ===== 1 · Escribes =====
      row(1, "f32-w-escribes", T.escribes);
      check(1, 3.38);

      // ===== 2 · Ordenas frases — chips fly into the answer in order =====
      slide("f32-p1", "f32-p2", T.ordenas - 0.06);
      dim("f32-w-escribes", T.ordenas - 0.04);
      row(2, "f32-w-ordenas", T.ordenas); word("f32-w-frases", T.frases);
      tl.fromTo(q("f32-ph"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 3.9);
      const order = [["f32-c-ik", -337], ["f32-c-wil", 57], ["f32-c-een", 57], ["f32-c-glas", 57], ["f32-c-water", -44], ["f32-c-alsj", 132]];
      order.forEach(([id, dx], i) => {
        tl.fromTo(q(id), { x: 0, y: 0 }, { x: dx, y: -60, duration: 0.26, ease: "power3.inOut" }, 3.76 + i * 0.085);
      });
      tl.fromTo(q("f32-cmp"), { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out" }, 4.42);
      check(2, 4.44);

      // ===== 3 · Escuchas y respondes — the dialogue is playing; click «Hacer los ejercicios» =====
      slide("f32-p2", "f32-p3", T.escuchas - 0.04);
      dim("f32-w-ordenas", T.escuchas - 0.04); dim("f32-w-frases", T.escuchas - 0.04);
      row(3, "f32-w-escuchas", T.escuchas); word("f32-w-respondes", T.yres);
      const P0 = T.escuchas - 0.04, P1 = 5.9;
      tl.fromTo(q("f32-head"), { x: 0 }, { x: 330, duration: P1 - P0, ease: "none" }, P0);
      tl.fromTo(q("f32-tclip"), { width: 0 }, { width: 330, duration: P1 - P0, ease: "none" }, P0);
      tl.fromTo(q("f32-cur"), { x: 690, y: 452 }, { x: 468, y: 372, duration: 0.3, ease: "power2.inOut" }, 4.82);
      tl.fromTo(q("f32-cur"), { scale: 1 }, { scale: 0.86, duration: 0.07, ease: "power2.out", immediateRender: false }, 5.13);
      tl.to(q("f32-cur"), { scale: 1, duration: 0.14, ease: "power2.out" }, 5.2);
      tl.fromTo(q("f32-press"), { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power2.out" }, 5.13);
      tl.to(q("f32-press"), { opacity: 0, duration: 0.3, ease: "power2.out" }, 5.24);
      check(3, 5.36);

      // ===== 4 · Completas sin pistas — Comprobar → ¡Correcto! on «pistas» =====
      slide("f32-p3", "f32-p4", T.completas - 0.06);
      dim("f32-w-escuchas", T.completas - 0.04); dim("f32-w-respondes", T.completas - 0.04);
      row(4, "f32-w-completas", T.completas); word("f32-w-sin", T.sin); word("f32-w-pistas", T.pistas);
      check(4, 6.78);

      window.__timelines = window.__timelines || {};
      window.__timelines["32-practicas"] = tl;
    })();

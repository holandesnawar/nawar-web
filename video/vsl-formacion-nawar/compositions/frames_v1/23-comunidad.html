      tl.fromTo("#f23-orbit", { rotation: -24 }, { rotation: 18, duration: 1.1, ease: "none" }, 0.19);
      tl.fromTo("#f23-orbit", { scale: 1, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, OPEN);
      AV.forEach(([n, cx, cy, d, L], i) => {
        const k = 1 - RPARK(L) / L, kIn = 1 - (RPARK(L) * 0.6) / L;
        const ts = 0.19 + i * 0.015;
        tl.fromTo("#f23-av-" + n, { x: (HUB.x - cx) * kIn, y: (HUB.y - cy) * kIn, scale: 0.1, opacity: 0 },
          { x: (HUB.x - cx) * k, y: (HUB.y - cy) * k, scale: 0.34, opacity: 0.6, duration: 0.36, ease: "power3.out" }, ts);
        tl.fromTo("#f23-ln-" + n, { strokeDashoffset: L * kIn, opacity: 0 },
          { strokeDashoffset: L * k, opacity: 0.7, duration: 0.36, ease: "power3.out" }, ts);
      });

      // ===== Scene 1b — "comunidad" (0.78): pill opens, avatars burst outward =====
      tl.fromTo("#f23-hub", { scale: 2.05 }, { scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, OPEN);
      tl.fromTo("#f23-pill", { width: 96 }, { width: 460, duration: 0.55, ease: "expo.out" }, OPEN);
      tl.fromTo("#f23-pill-icon", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.4, duration: 0.06, ease: "power2.in" }, OPEN);
      // label grows with the pill (scale tracks the width tween), so it always fits inside and is never clipped
      tl.fromTo("#f23-pill-text", { opacity: 0, scale: 0.65 }, { opacity: 1, scale: 1, duration: 0.49, ease: "expo.out" }, OPEN + 0.06);
      tl.fromTo("#f23-shock-b", { scale: 2.1, opacity: 0.6 }, { scale: 8, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, OPEN);
      tl.fromTo("#f23-bloom", { opacity: 0.5, scale: 0.75 }, { opacity: 1, scale: 1.15, duration: 0.35, ease: "power2.out", immediateRender: false }, OPEN);
      tl.fromTo("#f23-bloom", { opacity: 1, scale: 1.15 }, { opacity: 0, scale: 1.3, duration: 1.0, ease: "power1.inOut", immediateRender: false }, OPEN + 0.4);

      // center-outward expansion: each satellite flies from its orbit slot to its place, its line drawing behind it
      const FLY = 0.85, FLY_EASE = "expo.out";
      AV.forEach(([n, cx, cy, d, L]) => {
        const t0 = OPEN + 0.02 + ((L - DMIN) / (DMAX - DMIN)) * 0.06; // near-simultaneous: same-ray neighbours never cross
        const k = 1 - RPARK(L) / L;
        const dx = (HUB.x - cx) * k, dy = (HUB.y - cy) * k;
        tl.fromTo("#f23-av-" + n, { x: dx, y: dy, scale: 0.34 },
          { x: 0, y: 0, scale: 1, duration: FLY, ease: FLY_EASE, immediateRender: false }, t0);
        tl.fromTo("#f23-av-" + n, { opacity: 0.6 }, { opacity: 1, duration: 0.12, ease: "none", immediateRender: false }, t0);
        tl.fromTo("#f23-ln-" + n, { strokeDashoffset: L * k }, { strokeDashoffset: 0, duration: FLY, ease: FLY_EASE, immediateRender: false }, t0);
        tl.fromTo("#f23-ln-" + n, { opacity: 0.7 }, { opacity: 1, duration: 0.14, ease: "none", immediateRender: false }, t0);
      });

      // "compañeros" (1.39): the discs settle — a ripple of hellos from the hub outward
      const bump = (n, t, amp) => {
        tl.fromTo("#f23-dc-" + n, { scale: 1 }, { scale: amp, duration: 0.11, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo("#f23-dc-" + n, { scale: amp }, { scale: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, t + 0.11);
      };
      const ping = (n, t, to, a) => {
        tl.fromTo("#f23-pg-" + n, { scale: 1, opacity: a }, { scale: to, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, t);
      };
      AV.forEach(([n, cx, cy, d, L]) => {
        const t = 1.37 + ((L - DMIN) / (DMAX - DMIN)) * 0.22;
        bump(n, t, 1.09);
        ping(n, t, 1.55, 0.55);
      });

      // ===== Scene 2 — the community talks =====
      const hubBump = (t) => {
        tl.fromTo("#f23-hub", { scale: 1 }, { scale: 1.045, duration: 0.09, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo("#f23-hub", { scale: 1.045 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t + 0.09);
      };
      const comet = (sel, L, t, dur) => {
        tl.fromTo(sel, { strokeDashoffset: 130 }, { strokeDashoffset: -L, duration: dur, ease: "power1.in", immediateRender: false }, t);
      };
      const Lof = (n) => AV.find((a) => a[0] === n)[4];

      // "están" (2.16): JL — «¡Hoy pedí cita con el huisarts en neerlandés!»
      const B1 = 2.14;
      bump("JL", B1, 1.14); ping("JL", B1, 1.7, 0.9);
      tl.fromTo("#f23-b1", { opacity: 0, scale: 0.4, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.34, ease: "expo.out" }, B1);
      comet("#f23-ci-JL", Lof("JL"), B1 + 0.06, 0.3);
      hubBump(B1 + 0.36);

      // "mismo" (3.00): LU — «¿Alguien practica esta tarde?» -> broadcast to everyone
      const B2 = 2.98;
      bump("LU", B2, 1.14); ping("LU", B2, 1.7, 0.9);
      tl.fromTo("#f23-b2", { opacity: 0, scale: 0.4, y: -18 }, { opacity: 1, scale: 1, y: 0, duration: 0.34, ease: "expo.out" }, B2);
      comet("#f23-ci-LU", Lof("LU"), B2 + 0.04, 0.24);
      hubBump(B2 + 0.28);
      AV.forEach(([n, cx, cy, d, L]) => {
        if (n === "LU") return;
        tl.fromTo("#f23-co-" + n, { strokeDashoffset: 130 }, { strokeDashoffset: -L, duration: 0.34, ease: "power1.out", immediateRender: false }, B2 + 0.26);
        if (n !== "GA") bump(n, B2 + 0.56, 1.06);
      });

      // 3.50: GA replies «¡Yo!»
      const B3 = 3.48;
      bump("GA", B3, 1.16); ping("GA", B3, 1.8, 0.95);
      tl.fromTo("#f23-b3", { opacity: 0, scale: 0.3, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "expo.out" }, B3);
      comet("#f23-ci-GA", Lof("GA"), B3 + 0.06, 0.32);
      hubBump(B3 + 0.4);

      // ===== Scene 3 — "en tu idioma." (4.14 / 4.24 / 4.30), then hold =====
      tl.fromTo("#f23-w-en", { opacity: 0, y: 46, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.26, ease: "power3.out" }, 4.1);
      tl.fromTo("#f23-w-tu", { opacity: 0, y: 46, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.26, ease: "power3.out" }, 4.2);
      tl.fromTo("#f23-w-idioma", { opacity: 0, scale: 1.3, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, 4.26);

      tl.set({}, {}, 4.991);
      window.__timelines["23-comunidad"] = tl;
    })();
  </script>
</template>

      tl.fromTo("#f18-base", { scaleX: (headX(0) - 160) / 1600 }, { scaleX: 1, duration: HEAD_D,
        ease: function (s) {
          var a = (headX(0) - 160) / 1600, v = Math.max(0, Math.min(1, (headX(s) - 160) / 1600));
          return (v - a) / (1 - a);
        } }, 0);

      var G_Y = 0.32, G_O = 0.22;
      for (var i = 0; i < bars.length; i++) {
        var tp = headTime(168 + 26.84 * i);            /* head passes this bar */
        var gTot = Math.min(0.16, BAR_T[i] - tp - 0.004); /* full ghost rise length */
        var g0 = Math.max(0, tp), lag = g0 - tp;        /* bars the head passed before the cut start part-grown */
        var e0 = ghostEase(Math.min(1, lag / gTot));
        tl.fromTo(bars[i], { scaleY: G_Y * e0, opacity: G_O * e0, backgroundColor: "#1D0084" },
          { scaleY: G_Y, opacity: G_O, duration: Math.max(0.02, gTot - lag), ease: "power3.out" }, g0);
      }

      /* ===== Playhead records the voice: 0.12 -> 3.08, each bar is recorded over its ghost ===== */
      tl.fromTo("#f18-play-in", { opacity: 0, scaleY: 0.4 }, { opacity: 1, scaleY: 1, duration: 0.16, ease: "power3.out" }, 0.06);
      tl.fromTo("#f18-play", { x: 0 }, { x: 1600, duration: 2.96, ease: "none" }, 0.12);
      for (var i2 = 0; i2 < bars.length; i2++) {
        tl.fromTo(bars[i2], { scaleY: G_Y, opacity: G_O, backgroundColor: "#0b6df0" },
          { scaleY: 1, opacity: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, BAR_T[i2]);
        tl.to(bars[i2], { backgroundColor: "#1D0084", duration: 0.45, ease: "power1.out" }, BAR_T[i2] + 0.18);
      }

      /* ===== Pill: "DESDE EL DIA" on "primer" (0.56), the "1" stamps on "dia" (0.83) ===== */
      tl.fromTo("#f18-pill", { scale: 0.35, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.34, ease: "expo.out" }, 0.51);
      tl.fromTo("#f18-one", { scale: 0, rotation: -35 }, { scale: 1, rotation: 0, duration: 0.3, ease: "expo.out" }, 0.79);

      /* ===== Lead line: los / sonidos / que ===== */
      [["#f18-w-los", 1.14], ["#f18-w-sonidos", 1.31], ["#f18-w-que", 1.71]].forEach(function (p) {
        tl.fromTo(p[0], { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" }, p[1]);
      });
      /* ===== Main line: el español rises, NO / TIENE slam ===== */
      tl.fromTo("#f18-w-el", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 1.79);
      tl.fromTo("#f18-w-espanol", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 1.85);
      [["#f18-w-no", 2.22], ["#f18-w-tiene", 2.36]].forEach(function (p) {
        tl.fromTo(p[0], { scale: 1.35, opacity: 0, filter: "blur(12px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, p[1]);
      });

      /* ===== Seam (3.08-3.45, silence before "la ge"): pill + lead lift away, the waveform drops
               away, and "el español no tiene" condenses into a quiet label over the key row ===== */
      tl.fromTo(["#f18-pillrow", "#f18-lead"], { y: 0, filter: "blur(0px)" },
        { y: -170, filter: "blur(10px)", duration: 0.22, ease: "power2.in", immediateRender: false }, 3.08);
      tl.fromTo(["#f18-pillrow", "#f18-lead"], { opacity: 1 },
        { opacity: 0, duration: 0.15, ease: "power1.in", immediateRender: false }, 3.1);
      tl.fromTo("#f18-wave", { y: 0, opacity: 1, filter: "blur(0px)" },
        { y: 420, opacity: 0, filter: "blur(8px)", duration: 0.28, ease: "power2.in" }, 3.12);
      tl.fromTo("#f18-main", { x: 0, y: 0, scale: 1, opacity: 1, color: "#1D0084" },
        { x: 27, y: -195, scale: 0.4, opacity: 0.8, color: "#5A6480", duration: 0.34, ease: "power3.inOut" }, 3.1);
      tl.fromTo("#f18-row .f18-slot", { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out", stagger: 0.03 }, 3.22);

      /* ===== Keycaps press in on "la" and bottom out on the vowel ===== */
      var S_AIR = "0px 18px 0px #DDE6F5, 0px 70px 90px rgba(18,0,129,0.10)";
      var S_DOWN = "0px 0px 0px #DDE6F5, 0px 8px 18px rgba(18,0,129,0.14)";
      var S_REST = "0px 18px 0px #DDE6F5, 0px 30px 60px rgba(18,0,129,0.16)";
      var CUES = [3.45, 4.0, 4.8, 6.0];
      CUES.forEach(function (c, k) {
        var cap = $("f18-cap" + k), ring = $("f18-ring" + k), letter = $("f18-letter" + k);
        var hit = c + 0.1;
        tl.fromTo(cap, { opacity: 0 }, { opacity: 1, duration: 0.035, ease: "none" }, c);
        if (k === 0) {
          /* the first key continues the seam: it drops from high up, stretched by its own speed */
          tl.fromTo(cap, { y: -300, boxShadow: S_AIR },
            { y: 18, boxShadow: S_DOWN, duration: 0.1, ease: "power1.in" }, c);
          tl.fromTo(cap, { scaleX: 0.96, scaleY: 1.14 }, { scaleX: 1, scaleY: 1, duration: 0.07, ease: "power1.out" }, c + 0.03);
        } else {
          tl.fromTo(cap, { y: -90, scale: 1.08, boxShadow: S_AIR },
            { y: 18, scale: 1, boxShadow: S_DOWN, duration: 0.1, ease: "power2.in" }, c);
        }
        tl.to(cap, { y: 0, boxShadow: S_REST, duration: 0.34, ease: "power3.out" }, hit);
        tl.fromTo(letter, { color: "#0b6df0" }, { color: "#1D0084", duration: 0.6, ease: "power1.in" }, hit);
        tl.fromTo(ring, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.07, ease: "power2.out" }, hit - 0.02);
        tl.to(ring, { opacity: 0, scale: 1.12, duration: 0.5, ease: "power2.out" }, hit + 0.06);
        /* the pressed key "sounds": a mini waveform bursts out of it, centre-out ... */
        for (var j = 0; j < 11; j++) {
          tl.fromTo("#f18-b" + k + "-" + j, { opacity: 0, scaleY: 0.08, y: 26 },
            { opacity: 1, scaleY: 1, y: 0, duration: 0.16, ease: "power3.out" }, hit + Math.abs(j - 5) * 0.022);
        }
        /* ... and dies away as one unit (no orphan edge bars) */
        tl.fromTo("#f18-burst" + k, { opacity: 1, y: 0 },
          { opacity: 0, y: -14, duration: 0.2, ease: "power2.in", immediateRender: false }, hit + 0.3);
        /* three-frame impact jolt on the row */
        tl.to("#f18-row", { y: 5, duration: 0.033, ease: "none" }, hit);
        tl.to("#f18-row", { y: -3, duration: 0.033, ease: "none" }, hit + 0.033);
        tl.to("#f18-row", { y: 0, duration: 0.05, ease: "power1.out" }, hit + 0.066);
      });

      /* ===== 6.30: the rest of the new sounds, dim chips under the row (centred on the key axis) ===== */
      tl.fromTo("#f18-chips .f18-chip", { y: 18, opacity: 0 },
        { y: 0, opacity: 0.88, duration: 0.26, ease: "power3.out", stagger: 0.045 }, 6.3);
      /* the label clears the top band before the cut, so the end state == 19-delatan's start */
      tl.to("#f18-main", { y: -235, opacity: 0, duration: 0.22, ease: "power2.in" }, 6.56);

      window.__timelines["18-sonidos"] = tl;
    })();
  </script>

      const lineOp = [0.5, 0.32, 0.42, 0.6, 0.45, 0.34, 0.36];
      lines.forEach((el, i) => {
        tl.fromTo(el, { x: -620, opacity: lineOp[i] }, { x: 2300, opacity: lineOp[i], duration: 0.28 + (i % 3) * 0.04, ease: "none" }, lineAt[i]);
      });
      tl.fromTo(q("f14-dots"), { x: -168 }, { x: 0, duration: 0.7, ease: "power4.out" }, 0);
      tl.fromTo(q("f14-amb"), { x: -260, opacity: 0.4 }, { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 0);

      // laptop slides in with a directional motion-blur streak (blur envelope shares the move's ease)
      const slide = q("f14-slide");
      const sbn = q("f14-sbn");
      const bp = { v: 30 };
      const writeBlur = () => sbn.setAttribute("stdDeviation", bp.v.toFixed(2) + " 0");
      writeBlur();
      slide.style.filter = "url(#f14-sb)";
      const MOVE = 0.5;
      tl.fromTo(slide, { x: -780 }, { x: 0, duration: MOVE, ease: "expo.out" }, 0);
      tl.fromTo(slide, { opacity: 0.35 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, 0);
      tl.fromTo(bp, { v: 30 }, { v: 0, duration: MOVE, ease: "expo.out", onUpdate: writeBlur }, 0);
      tl.fromTo(q("f14-ltail"), { scaleX: 1, opacity: 1 }, { scaleX: 0.05, opacity: 0, duration: 0.36, ease: "expo.out" }, 0);
      tl.set(slide, { filter: "none" }, MOVE + 0.02);
      // the laptop swings into its 10° tilt while it travels, then drifts a hair for life
      tl.fromTo(q("f14-lap"), { rotationY: 26, rotationX: 3 }, { rotationY: 10, rotationX: 2, duration: 0.7, ease: "power3.out" }, 0);
      tl.to(q("f14-lap"), { rotationY: 8, duration: D - 0.7, ease: "power1.inOut" }, 0.7);
      // a glass sheen crosses the screen once as it lands
      tl.fromTo(q("f14-sheen"), { x: -620 }, { x: 1000, duration: 0.7, ease: "power2.inOut" }, 0.36);

      // macro camera: slow push-in on the laptop + deeper push into the "Hoja de ruta" on screen
      tl.fromTo(q("f14-push"), { scale: 1 }, { scale: 1.02, duration: D, ease: "power1.out" }, 0);
      tl.fromTo(q("f14-vzoom"), { scale: 1 }, { scale: 1.26, duration: D - 1.0, ease: "power2.inOut" }, 1.0);

      // checklist card rides the same sweep (a farther plane: shorter travel, soft focus pull)
      tl.fromTo(q("f14-card"), { x: -240, filter: "blur(12px)" },
        { x: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0.02);
      tl.fromTo(q("f14-card"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, 0.02);

      // pill
      tl.fromTo(q("f14-pill"), { opacity: 0, x: -44 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.06);

      // ================= CHECKLIST — each row on its cue, ✓ draws 0.2 s later =================
      const ROWS = [
        { n: 1, t: 0.12, y: 0, h: 108, skel: ["f14-s1"] },
        { n: 2, t: 0.99, y: 108, h: 108, skel: ["f14-s2"] },
        { n: 3, t: 2.46, y: 216, h: 108, skel: ["f14-s3k"] },
        { n: 4, t: 3.39, y: 324, h: 108, skel: ["f14-s4"] },
        { n: 5, t: 4.43, y: 432, h: 154, skel: ["f14-s5", "f14-s5b"] }
      ];
      const hl = q("f14-hl");
      const cnum = q("f14-cnum");
      const barfill = q("f14-barfill");
      tl.fromTo(barfill, { scaleX: 0 }, { scaleX: 0, duration: 0.01, ease: "none" }, 0);
      tl.fromTo(hl, { opacity: 0, y: 0, height: 108 }, { opacity: 1, y: 0, height: 108, duration: 0.2, ease: "power2.out" }, 0.08);

      ROWS.forEach((r, i) => {
        const T = r.t - 0.04;
        // text lands, skeleton bar dissolves under it
        tl.fromTo(q("f14-x" + r.n), { opacity: 0, x: -28, filter: "blur(6px)" },
          { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, T);
        r.skel.forEach((s) => {
          tl.fromTo(q(s), { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power1.out" }, T);
        });
        // active-row highlight travels down to this row
        if (i > 0) {
          const p = ROWS[i - 1];
          tl.fromTo(hl, { y: p.y, height: p.h }, { y: r.y, height: r.h, duration: 0.3, ease: "power3.out", immediateRender: false }, T);
        }
        // ✓ pop (overshoot allowed for check pops) + tick draw + ring burst
        const C = r.t + 0.2;
        tl.fromTo(q("f14-f" + r.n), { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2.2)" }, C - 0.03);
        tl.fromTo(q("f14-t" + r.n), { strokeDashoffset: 34 }, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, C);
        tl.fromTo(q("f14-b" + r.n), { opacity: 0.85, scale: 1 }, { opacity: 0, scale: 1.75, duration: 0.45, ease: "power2.out", immediateRender: false }, C);
        // counter + progress bar
        tl.set(cnum, { textContent: String(r.n) }, C);
        tl.fromTo(barfill, { scaleX: (r.n - 1) / 5 }, { scaleX: r.n / 5, duration: 0.32, ease: "power3.out", immediateRender: false }, C);
        tl.fromTo(q("f14-count"), { scale: 1.18 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, C);
      });
      // 5/5 — list complete: bar turns green, counter goes green
      tl.fromTo(q("f14-bargreen"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 4.78);
      tl.fromTo(q("f14-count"), { color: "#1D0084" }, { color: "#16A34A", duration: 0.3, ease: "power2.out" }, 4.78);
      tl.fromTo(hl, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power1.out", immediateRender: false }, 4.9);

      // ================= CALLOUT (2.6–3.9): Dutch subtitle bubble over the laptop =================
      const BUB = 2.6;
      const bub = q("f14-bub");
      tl.fromTo(bub, { opacity: 0, scale: 0.5, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "expo.out" }, BUB - 0.05);
      Array.from(document.querySelectorAll("#f14-nl .f14-nw")).forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, BUB + i * 0.055);
      });
      tl.fromTo(q("f14-gloss"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, BUB + 0.36);
      // settles smaller, docking on the screen's lower-left like a subtitle
      tl.to(bub, { scale: 0.7, x: -4, y: 18, duration: 0.5, ease: "power3.inOut" }, 3.48);

      // ================= SCENE 3 (5.72–8.03): checklist leaves upward, MAÑANA MISMO rises =================
      const card = q("f14-card");
      tl.fromTo(card, { y: 0, filter: "blur(0px)" }, { y: -880, filter: "blur(14px)", duration: 0.34, ease: "power3.in", immediateRender: false }, 5.72);
      tl.fromTo(card, { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none", immediateRender: false }, 5.96);

      const LW = [["lo", 6.0], ["que", 6.12], ["te", 6.21], ["hace", 6.32], ["falta", 6.55]];
      LW.forEach(([id, t]) => {
        tl.fromTo(q("f14-w-" + id), { opacity: 0, y: 64, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, t - 0.04);
      });

      // MAÑANA — white word-chip slams on "mañana"
      tl.fromTo(q("f14-chip"), { opacity: 0, scale: 1.42, rotation: -1.5, filter: "blur(14px)" },
        { opacity: 1, scale: 1, rotation: -1.5, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 6.84);
      tl.fromTo(q("f14-s3glow"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 6.86);
      // deterministic 3-frame landing shake
      const s3 = q("f14-s3");
      tl.set(s3, { x: 0, y: 0 }, 0);
      tl.set(s3, { x: 7, y: -3 }, 6.98);
      tl.set(s3, { x: -5, y: 2 }, 7.013);
      tl.set(s3, { x: 2, y: -1 }, 7.046);
      tl.set(s3, { x: 0, y: 0 }, 7.08);

      // MISMO — slams on "mismo."
      tl.fromTo(q("f14-mis"), { opacity: 0, y: 56, scale: 1.2, filter: "blur(10px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, 7.23);

      window.__timelines = window.__timelines || {};
      window.__timelines["14-supervivencia"] = tl;
    })();
  </script>

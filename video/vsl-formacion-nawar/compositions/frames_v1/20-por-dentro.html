  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // ---------- path lengths (deterministic bezier LUT; scaled to the browser's own length) ----------
      const SEGS = [
        [120, 840, 210, 830, 250, 790, 300, 760],
        [300, 760, 420, 690, 500, 520, 640, 520],
        [640, 520, 780, 520, 840, 720, 980, 720],
        [980, 720, 1120, 720, 1180, 470, 1320, 470],
        [1320, 470, 1460, 470, 1540, 660, 1640, 660],
        [1640, 660, 1720, 660, 1760, 620, 1820, 600]
      ];
      function bez(s, t) {
        const u = 1 - t;
        return [u * u * u * s[0] + 3 * u * u * t * s[2] + 3 * u * t * t * s[4] + t * t * t * s[6],
                u * u * u * s[1] + 3 * u * u * t * s[3] + 3 * u * t * t * s[5] + t * t * t * s[7]];
      }
      function segLen(s) {
        let len = 0, p = bez(s, 0);
        for (let i = 1; i <= 600; i++) { const q = bez(s, i / 600); len += Math.hypot(q[0] - p[0], q[1] - p[1]); p = q; }
        return len;
      }
      const SL = SEGS.map(segLen);
      let Llut = 0; SL.forEach((v) => { Llut += v; });
      let L = Llut;
      try { const b = document.getElementById("f20-road").getTotalLength(); if (b > 100) L = b; } catch (e) {}
      const k = L / Llut;
      const lenN1 = SL[0] * k;
      const lenN2 = (SL[0] + SL[1]) * k;
      let segL = SL[2];
      try { const b2 = document.getElementById("f20-streak-head").getTotalLength(); if (b2 > 50) segL = b2; } catch (e) {}

      const prog = document.getElementById("f20-prog");
      prog.style.strokeDasharray = L + " " + (2 * L);
      const TAIL = 170, HEAD = 2, BIG = segL * 4;
      document.getElementById("f20-streak-tail").style.strokeDasharray = TAIL + " " + BIG;
      document.getElementById("f20-streak-head").style.strokeDasharray = HEAD + " " + BIG;
      document.getElementById("f20-streak-glow").style.strokeDasharray = 60 + " " + BIG;

      // ================= ENTRANCE (0.00–0.45): laptop rushes toward camera =================
      tl.fromTo("#f20-lap",
        { scale: 0.4, rotationX: 16, y: 70, opacity: 0.75, filter: "blur(10px)" },
        { scale: 1, rotationX: 0, y: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0);
      tl.fromTo("#f20-dots1", { scale: 0.86 }, { scale: 1, duration: 0.45, ease: "expo.out" }, 0);

      // ---------- heading words on their cues ----------
      [["#f20-w-como", 0.10], ["#f20-w-es", 0.31]].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0, y: 34, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.26, ease: "power3.out" }, t);
      });
      tl.fromTo("#f20-w-por", { opacity: 0, y: 40, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, 0.39);
      tl.fromTo("#f20-w-dentro", { opacity: 0, scale: 1.3, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0.51);

      // ================= DIVE (0.53–1.22): camera plunges INTO the screen (zoom-through) =================
      tl.set("#f20-cam", { scale: 1, filter: "blur(0px)", opacity: 1, immediateRender: true }, 0);
      tl.fromTo("#f20-cam", { scale: 1 }, { scale: 4.6, duration: 0.69, ease: "power3.in", immediateRender: false }, 0.53);
      tl.fromTo("#f20-cam", { filter: "blur(0px)" }, { filter: "blur(18px)", duration: 0.14, ease: "power2.in", immediateRender: false }, 1.04);
      tl.fromTo("#f20-cam", { opacity: 1 }, { opacity: 0, duration: 0.10, ease: "none", immediateRender: false }, 1.12);
      tl.set("#f20-cam", { opacity: 0 }, 1.22);
      // the screen floods solid Nawar blue as we pass through it (fully opaque by 1.12), so no white/indigo mix
      tl.fromTo("#f20-tint", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.in" }, 0.98);

      // ================= LANDING (1.06): module path grows out of the module rows, overlapping the dive =================
      tl.set("#f20-map", { opacity: 0, scale: 0.55, filter: "blur(14px)", immediateRender: true }, 0);
      tl.fromTo("#f20-map", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, 1.06);
      tl.fromTo("#f20-map", { scale: 0.55 }, { scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, 1.06);   // at scale 1 from ~1.55 s (handoff-exact)
      tl.fromTo("#f20-map", { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.3, ease: "expo.out", immediateRender: false }, 1.06);

      tl.fromTo("#f20-pill", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.3);

      // progress overlay: start -> N1 (N1 already completed)
      tl.fromTo(prog, { strokeDashoffset: L + 20 }, { strokeDashoffset: L - lenN1, duration: 0.16, ease: "power2.out" }, 1.16);

      // nodes pop along the road on "Cada módulo"
      const POPS = [1.30, 1.43, 1.56, 1.69, 1.82];
      POPS.forEach((T, i) => {
        const n = i + 1;
        tl.fromTo("#f20-n" + n, { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "expo.out" }, T);
        tl.fromTo("#f20-lb" + n, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, T + 0.06);
      });
      // N1 check pops in
      tl.fromTo("#f20-ck1", { scale: 0.4 }, { scale: 1, duration: 0.34, ease: "back.out(2.4)" }, 1.32);
      tl.fromTo("#f20-ckp1", { strokeDashoffset: 50 }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 1.36);

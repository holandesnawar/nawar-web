<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Poppins"; font-weight: 600; font-style: normal; src: url("assets/fonts/poppins-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Poppins"; font-weight: 700; font-style: normal; src: url("assets/fonts/poppins-latin-700-normal.woff2") format("woff2"); }
    @font-face { font-family: "Poppins"; font-weight: 800; font-style: normal; src: url("assets/fonts/poppins-latin-800-normal.woff2") format("woff2"); }

    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Poppins", sans-serif; }

    /* ---------- ground: paper (frame 10's world) flooded by the nawar-blue iris ---------- */
    #f11-ground { position: absolute; inset: 0; overflow: hidden; background: #F5F7FF; }
    #f11-paper-dots {
      position: absolute; inset: -40px;
      background-image: radial-gradient(circle, rgba(29,0,132,0.07) 1.6px, transparent 1.7px);
      background-size: 28px 28px; background-position: 14px 14px;
    }
    #f11-blue { position: absolute; inset: 0; overflow: hidden; clip-path: circle(0px at 960px 540px); }
    #f11-blue-grad {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 44%, #025dc7 0%, #120081 72%);
    }
    #f11-blue-dots {
      position: absolute; inset: -60px;
      background-image: radial-gradient(circle, rgba(255,255,255,0.07) 1.6px, transparent 1.7px);
      background-size: 28px 28px; background-position: 14px 14px;
    }
    #f11-vig {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 72% 70% at 50% 46%, rgba(4,0,40,0) 52%, rgba(4,0,40,0.42) 100%);
    }

    /* iris edge: white flash ring + soft sky glow riding the clip radius */
    #f11-ring { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }

    /* ---------- stage (camera) ---------- */
    #f11-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 50% 46%; }
    #f11-hero { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

    #f11-rays {
      position: absolute; left: -340px; top: -760px; width: 2600px; height: 2600px; border-radius: 50%;
      background:
        repeating-conic-gradient(from 0deg at 50% 50%,
          rgba(255,255,255,0.06) 0deg 2.4deg, rgba(255,255,255,0) 3.4deg 13deg, rgba(255,255,255,0.06) 14deg),
        repeating-conic-gradient(from 5deg at 50% 50%,
          rgba(159,213,245,0.05) 0deg 5deg, rgba(159,213,245,0) 6.5deg 21deg, rgba(159,213,245,0.05) 22.5deg);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, rgba(0,0,0,0.75) 14%, rgba(0,0,0,0.25) 30%, rgba(0,0,0,0) 46%);
      mask-image: radial-gradient(circle at 50% 50%, #000 0%, rgba(0,0,0,0.75) 14%, rgba(0,0,0,0.25) 30%, rgba(0,0,0,0) 46%);
    }
    #f11-glow {
      position: absolute; left: 260px; top: 150px; width: 1400px; height: 780px; border-radius: 50%;
      background: radial-gradient(ellipse at 50% 50%, rgba(77,163,255,0.62) 0%, rgba(77,163,255,0.26) 34%, rgba(77,163,255,0.08) 56%, rgba(77,163,255,0) 70%);
    }
    #f11-core {
      position: absolute; left: 610px; top: 400px; width: 700px; height: 280px; border-radius: 50%;
      background: radial-gradient(ellipse at 50% 50%, rgba(159,213,245,0.55) 0%, rgba(159,213,245,0) 70%);
    }

    #f11-sparks { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .f11-spark { position: absolute; width: 0; height: 0; }
    .f11-streak {
      position: absolute; left: 0; top: -4px; height: 8px; border-radius: 4px; transform-origin: 0% 50%;
      background: linear-gradient(90deg, rgba(159,213,245,0) 0%, rgba(159,213,245,0.7) 45%, #FFFFFF 100%);
      box-shadow: 0 0 18px rgba(159,213,245,0.55);
    }

    #f11-logo-wrap {
      position: absolute; left: 550px; top: 394px; width: 820px; height: 292.5px;
      filter: drop-shadow(0 26px 44px rgba(4,0,40,0.55));
    }
    #f11-logo { position: absolute; left: 0; top: 0; width: 820px; height: 292.5px; display: block; }
    #f11-shine-mask {
      position: absolute; left: 0; top: 0; width: 820px; height: 292.5px; overflow: hidden; mix-blend-mode: screen;
      -webkit-mask-image: url("assets/img/logo-nawar.png"); -webkit-mask-size: 100% 100%; -webkit-mask-repeat: no-repeat;
      mask-image: url("assets/img/logo-nawar.png"); mask-size: 100% 100%; mask-repeat: no-repeat;
    }
    #f11-shine {
      position: absolute; left: 0; top: -60px; width: 260px; height: 420px;
      background: linear-gradient(112deg, rgba(255,255,255,0) 22%, rgba(255,255,255,0.14) 38%, rgba(255,255,255,0.6) 48.5%, rgba(255,255,255,0.6) 51.5%, rgba(255,255,255,0.14) 62%, rgba(255,255,255,0) 78%);
    }

    /* ---------- the lead line ---------- */
    #f11-line {
      position: absolute; left: 0; top: 664px; width: 1920px; display: flex; justify-content: center; align-items: baseline;
      gap: 0.25em; font-family: "Poppins", sans-serif; font-size: 100px; line-height: 1.1; letter-spacing: -0.03em;
      color: #FFFFFF; white-space: nowrap;
    }
    .f11-w { display: inline-block; font-weight: 700; text-shadow: 0 12px 40px rgba(4,0,40,0.38); }
    #f11-w-cambiar { font-weight: 800; color: #4da3ff; transform-origin: 20% 62%;
      text-shadow: 0 0 46px rgba(77,163,255,0.45), 0 12px 40px rgba(4,0,40,0.38); }
    #f11-w-eso { font-weight: 800; }
  </style>

  <div id="root" data-composition-id="11-nawar-nace" data-width="1920" data-height="1080" data-duration="1.954">
    <div id="f11-ground" class="clip" data-start="0" data-duration="1.954" data-track-index="0">
      <div id="f11-paper-dots"></div>
      <div id="f11-blue">
        <div id="f11-blue-grad"></div>
        <div id="f11-blue-dots"></div>
        <div id="f11-vig"></div>
      </div>
    </div>

    <svg id="f11-ring" viewBox="0 0 1920 1080" aria-hidden="true">
      <defs>
        <filter id="f11-ring-blur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="16" />
        </filter>
      </defs>
      <g id="f11-ring-g">
        <circle id="f11-ring-out" cx="960" cy="540" r="0" fill="none" stroke="#025dc7" stroke-opacity="0.2" stroke-width="70" filter="url(#f11-ring-blur)" />
        <circle id="f11-ring-soft" cx="960" cy="540" r="0" fill="none" stroke="#9fd5f5" stroke-opacity="0.55" stroke-width="70" filter="url(#f11-ring-blur)" />
        <circle id="f11-ring-hard" cx="960" cy="540" r="0" fill="none" stroke="#FFFFFF" stroke-width="14" />
      </g>
    </svg>

    <div id="f11-stage">
      <div id="f11-hero">
        <div id="f11-rays"></div>
        <div id="f11-glow"></div>
        <div id="f11-core"></div>
        <div id="f11-sparks"></div>
        <div id="f11-logo-wrap">
          <img id="f11-logo" src="assets/img/logo-nawar.png" alt="Nawar" />
          <div id="f11-shine-mask"><div id="f11-shine"></div></div>
        </div>
      </div>
      <div id="f11-line">
        <span id="f11-w-nace" class="f11-w">nace</span>
        <span id="f11-w-para" class="f11-w">para</span>
        <span id="f11-w-cambiar" class="f11-w">cambiar</span>
        <span id="f11-w-eso" class="f11-w">eso.</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const q = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const D = 1.954;
      const LEAD = 0.04;
      // cue table (frame-relative seconds, from the packet)
      const T = { nawar: 0.12, nace: 0.509, para: 0.778, cambiar: 0.963, eso: 1.296 };

      // ---------------- deterministic spark burst around the logo ----------------
      const sparks = q("f11-sparks");
      const N = 12;
      const streaks = [];
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2 + 0.26;
        const cx = 960 + Math.cos(a) * 480;
        const cy = 540 + Math.sin(a) * 205;
        const s = document.createElement("div");
        s.className = "f11-spark";
        s.style.left = cx.toFixed(1) + "px";
        s.style.top = cy.toFixed(1) + "px";
        // outward direction of the ellipse normal
        const nx = Math.cos(a) / 480, ny = Math.sin(a) / 205;
        s.style.transform = "rotate(" + (Math.atan2(ny, nx) * 180 / Math.PI).toFixed(2) + "deg)";
        const k = document.createElement("div");
        k.className = "f11-streak";
        k.style.width = [120, 84, 150, 100][i % 4] + "px";
        s.appendChild(k);
        sparks.appendChild(s);
        streaks.push(k);
      }

      // ---------------- Scene 1 — iris floods the frame with nawar-blue ----------------
      const blue = q("f11-blue");
      const ringSoft = q("f11-ring-soft");
      const ringHard = q("f11-ring-hard");
      const ringOut = q("f11-ring-out");
      const iris = { r: 70 };
      function writeIris() {
        const r = iris.r.toFixed(1);
        blue.style.clipPath = "circle(" + r + "px at 960px 540px)";
        ringSoft.setAttribute("r", Math.max(0, iris.r - 26).toFixed(1));
        ringOut.setAttribute("r", (iris.r + 34).toFixed(1));
        ringHard.setAttribute("r", r);
      }
      writeIris();
      tl.fromTo(iris, { r: 70 }, { r: 1180, duration: 0.36, ease: "power2.out", onUpdate: writeIris }, 0);
      tl.fromTo(q("f11-ring-g"), { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.in" }, 0.18);
      // paper grid is shoved outward by the wavefront; blue grid rushes in from depth
      tl.fromTo(q("f11-paper-dots"), { scale: 1 }, { scale: 1.14, duration: 0.36, ease: "power2.out" }, 0);
      tl.fromTo(q("f11-blue-dots"), { scale: 1.32 }, { scale: 1, duration: 0.7, ease: "power3.out" }, 0);

      // ---------------- "Nawar" — the logo blooms ----------------
      const t0 = T.nawar - 0.02;
      const wrap = q("f11-logo-wrap");
      tl.fromTo(wrap, { scale: 0.55 }, { scale: 1.04, duration: 0.28, ease: "power3.out" }, t0);
      tl.to(wrap, { scale: 1, duration: 0.3, ease: "power2.inOut" }, t0 + 0.28);
      tl.fromTo(wrap, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, t0);
      tl.fromTo(q("f11-logo"), { filter: "blur(16px)" }, { filter: "blur(0px)", duration: 0.26, ease: "power2.out" }, t0);

      tl.fromTo(q("f11-glow"), { opacity: 0, scale: 0.45 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, t0);
      tl.fromTo(q("f11-core"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t0);
      tl.fromTo(q("f11-rays"), { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, t0);
      tl.fromTo(q("f11-rays"), { rotation: -5 }, { rotation: 7, duration: D - t0, ease: "none" }, t0);

      streaks.forEach((k, i) => {
        const at = t0 + 0.05 + (i % 3) * 0.012;
        tl.fromTo(k, { x: -30, opacity: 0, scaleX: 0.25 },
          { x: 40, opacity: 1, scaleX: 1, duration: 0.1, ease: "power2.out" }, at);
        tl.to(k, { x: 190 + (i % 4) * 22, opacity: 0, scaleX: 0.35, duration: 0.34, ease: "power2.out" }, at + 0.1);
      });

      // light-sweep band crosses the logo once (0.35–0.9)
      tl.fromTo(q("f11-shine"), { x: -380 }, { x: 860, duration: 0.55, ease: "power2.inOut" }, 0.35);

      // ---------------- Scene 2 — logo eases up, the line builds on the voice ----------------
      tl.fromTo(q("f11-hero"), { y: 0 }, { y: -90, duration: 0.6, ease: "power2.out" }, 0.38);

      const rise = (el, cue) =>
        tl.fromTo(el, { opacity: 0, y: 46, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, cue - LEAD);
      rise(q("f11-w-nace"), T.nace);
      rise(q("f11-w-para"), T.para);
      tl.fromTo(q("f11-w-cambiar"), { opacity: 0, scale: 1.3, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, T.cambiar - LEAD);
      rise(q("f11-w-eso"), T.eso);

      // macro camera: a quiet push under the whole beat (monotonic, no breathing)
      tl.fromTo(q("f11-stage"), { scale: 1 }, { scale: 1.025, duration: D - 0.38, ease: "power1.inOut" }, 0.38);

      window.__timelines = window.__timelines || {};
      window.__timelines["11-nawar-nace"] = tl;
    })();
  </script>
</template>

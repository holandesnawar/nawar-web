          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.26, ease: "power3.out" }, t);
      });
      tl.fromTo("#f22-w-clase", { opacity: 0, scale: 1.3, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 1.12);
      tl.fromTo("#f22-w-en", { opacity: 0, y: 40, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, 1.40);
      tl.fromTo("#f22-w-directo", { opacity: 0, scale: 1.3, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 1.50);

      // "semana": the Thursday column lights up week after week, the ring locks on the 24th
      [["#f22-r17", 0.47], ["#f22-r01", 0.59], ["#f22-r08", 0.65]].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0, scale: 1.5 }, { opacity: 0.95, scale: 1, duration: 0.18, ease: "expo.out" }, t);
        tl.to(sel, { opacity: 0, duration: 0.3, ease: "power1.out" }, t + 0.22);
      });
      tl.fromTo("#f22-r24", { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.26, ease: "expo.out" }, 0.53);
      tl.to("#f22-r24", { scale: 1.12, duration: 0.07, ease: "power2.out" }, 0.80);
      tl.to("#f22-r24", { scale: 1, duration: 0.3, ease: "power3.out" }, 0.872);

      // camera pushes toward the entry: device push + screen zoom (nested scale / counter-translate)
      tl.fromTo("#f22-push", { scale: 1 }, { scale: 1.1, duration: 0.94, ease: "power3.inOut" }, 0.51);
      tl.to("#f22-push", { scale: 1.125, duration: 0.39, ease: "none" }, 1.45);
      tl.to("#f22-lap", { rotationY: 0, duration: 0.94, ease: "power3.inOut" }, 0.51);
      tl.fromTo("#f22-zo", { scale: 1 }, { scale: ZOOM, duration: 0.94, ease: "power3.inOut" }, 0.51);
      tl.fromTo("#f22-zi", { x: 0, y: 0 }, { x: TX, y: TY, duration: 0.94, ease: "power3.inOut" }, 0.51);

      // "directo": the red EN DIRECTO pill pops on the class
      tl.fromTo("#f22-live", { opacity: 0, scale: 0.35, rotation: -10 },
        { opacity: 1, scale: 1, rotation: -3, duration: 0.34, ease: "expo.out" }, 1.52);
      tl.fromTo("#f22-liveburst", { opacity: 0.9, scale: 1 },
        { opacity: 0, scale: 1.4, duration: 0.34, ease: "power2.out", immediateRender: false }, 1.58);
      tl.set("#f22-liveburst", { opacity: 0 }, 0);
      tl.fromTo("#f22-liveping", { opacity: 0.9, scale: 1 },
        { opacity: 0, scale: 2.6, duration: 0.5, ease: "power2.out" }, 1.62);

      // ---------- seam 1 -> 2 (cut-the-curve whip, leftward) on "con" ----------
      // outgoing whips left at FULL opacity (accelerating), hard swap, incoming continues left (decelerating)
      const WHIP1 = 1.72, CUT1 = 1.88;
      tl.set("#f22-s1", { opacity: 1 }, 0);
      tl.set("#f22-s2", { opacity: 0 }, 0);
      tl.to("#f22-s1", { x: -700, filter: "blur(14px)", duration: CUT1 - WHIP1, ease: "power3.in" }, WHIP1);
      tl.set("#f22-s1", { opacity: 0 }, CUT1);
      tl.set("#f22-s2", { opacity: 1 }, CUT1);
      tl.to("#f22-dots", { x: -90, duration: 0.6, ease: "power2.inOut" }, WHIP1);

      // =====================================================================
      // SCENE 2 (1.88–3.26) — live class with a native teacher; correction
      // =====================================================================
      tl.fromTo("#f22-call", { x: 700, filter: "blur(14px)" }, { x: 0, filter: "blur(0px)", duration: 0.36, ease: "power4.out" }, CUT1);
      [["#f22-w-con", 1.86], ["#f22-w-profesores", 1.99]].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0, x: 230 }, { opacity: 1, x: 0, duration: 0.32, ease: "power4.out" }, t);
      });
      // active-speaker highlight + name tag
      tl.fromTo("#f22-speaker", { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, 2.10);
      tl.fromTo("#f22-tag", { opacity: 0, scale: 0.6, x: -12 },
        { opacity: 1, scale: 1, x: 0, duration: 0.3, ease: "expo.out" }, 2.12);

      // "que te": the student's attempt arrives
      tl.fromTo("#f22-w-que", { opacity: 0, y: 34, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, 2.53);
      tl.fromTo("#f22-w-te", { opacity: 0, y: 34, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, 2.64);
      tl.fromTo("#f22-bubA", { opacity: 0, scale: 0.6, x: 40 },
        { opacity: 1, scale: 1, x: 0, duration: 0.3, ease: "expo.out" }, 2.53);

      // "corrigen": strike + correction
      tl.fromTo("#f22-w-corrigen", { opacity: 0, scale: 1.3, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 2.75);
      tl.fromTo("#f22-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "power2.out" }, 2.78);
      tl.fromTo("#f22-bubB", { opacity: 0, scale: 0.55, x: -40 },
        { opacity: 1, scale: 1, x: 0, duration: 0.32, ease: "expo.out" }, 2.80);
      tl.fromTo("#f22-check", { scale: 0.3 }, { scale: 1, duration: 0.34, ease: "back.out(2.4)" }, 2.83);
      tl.fromTo("#f22-tick", { strokeDashoffset: 48 }, { strokeDashoffset: 0, duration: 0.16, ease: "power2.out" }, 2.86);
      // the wrong attempt recedes: grey text + slight shrink, bubble stays opaque white so the strike stays alert-red
      tl.fromTo("#f22-txtA", { color: "#0C0C1E" }, { color: "#9AA3B8", duration: 0.2, ease: "power2.out", immediateRender: false }, 2.92);
      tl.to("#f22-bubA", { scale: 0.92, duration: 0.2, ease: "power2.out" }, 2.92);

      // ---------- seam 2 -> 3 (inverse zoom-through, arrival) on "y te hacen" ----------
      // outgoing recedes (scale down, accelerating) at full opacity; hard swap; incoming keeps receding into place
      const SEAM2 = 3.17, CUT2 = 3.26;
      tl.to("#f22-s2", { scale: 0.86, filter: "blur(10px)", duration: CUT2 - SEAM2, ease: "power3.in" }, SEAM2);
      tl.set("#f22-s2", { opacity: 0 }, CUT2);

      // =====================================================================
      // SCENE 3 (3.26–4.22) — mic + five voice bars; HABLAR on "hablar"
      // =====================================================================
      tl.set("#f22-s3", { opacity: 0, scale: 1.18, filter: "blur(10px)" }, 0);
      tl.set("#f22-s3", { opacity: 1 }, CUT2);
      tl.fromTo("#f22-s3", { scale: 1.18, filter: "blur(10px)" },
        { scale: 1, filter: "blur(0px)", duration: 0.28, ease: "power4.out", immediateRender: false }, CUT2);
      // "hacen" on its own cue (the "y te" lead arrives with the cut)
      tl.fromTo("#f22-w-hacen", { opacity: 0, y: 30, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 3.32);
      tl.fromTo("#f22-dots", { scale: 1 }, { scale: 1.06, duration: 0.5, ease: "expo.out", immediateRender: false }, CUT2);

      // HABLAR slams on the voice
      tl.fromTo("#f22-w-hablar", { opacity: 0, scale: 1.55, filter: "blur(12px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 3.55);
      tl.fromTo("#f22-s3in", { y: 0 }, { y: 9, duration: 0.04, ease: "power1.out" }, 3.70);
      tl.to("#f22-s3in", { y: -4, duration: 0.05, ease: "power1.inOut" }, 3.742);
      tl.to("#f22-s3in", { y: 0, duration: 0.07, ease: "power1.out" }, 3.794);
      tl.fromTo("#f22-vglow", { opacity: 0.45, scale: 0.9 }, { opacity: 1, scale: 1.08, duration: 0.4, ease: "power2.out" }, 3.57);
      [["#f22-mring1", 3.57], ["#f22-mring2", 3.72]].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0.85, scale: 1 }, { opacity: 0, scale: 1.9, duration: 0.42, ease: "power2.out", immediateRender: false }, t);
        tl.set(sel, { opacity: 0 }, 0);
      });
      tl.fromTo("#f22-mic", { scale: 1 }, { scale: 1.08, duration: 0.06, ease: "power2.out" }, 3.57);
      tl.to("#f22-mic", { scale: 1, duration: 0.3, ease: "power3.out" }, 3.63);

      // five voice bars: deterministic bounce, quiet on "hacen", full on "hablar", resting pose at the end
      const BAR_H = 230, BAR_MIN = 46;
      const REST = [0.42, 0.78, 1.0, 0.64, 0.34];
      const STEP = 0.07;
      for (let i = 0; i < 5; i++) {
        const sel = "#f22-bar" + i;
        tl.fromTo(sel, { height: BAR_MIN }, { height: BAR_MIN, duration: 0.01, ease: "none" }, 0);
        let t = CUT2 + 0.02, k = 0;
        while (t < 4.06) {
          const amp = t < 3.56 ? 0.26 : 0.8;
          const v = 0.2 + amp * (0.5 + 0.5 * Math.sin(2.3 * k + 1.9 * i + 0.7 * i * i));
          tl.to(sel, { height: Math.round(BAR_H * Math.min(1, v)), duration: STEP, ease: "sine.inOut" }, t);
          t += STEP; k++;
        }
        tl.to(sel, { height: Math.round(BAR_H * REST[i]), duration: 0.12, ease: "power2.out" }, t);
      }

      window.__timelines["22-clase-directo"] = tl;
    })();
  </script>

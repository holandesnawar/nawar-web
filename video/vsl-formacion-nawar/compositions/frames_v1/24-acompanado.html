  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const SVGNS = "http://www.w3.org/2000/svg";
      const HUB = { x: 960, y: 470 };
      const DUR = 2.589;
      // SHARED GEOMETRY: [id, cx, cy, diameter]
      const AV = [["MA", 560, 300, 104], ["JL", 760, 230, 88], ["SO", 1180, 220, 96], ["PE", 1380, 310, 104], ["LU", 1500, 470, 88], ["AN", 1390, 640, 100], ["CR", 1160, 720, 88], ["DI", 760, 720, 96], ["RO", 540, 640, 88], ["VA", 420, 470, 100], ["IS", 320, 250, 72], ["TO", 1600, 230, 72], ["EL", 1640, 780, 76], ["GA", 300, 780, 76]];

      // camera constants
      const S_END = 0.35;          // block: constellation scales 1 -> 0.35
      const CAM_UP = -122;         // scene-2 tilt: hub rises 470 -> 348 (screen)
      const KEEP = 1.43;           // counter-scale on discs + pill so they stay readable (effective 0.5)

      // deterministic hash
      const hh = (i, j, k) => { const v = Math.sin(i * 127.1 + j * 311.7 + k * 74.7 + 0.5) * 43758.5453; return v - Math.floor(v); };

      // ---------- build the community field: jittered grid of member dots + sparse mesh ----------
      const dotsG = document.getElementById("f24-dots-g");
      const meshG = document.getElementById("f24-mesh-g");
      const STEP_X = 132, STEP_Y = 124, X0 = -1960, Y0 = -1010, COLS = 45, ROWS = 31;
      const PAL = ["#FFFFFF", "#9fd5f5", "#4da3ff", "#0b6df0", "#FFFFFF", "#9fd5f5"];
      const grid = [];
      const dots = [];
      // final-state screen mapping (for culling the wave to visible dots)
      const toScreen = (x, y) => ({ x: HUB.x + (x - HUB.x) * S_END, y: HUB.y + CAM_UP + (y - HUB.y) * S_END });
      for (let j = 0; j < ROWS; j++) {
        grid.push([]);
        for (let i = 0; i < COLS; i++) {
          const x = X0 + i * STEP_X + (hh(i, j, 1) - 0.5) * STEP_X * 0.78;
          const y = Y0 + j * STEP_Y + (hh(i, j, 2) - 0.5) * STEP_Y * 0.78;
          const ex = (x - HUB.x) / 860, ey = (y - HUB.y) / 450;
          if (ex * ex + ey * ey < 1) { grid[j].push(null); continue; }
          const big = hh(i, j, 3) < 0.11;
          const r = big ? 20 + hh(i, j, 4) * 9 : 8.5 + hh(i, j, 4) * 7.5;
          const fill = big ? ["#0b6df0", "#9fd5f5", "#FFFFFF", "#4da3ff", "#21468C"][Math.floor(hh(i, j, 5) * 5)] : PAL[Math.floor(hh(i, j, 5) * PAL.length)];
          const op = big ? 0.95 : 0.38 + hh(i, j, 6) * 0.42;
          const c = document.createElementNS(SVGNS, "circle");
          c.setAttribute("cx", x.toFixed(1));
          c.setAttribute("cy", y.toFixed(1));
          c.setAttribute("r", "0");
          c.setAttribute("fill", fill);
          if (big && fill === "#21468C") { c.setAttribute("stroke", "#FFFFFF"); c.setAttribute("stroke-width", "4"); }
          c.style.opacity = "0";
          dotsG.appendChild(c);
          const d = Math.hypot(x - HUB.x, y - HUB.y);
          const s = toScreen(x, y);
          const dot = { el: c, x, y, r, op, d, big, vis: s.x > -30 && s.x < 1950 && s.y > -30 && s.y < 1110 };
          dots.push(dot);
          grid[j].push(dot);
        }
      }
      // mesh: sparse neighbour links, grouped into distance bands so each band fades as one path
      const BANDS = [1150, 1550, 2050, 2650, 3300, 1e9];
      const bandOf = (d) => BANDS.findIndex((b) => d < b);
      const meshD = BANDS.map(() => "");
      const link = (a, b) => {
        if (!a || !b) return;
        const k = bandOf(Math.max(a.d, b.d));
        meshD[k] += "M" + a.x.toFixed(1) + " " + a.y.toFixed(1) + "L" + b.x.toFixed(1) + " " + b.y.toFixed(1);
      };
      for (let j = 0; j < ROWS; j++) {
        for (let i = 0; i < COLS; i++) {
          const a = grid[j][i];
          if (!a) continue;
          if (i + 1 < COLS && hh(i, j, 7) < 0.34) link(a, grid[j][i + 1]);
          if (j + 1 < ROWS && hh(i, j, 8) < 0.28) link(a, grid[j + 1][i]);
          if (i + 1 < COLS && j + 1 < ROWS && hh(i, j, 9) < 0.12) link(a, grid[j + 1][i + 1]);
        }
      }
      // tie the constellation into the network: each avatar links to its 2 nearest members
      AV.forEach(([n, cx, cy]) => {
        const near = dots.map((p) => ({ p, k: Math.hypot(p.x - cx, p.y - cy) })).sort((u, v) => u.k - v.k).slice(0, 2);
        near.forEach(({ p }) => { meshD[0] += "M" + cx + " " + cy + "L" + p.x.toFixed(1) + " " + p.y.toFixed(1); });
      });
      const meshPaths = meshD.map((dStr) => {
        const p = document.createElementNS(SVGNS, "path");
        p.setAttribute("d", dStr || "M0 0");
        p.setAttribute("class", "f24-mesh");
        p.style.opacity = "0";
        meshG.appendChild(p);
        return p;
      });

      // comets (hub -> each avatar) for the "acompañado." broadcast
      const cometsSvg = document.getElementById("f24-comets");
      const comets = AV.map(([n, cx, cy]) => {
        const L = Math.hypot(cx - HUB.x, cy - HUB.y);
        const ln = document.createElementNS(SVGNS, "line");
        ln.setAttribute("x1", HUB.x); ln.setAttribute("y1", HUB.y); ln.setAttribute("x2", cx); ln.setAttribute("y2", cy);
        ln.setAttribute("class", "f24-comet");
        ln.style.strokeDasharray = "150 " + (L + 150).toFixed(2);
        ln.style.strokeDashoffset = "150";
        cometsSvg.appendChild(ln);
        return { el: ln, L, n };
      });

      // =====================================================================
      // Scene 1 (0.00–1.30) — "Avanzas a tu ritmo," · camera pulls OUT 1 -> 0.35
      // =====================================================================
      // entrance on the cut: max-velocity pull-out + a shock ring off the pill + the nucleus glow
      tl.fromTo("#f24-world", { scale: 1 }, { scale: S_END, duration: 1.3, ease: "power3.out" }, 0);
      tl.fromTo(".f24-av", { scale: 1 }, { scale: KEEP, duration: 1.3, ease: "power3.out" }, 0);
      tl.fromTo("#f24-hub", { scale: 1 }, { scale: KEEP, duration: 1.3, ease: "power3.out" }, 0);
      tl.fromTo("#f24-lines line", { strokeWidth: 2 }, { strokeWidth: 4.4, duration: 1.3, ease: "power3.out" }, 0);
      tl.fromTo("#f24-shock-a", { scale: 1, opacity: 0.85 }, { scale: 2.6, opacity: 0, duration: 0.6, ease: "power2.out" }, 0);
      tl.fromTo("#f24-nucleus", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#f24-nucleus", { opacity: 1 }, { opacity: 0.72, duration: 0.7, ease: "power1.inOut", immediateRender: false }, 0.55);

      // members light up centre-outward as the camera backs away
      dots.forEach((p, k) => {
        const e = Math.min(1, Math.max(0, (p.d - 520) / 2900));
        const t0 = e * 0.5 + hh(k, 3, 11) * 0.08;
        tl.fromTo(p.el, { attr: { r: 0 }, opacity: 0 }, { attr: { r: p.r }, opacity: p.op, duration: 0.3, ease: "back.out(2)" }, t0);
      });
      meshPaths.forEach((p, k) => {
        tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "power1.out" }, 0.1 + k * 0.08);
      });


      // lead line, word by word on the voice
      tl.fromTo("#f24-scrim-top", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.06);
      const LW = [["#f24-lw-avanzas", 0.12], ["#f24-lw-a", 0.546], ["#f24-lw-tu", 0.611], ["#f24-lw-ritmo", 0.731]];
      LW.forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0, y: 34, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, t - 0.04);
      });

      // =====================================================================
      // Scene 2 (1.30–2.589) — "pero" seam · **acompañado.** · counter +30.000
      // =====================================================================
      // velocity-matched seam on "pero": the camera tilts up while the card rises in the same direction
      tl.fromTo("#f24-cam", { y: 0 }, { y: CAM_UP, duration: 0.5, ease: "power3.inOut" }, 1.27);
      tl.fromTo("#f24-scrim-low", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, 1.28);
      tl.fromTo("#f24-cardpos", { y: 190 }, { y: 0, duration: 0.5, ease: "power3.out" }, 1.3);
      tl.fromTo("#f24-card", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, 1.3);

      // counter 0 -> 30.000 (1.30–2.40, power3.out) with dynamic scale (count + scale share ease)
      const valEl = document.getElementById("f24-val");
      const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      const ctr = { v: 0 };
      tl.set(valEl, { textContent: "0" }, 0);
      tl.fromTo(ctr, { v: 0 }, {
        v: 30000, duration: 1.1, ease: "power3.out",
        onUpdate: () => { valEl.textContent = fmt(Math.round(ctr.v)); },
      }, 1.3);
      tl.fromTo("#f24-num", { scale: 0.72 }, { scale: 1, duration: 1.1, ease: "power3.out" }, 1.3);

      // "acompañado." lands on 1.463 — slam from blur, rising with the seam
      tl.fromTo("#f24-title-w", { scale: 1.24, y: 40, filter: "blur(10px)" },
        { scale: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, 1.42);
      tl.fromTo("#f24-title", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 1.42);

      // ...and the whole community answers: hub pulse, comets to every avatar, a light ring through the field
      const BC = 1.44;
      tl.fromTo("#f24-pill", { scale: 1 }, { scale: 1.1, duration: 0.1, ease: "power2.out" }, BC);
      tl.fromTo("#f24-pill", { scale: 1.1 }, { scale: 1, duration: 0.36, ease: "power3.out", immediateRender: false }, BC + 0.1);
      tl.fromTo("#f24-nucleus", { opacity: 0.72 }, { opacity: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, BC);
      tl.fromTo("#f24-nucleus", { opacity: 1 }, { opacity: 0.6, duration: 0.7, ease: "power1.inOut", immediateRender: false }, BC + 0.14);
      comets.forEach(({ el, L }) => {
        tl.fromTo(el, { strokeDashoffset: 150 }, { strokeDashoffset: -L, duration: 0.32, ease: "power1.out", immediateRender: false }, BC + 0.02);
      });
      AV.forEach(([n, cx, cy]) => {
        const L = Math.hypot(cx - HUB.x, cy - HUB.y);
        const t = BC + 0.06 + (L / 760) * 0.22;
        tl.fromTo("#f24-dc-" + n, { scale: 1 }, { scale: 1.16, duration: 0.1, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo("#f24-dc-" + n, { scale: 1.16 }, { scale: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, t + 0.1);
      });
      const R0 = 160, R1 = 3500, RD = 0.95, RT = BC + 0.08;
      tl.fromTo(["#f24-ring", "#f24-ring-glow"], { attr: { r: R0 } }, { attr: { r: R1 }, duration: RD, ease: "power1.out" }, RT);
      tl.fromTo("#f24-ring", { opacity: 0 }, { opacity: 0.85, duration: 0.06, ease: "none" }, RT);
      tl.fromTo("#f24-ring", { opacity: 0.85 }, { opacity: 0, duration: RD - 0.06, ease: "power1.in", immediateRender: false }, RT + 0.06);
      tl.fromTo("#f24-ring-glow", { opacity: 0 }, { opacity: 0.24, duration: 0.06, ease: "none" }, RT);
      tl.fromTo("#f24-ring-glow", { opacity: 0.24 }, { opacity: 0, duration: RD - 0.06, ease: "power1.in", immediateRender: false }, RT + 0.06);
      // each visible member flares as the ring passes it (inverse of power1.out)
      dots.forEach((p) => {
        if (!p.vis || p.d > R1) return;
        const e = Math.min(1, Math.max(0, (p.d - R0) / (R1 - R0)));
        const t = RT + RD * (1 - Math.sqrt(1 - e));
        const rr = p.r * (p.big ? 1.45 : 1.8);
        tl.fromTo(p.el, { attr: { r: p.r }, opacity: p.op }, { attr: { r: rr }, opacity: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(p.el, { attr: { r: rr }, opacity: 1 }, { attr: { r: p.r }, opacity: p.op, duration: 0.42, ease: "power2.out", immediateRender: false }, t + 0.1);
      });

      // counter lands (~2.38): light sweep across the card + a small settle on the number
      tl.fromTo("#f24-plus", { scale: 1 }, { scale: 1.25, duration: 0.1, ease: "power2.out" }, 2.36);
      tl.fromTo("#f24-plus", { scale: 1.25 }, { scale: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, 2.46);
      tl.fromTo("#f24-sweep", { x: 0, opacity: 1 }, { x: 1500, opacity: 1, duration: 0.42, ease: "power2.inOut" }, 2.2);

      tl.set({}, {}, DUR);
      window.__timelines["24-acompanado"] = tl;
    })();
  </script>
</template>

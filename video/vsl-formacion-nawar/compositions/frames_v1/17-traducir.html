      tl.fromTo(q("f17-shock1"), { scale: 0.55, opacity: 0.9 }, { scale: 1.7, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.03);

      tl.fromTo(rise, { y: 1000 }, { y: 0, duration: 0.55, ease: "expo.out" }, 1.44);
      tl.fromTo(b2, { v: 36 }, { v: 0, duration: 0.55, ease: "expo.out", onUpdate: w2, immediateRender: false }, 1.44);
      tl.set(rise, { filter: "none" }, 2.0);

      // head outline draws while it rises; fill blooms in
      const hl = q("f17-head-line");
      const HL = hl.getTotalLength();
      hl.style.strokeDasharray = HL + " " + HL;
      tl.fromTo(hl, { strokeDashoffset: HL }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 1.44);
      tl.fromTo(q("f17-head-fill"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, 1.48);

      // ================= SCENE 2 — the ES⇄NL loop spins while the line builds =================
      tl.fromTo(q("f17-loop"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" }, 1.52);
      const BREAK = 2.12;
      tl.fromTo(q("f17-spin"), { rotation: 0 }, { rotation: 540, duration: BREAK - 1.5, ease: "power1.in" }, 1.5);
      tl.fromTo(q("f17-gh1"), { opacity: 0 }, { opacity: 0.34, duration: 0.2, ease: "power1.in" }, 1.62);
      tl.fromTo(q("f17-gh2"), { opacity: 0 }, { opacity: 0.16, duration: 0.2, ease: "power1.in" }, 1.62);
      tl.to([q("f17-gh1"), q("f17-gh2")], { opacity: 0, duration: 0.02, ease: "none" }, BREAK);

      [["f17-w-que", 1.565], ["f17-w-dejes", 1.704], ["f17-w-de", 2.028]].forEach(([id, t]) => wordIn(q(id), t));

      // ================= BREAK on "traducir" (2.12) =================
      tl.fromTo(q("f17-trad"), { opacity: 0, scale: 1.34, filter: "blur(14px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, BREAK - 0.03);
      const sh2 = q("f17-s2shake");
      tl.set(sh2, { x: 0, y: 0 }, 0);
      tl.set(sh2, { x: 7, y: -3 }, BREAK + 0.04);
      tl.set(sh2, { x: -5, y: 2 }, BREAK + 0.073);
      tl.set(sh2, { x: 2, y: -1 }, BREAK + 0.106);
      tl.set(sh2, { x: 0, y: 0 }, BREAK + 0.14);

      // the two arcs fly apart (local coords — the spinner sits at 180deg, so these read down-left / up-right)
      tl.fromTo(q("f17-arcA"), { x: 0, y: 0, rotation: 0, filter: "blur(0px)" },
        { x: 120, y: -210, rotation: 80, filter: "blur(5px)", duration: 0.4, ease: "power3.out" }, BREAK);
      tl.fromTo(q("f17-arcB"), { x: 0, y: 0, rotation: 0, filter: "blur(0px)" },
        { x: -120, y: 210, rotation: 80, filter: "blur(5px)", duration: 0.4, ease: "power3.out" }, BREAK);
      tl.fromTo([q("f17-arcA"), q("f17-arcB")], { opacity: 1 }, { opacity: 0, duration: 0.34, ease: "power2.in" }, BREAK + 0.02);
      tl.fromTo(q("f17-flash"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.05, ease: "power1.out" }, BREAK);
      tl.to(q("f17-flash"), { opacity: 0, scale: 1.5, duration: 0.32, ease: "power2.out" }, BREAK + 0.05);

      // snap shards (deterministic by index)
      const shards = q("f17-shards");
      const NS = 10;
      tl.fromTo(shards, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, BREAK);
      for (let i = 0; i < NS; i++) {
        const w = document.createElement("div");
        w.className = "f17-shw";
        w.style.transform = "rotate(" + (i * 36 + 14) + "deg)";
        const s = document.createElement("div");
        s.className = "f17-sh";
        w.appendChild(s);
        shards.appendChild(w);
        const t0 = BREAK;
        const dist = 170 + (i % 4) * 26;
        tl.fromTo(s, { y: -40, scaleY: 1 }, { y: -dist, scaleY: 0.35, duration: 0.42, ease: "power3.out" }, t0);
        tl.to(s, { opacity: 0, duration: 0.26, ease: "power1.in" }, t0 + 0.14);
      }

      // ES is thrown out, NL takes the centre of the head
      tl.fromTo(q("f17-es-in"), { x: 0, scale: 1, opacity: 1, filter: "blur(0px)" },
        { x: -80, scale: 0.4, opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power3.out" }, BREAK);
      tl.fromTo(q("f17-nl"), { x: 0, scale: 1 }, { x: -63, scale: 1.45, duration: 0.38, ease: "power3.out" }, BREAK + 0.02);
      tl.fromTo(q("f17-bglow"), { opacity: 0.6, scale: 1 }, { opacity: 1, scale: 1.2, duration: 0.45, ease: "power2.out" }, BREAK + 0.02);

      // red strike draws through TRADUCIR, the word dims
      tl.fromTo(q("f17-strike"), { scaleX: 0, rotation: -1.2 }, { scaleX: 1, rotation: -1.2, duration: 0.2, ease: "power3.inOut" }, 2.22);
      tl.fromTo(q("f17-tradfade"), { opacity: 1 }, { opacity: 0.55, duration: 0.3, ease: "power2.out" }, 2.34);

      // ================= one clean arrow: NL -> mouth (2.38–2.70) =================
      const cl = q("f17-cline"), cg = q("f17-cglow"), ch = q("f17-chead");
      const CL = cl.getTotalLength();
      cl.style.strokeDasharray = CL + " " + CL;
      cg.style.strokeDasharray = CL + " " + CL;
      // sample the (static) path once at build time — the callback only interpolates numbers
      const NSMP = 160, PX = [], PY = [];
      for (let i = 0; i <= NSMP; i++) {
        const pt = cl.getPointAtLength(CL * i / NSMP);
        PX.push(pt.x); PY.push(pt.y);
      }
      const ap = { p: 0 };
      function writeArrow() {
        const f = Math.max(0, Math.min(1, ap.p)) * NSMP;
        const i0 = Math.min(NSMP - 1, Math.floor(f)), fr = f - i0;
        const x = PX[i0] + (PX[i0 + 1] - PX[i0]) * fr;
        const y = PY[i0] + (PY[i0 + 1] - PY[i0]) * fr;
        const ang = Math.atan2(PY[i0 + 1] - PY[i0], PX[i0 + 1] - PX[i0]) * 180 / Math.PI;
        const off = (CL * (1 - ap.p)).toFixed(2);
        cl.style.strokeDashoffset = off;
        cg.style.strokeDashoffset = off;
        ch.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") rotate(" + ang.toFixed(2) + ")");
      }
      writeArrow();
      tl.fromTo(q("f17-carrow"), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 2.38);
      tl.fromTo(ap, { p: 0 }, { p: 1, duration: 0.32, ease: "power2.inOut", onUpdate: writeArrow, immediateRender: false }, 2.38);

      // ================= «Ja, natuurlijk!» pops out of the mouth on "cabeza" =================
      const CAB = 2.732;
      tl.fromTo(q("f17-bub"), { opacity: 0, scale: 0.22, x: -40 },
        { opacity: 1, scale: 1, x: 0, duration: 0.4, ease: "expo.out" }, CAB - 0.04);
      tl.fromTo(q("f17-b-ja"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, CAB);
      tl.fromTo(q("f17-b-nat"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, CAB + 0.07);
      ["f17-spk1", "f17-spk2", "f17-spk3"].forEach((id, i) => {
        const rot = [-58, -24, 8][i];
        tl.fromTo(q(id), { scaleX: 0, rotation: rot, opacity: 0 }, { scaleX: 1, rotation: rot, opacity: 1, duration: 0.22, ease: "power3.out" }, CAB + 0.12 + i * 0.035);
      });

      // lead-out words
      [["f17-w-en", 2.556], ["f17-w-tu", 2.658], ["f17-w-cabeza", 2.732]].forEach(([id, t]) => wordIn(q(id), t));

      // macro camera for scene 2
      tl.fromTo(q("f17-s2cam"), { scale: 1 }, { scale: 1.02, duration: D - 1.9, ease: "power1.out" }, 1.9);

      window.__timelines = window.__timelines || {};
      window.__timelines["17-traducir"] = tl;
    })();
  </script>
</template>

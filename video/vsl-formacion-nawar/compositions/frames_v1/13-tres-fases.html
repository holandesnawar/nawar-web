  <script>
    (function () {
      const q = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const D = 2.139;
      // cue table (frame-relative): Tres 0.12 · fases. 0.35 · Supervivencia. 1.05
      const T = { tres: 0.12, fases: 0.35, superv: 1.05 };

      // ---------- t=0: the world is already sliding right (the cut lands mid-motion) ----------
      tl.fromTo(q("f13-dots"), { x: -224 }, { x: 0, duration: 0.62, ease: "power4.out" }, 0);
      const lines = Array.from(document.querySelectorAll("#f13-speed .f13-sl"));
      const lineAt = [0.0, 0.05, 0.08, 0.0, 0.09, 0.03, 0.04, 0.12];
      const lineOp = [0.5, 0.32, 0.42, 0.6, 0.45, 0.34, 0.3, 0.38];
      lines.forEach((el, i) => {
        el.style.opacity = lineOp[i];
        tl.fromTo(el, { x: -560 }, { x: 2300, duration: 0.28 + (i % 3) * 0.04, ease: "none" }, lineAt[i]);
      });

      // ---------- Scene 1: three capsules slam in left→right (0.12 / 0.22 / 0.32) with motion-blur streaks ----------
      const slam = [T.tres - 0.05, 0.17, 0.27];
      [1, 2, 3].forEach((n, i) => {
        const pill = q("f13-p" + n);
        const node = q("f13-sbn" + n);
        const tail = pill.querySelector(".f13-tail");
        const inner = n === 1 ? [q("f13-in1"), q("f13-in1b")] : [q("f13-in" + n)];
        const t0 = slam[i];
        const MOVE = 0.44;
        pill.style.filter = "url(#f13-sb" + n + ")";
        const bp = { v: 34 };
        const writeBlur = () => node.setAttribute("stdDeviation", bp.v.toFixed(2) + " 0");
        writeBlur();
        tl.fromTo(pill, { x: -440 }, { x: 0, duration: MOVE, ease: "expo.out" }, t0);
        tl.fromTo(pill, { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power1.out" }, t0);
        tl.fromTo(bp, { v: 34 }, { v: 0, duration: MOVE, ease: "expo.out", onUpdate: writeBlur }, t0);
        tl.fromTo(tail, { scaleX: 1, opacity: 1 }, { scaleX: 0.06, opacity: 0, duration: 0.34, ease: "expo.out" }, t0);
        // content drags a beat behind its capsule, then settles inside it
        tl.fromTo(inner, { x: -70 }, { x: 0, duration: 0.6, ease: "power3.out" }, t0);
        tl.set(pill, { filter: "none" }, t0 + MOVE + 0.02);
      });

      // label — "3" on "Tres", "FASES" on "fases."
      tl.fromTo(q("f13-l3"), { opacity: 0, scale: 1.8, filter: "blur(12px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, T.tres - 0.04);
      tl.fromTo(q("f13-lf"), { yPercent: 105 }, { yPercent: 0, duration: 0.34, ease: "power3.out" }, T.fases - 0.04);
      tl.fromTo([q("f13-rl"), q("f13-rr")], { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power3.out" }, T.fases - 0.02);

      // ---------- Scene 2: "Supervivencia" — capsule 01 fills white, the rest fall back, camera pushes in ----------
      const S = T.superv - 0.03;
      const top1 = q("f13-top1");
      const H1 = 620;
      const wp = { p: 0 };
      const writeFill = () => {
        top1.style.clipPath = "inset(" + ((1 - wp.p) * H1).toFixed(1) + "px 0px 0px 0px)";
      };
      writeFill();
      tl.fromTo(wp, { p: 0 }, { p: 1, duration: 0.32, ease: "power3.out", onUpdate: writeFill }, S);
      tl.fromTo(q("f13-glow1"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, S);

      // capsule 01 lifts toward camera, the others recede (no overshoot)
      tl.fromTo(q("f13-pw1"), { scale: 1 }, { scale: 1.04, duration: 0.34, ease: "power3.out" }, S);
      const rest = [q("f13-pw2"), q("f13-pw3")];
      tl.fromTo(rest, { opacity: 1, scale: 1 }, { opacity: 0.35, scale: 0.95, duration: 0.32, ease: "power2.out" }, T.superv);
      tl.fromTo(rest, { filter: "blur(0px)" }, { filter: "blur(6px)", duration: D - T.superv, ease: "power1.in" }, T.superv);

      // camera push toward capsule 01 (anchored on it, drifting it toward centre), accelerating into the cut
      tl.fromTo(q("f13-cam"), { scale: 1, x: 0, y: 0 }, { scale: 1.25, x: 190, y: 0, duration: D - T.superv, ease: "power1.in" }, T.superv);
      // the label sits on a deeper plane: same push, less travel (parallax keeps it clear of the top edge)
      tl.fromTo(q("f13-camL"), { scale: 1, x: 0 }, { scale: 1.13, x: 120, duration: D - T.superv, ease: "power1.in" }, T.superv);
      tl.fromTo(q("f13-par"), { scale: 1, x: 0 }, { scale: 1.08, x: 60, duration: D - T.superv, ease: "power1.in" }, T.superv);

      window.__timelines = window.__timelines || {};
      window.__timelines["13-tres-fases"] = tl;
    })();
  </script>

        var el = $("t" + i);
        return {
          sT: el.querySelector(".f04-sT span"), sB: el.querySelector(".f04-sB span"),
          fT: el.querySelector(".f04-fT"), fTs: el.querySelector(".f04-fT span"),
          fB: el.querySelector(".f04-fB"), fBs: el.querySelector(".f04-fB span")
        };
      };
      var tiles = [tile(0), tile(1), tile(2), tile(3)];
      var flip = function (tt, to, t, d) {
        tl.set(tt.sT, { textContent: to }, t);
        tl.set(tt.fBs, { textContent: to }, t);
        tl.set(tt.fB, { rotationX: 90 }, t);
        tl.fromTo(tt.fT, { rotationX: 0 }, { rotationX: -90, duration: d * 0.5, ease: "power2.in", immediateRender: false }, t);
        tl.fromTo(tt.fB, { rotationX: 90 }, { rotationX: 0, duration: d * 0.5, ease: "power2.out", immediateRender: false }, t + d * 0.5);
        tl.set(tt.fTs, { textContent: to }, t + d);
        tl.set(tt.fT, { rotationX: 0 }, t + d);
        tl.set(tt.sB, { textContent: to }, t + d);
      };
      var FT = [0.12, 0.19, 0.26, 0.33, 0.41, 0.50, 0.61];
      var FD = [0.065, 0.065, 0.065, 0.075, 0.085, 0.10, 0.14];
      var LAST = ["0", "1", "2", "3", "4", "5", "6"];
      for (var k = 0; k < 7; k++) {
        flip(tiles[3], LAST[k], FT[k], FD[k]);
        if (k === 0) flip(tiles[2], "2", FT[0] + 0.02, 0.07);
      }
      // progress ticks under the year light up one per flip
      q($("tick"), "i").forEach(function (el, i) {
        if (i > 0) tl.set(el, { backgroundColor: "#0b6df0" }, FT[i - 1] + FD[i - 1] * 0.5);
      });
      // the final flip lands with a thunk
      tl.fromTo($("cal"), { y: 0, scale: 1 }, { y: 8, scale: 0.985, duration: 0.06, ease: "power2.in", immediateRender: false }, 0.70);
      tl.to($("cal"), { y: 0, scale: 1, duration: 0.3, ease: "power3.out" }, 0.76);

      // ================= copy: "Llevas años aquí." =================
      tl.fromTo($("llevas"), { y: 56, opacity: 0, filter: "blur(8px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, T.llevas - LEAD);
      tl.fromTo($("anos"), { scale: 1.4, opacity: 0, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, T.anos - LEAD);
      tl.fromTo($("aqui"), { y: 60, opacity: 0, filter: "blur(8px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, T.aqui - LEAD);
      tl.fromTo($("pin"), { y: -110, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, T.aqui + 0.06);
      tl.fromTo($("pin"), { scaleY: 1, scaleX: 1 }, { scaleY: 0.9, scaleX: 1.06, duration: 0.06, ease: "power2.out", immediateRender: false }, T.aqui + 0.2);
      tl.to($("pin"), { scaleY: 1, scaleX: 1, duration: 0.22, ease: "power3.out" }, T.aqui + 0.26);
      tl.fromTo($("pinShadow"), { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, T.aqui + 0.08);

      // ================= SEAM (cut-the-curve, upward push) =================
      // Both scenes ride one vertical strip (s2 sits 1000 px below s1): the outgoing accelerates up
      // (power3.in), the incoming continues the same direction and decelerates (power3.out). The two
      // legs are velocity-matched (340/0.18 = 660/0.35), so it reads as one continuous whip-pan.
      // No opacity fades: s1 stays fully opaque until it is off-canvas, s2 is fully opaque on entry.
      var S0 = 1.22, S1 = 0.18, S2 = 0.35, SPLIT = 340, GAP = 1000;
      tl.fromTo($("s1"), { y: 0 }, { y: -SPLIT, duration: S1, ease: "power3.in", immediateRender: false }, S0);
      tl.fromTo($("s1"), { y: -SPLIT }, { y: -GAP, duration: S2, ease: "power3.out", immediateRender: false }, S0 + S1);
      tl.fromTo($("s2"), { y: GAP }, { y: GAP - SPLIT, duration: S1, ease: "power3.in" }, S0);
      tl.fromTo($("s2"), { y: GAP - SPLIT }, { y: 0, duration: S2, ease: "power3.out", immediateRender: false }, S0 + S1);
      tl.set($("s2"), { visibility: "visible" }, 1.30);   // hidden via CSS before the seam (still below the canvas here)
      tl.set($("s1"), { visibility: "hidden" }, 1.56);    // already above the canvas (fully gone ~1.52)
      // vertical motion streak on both scenes + the dot grid, peaking at the velocity junction
      var vNode = $("vstreakBlur");
      var vb = { v: 0 };
      var writeV = function () { vNode.setAttribute("stdDeviation", "0 " + vb.v.toFixed(2)); };
      tl.fromTo(vb, { v: 0 }, { v: 18, duration: S1, ease: "power2.in", onUpdate: writeV, immediateRender: false }, S0);
      tl.fromTo(vb, { v: 18 }, { v: 0, duration: 0.22, ease: "power2.out", onUpdate: writeV, immediateRender: false }, S0 + S1);
      var CUT = 1.51;   // "Trabajas" content leads its 1.564 cue by 0.054 s
      // ================= draw helpers =================
      var drawIn = function (els, t, dur, stagger) {
        els.forEach(function (el) { el.setAttribute("stroke-dasharray", "1 1"); });
        tl.fromTo(els, { attr: { "stroke-dashoffset": 1 } },
          { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: "power2.out", stagger: stagger || 0 }, t);
      };
      var check = function (i, t) {
        var b = $("b" + i);
        var disc = b.querySelector(".f04-disc"), burst = b.querySelector(".f04-burst"), tk = b.querySelector(".f04-tk"), ph = b.querySelector(".f04-ph");
        tl.fromTo(disc, { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2.4)" }, t);
        tl.fromTo(ph, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "none", immediateRender: false }, t);
        tl.fromTo(burst, { scale: 0.9, opacity: 0.8 }, { scale: 1.7, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.04);
        tk.setAttribute("stroke-dasharray", "1 1");
        tl.fromTo(tk, { attr: { "stroke-dashoffset": 1 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 0.2, ease: "power2.out" }, t + 0.08);
        tl.fromTo($("c" + i), { scale: 1 }, { scale: 1.02, duration: 0.07, ease: "power2.out", immediateRender: false }, t);
        tl.to($("c" + i), { scale: 1, duration: 0.3, ease: "power3.out" }, t + 0.07);
      };

      // ================= CARD 1 — "Trabajas" (rides the seam) =================
      drawIn(q($("c0"), ".f04-d0"), 1.505, 0.28, 0.025);
      tl.fromTo($("bcFill"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.70);
      tl.fromTo($("k0"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, CUT);
      check(0, 2.08);

      // ================= CARD 2 — "Pagas tus impuestos" =================
      tl.fromTo($("c1"), { y: 170, opacity: 0, scale: 0.94, filter: "blur(10px)" },
        { y: 0, opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, T.pagas - LEAD);
      drawIn(q($("c1"), ".f04-d1"), T.pagas + 0.02, 0.4, 0.06);
      tl.fromTo($("envFill"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, T.pagas);
      tl.fromTo($("doc"), { y: 96, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "expo.out" }, T.impuestos - LEAD);
      tl.fromTo($("wTus"), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "power3.out" }, T.tus - LEAD);
      tl.fromTo($("k1"), { scale: 1.22, opacity: 0, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, T.impuestos - LEAD);
      check(1, 3.12);

      // ================= CARD 3 — "Sacas adelante a tu familia" =================
      tl.fromTo($("c2"), { y: 170, opacity: 0, scale: 0.94, filter: "blur(10px)" },
        { y: 0, opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, T.sacas - LEAD);
      drawIn(q($("c2"), ".f04-d2"), T.sacas + 0.02, 0.45, 0.07);
      tl.fromTo($("houseFill"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, T.sacas + 0.25);
      tl.fromTo($("wAdel"), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "power3.out" }, T.adelante - LEAD);
      tl.fromTo($("wA"), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, T.a - LEAD);
      tl.fromTo($("wTu"), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, T.tu - LEAD);
      tl.fromTo($("k2"), { scale: 1.22, opacity: 0, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, T.familia - LEAD);
      ["fam0", "fam1", "fam2"].forEach(function (id, i) {
        tl.fromTo($(id), { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, T.familia - LEAD + i * 0.06);
      });
      check(2, 4.68);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-llevas-anos"] = tl;
    })();
  </script>
</template>

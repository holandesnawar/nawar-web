    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Poppins", sans-serif; }

    /* ---------- ground: nawar-blue + white dot grid + soft vignette (same recipe as 21/23) ---------- */

    #f25-rays {

    #f25-flash {

    #f25-logo-wrap {

    }
    #f25-logo { position: absolute; left: 0; top: 0; width: 760px; height: 271.1px; display: block; }
    #f25-shine-mask {
      position: absolute; left: 0; top: 0; width: 760px; height: 271.1px; overflow: hidden; mix-blend-mode: screen;

      mask-image: url("assets/img/logo-nawar.png"); mask-size: 100% 100%; mask-repeat: no-repeat;
    }
    #f25-shine {
      position: absolute; left: 0; top: -70px; width: 260px; height: 420px;
      background: linear-gradient(112deg, rgba(255,255,255,0) 22%, rgba(255,255,255,0.14) 38%, rgba(255,255,255,0.65) 48.5%, rgba(255,255,255,0.65) 51.5%, rgba(255,255,255,0.14) 62%, rgba(255,255,255,0) 78%);
    }

    /* ---------- claim: display-h2, two centred lines ---------- */
    #f25-claim {
      position: absolute; left: 0; top: 488px; width: 1920px;
      font-family: "Poppins", sans-serif; font-weight: 800; font-size: 88px; line-height: 1.06;
      letter-spacing: -0.03em; color: #FFFFFF; text-align: center;
    }
    .f25-line { display: flex; justify-content: center; align-items: baseline; gap: 0.24em; white-space: nowrap; }
    .f25-w { display: inline-block; text-shadow: 0 12px 40px rgba(4,0,40,0.38); }
    .f25-acc { color: #4da3ff; transform-origin: 50% 70%;
      text-shadow: 0 0 46px rgba(77,163,255,0.42), 0 12px 40px rgba(4,0,40,0.38); }

    /* ---------- CTA pill (white fill, indigo text) ---------- */
    #f25-pill-row { position: absolute; left: 0; top: 740px; width: 1920px; height: 110px; display: flex; justify-content: center; }
    #f25-pill-wrap { position: relative; flex: none; }
    #f25-pill {
      position: relative; height: 110px; border-radius: 999px; background: #FFFFFF; overflow: hidden;
      display: flex; align-items: center; gap: 20px; padding: 0 50px 0 30px; box-sizing: border-box;
      box-shadow: 0 40px 110px rgba(4,0,40,0.45), 0 0 80px rgba(77,163,255,0.5);
    }
    #f25-globe-disc {
      flex: none; width: 66px; height: 66px; border-radius: 50%; background: #0b6df0;
      display: flex; align-items: center; justify-content: center;
    }
    #f25-globe { width: 38px; height: 38px; display: block; }
    #f25-url {
      flex: none; white-space: nowrap; display: block;
      font-family: "Poppins", sans-serif; font-weight: 700; font-size: 52px; line-height: 1;
      letter-spacing: -0.015em; color: #1D0084; padding-top: 5px;
    }
    #f25-pill-glint {
      position: absolute; left: 0; top: -20px; width: 170px; height: 150px; pointer-events: none;
      background: linear-gradient(105deg, rgba(159,213,245,0) 20%, rgba(159,213,245,0.55) 50%, rgba(159,213,245,0) 80%);
    }

    /* ---------- sub-label: ui, white-72 ---------- */
    #f25-label {
      position: absolute; left: 0; top: 888px; width: 1920px; display: flex; justify-content: center; align-items: center;
      gap: 12px; white-space: nowrap;
      font-family: "Inter", sans-serif; font-weight: 600; font-size: 30px; line-height: 1.3; color: rgba(255,255,255,0.72);

    #f25-label span { display: block; }
    #f25-arrow { width: 34px; height: 20px; display: block; }
    .f25-dot { color: rgba(255,255,255,0.45); }

    /* ---------- full-frame light band (screen) ---------- */
    #f25-band {
      position: absolute; left: -960px; top: -540px; width: 3840px; height: 2160px; pointer-events: none;
      mix-blend-mode: screen;
      background: linear-gradient(115deg, rgba(255,255,255,0) 41%, rgba(255,255,255,0.04) 46%, rgba(255,255,255,0.16) 50%, rgba(255,255,255,0.04) 54%, rgba(255,255,255,0) 59%);
    }

    /* ---------- the only exit of the film: fade to night ---------- */
    #f25-night { position: absolute; inset: 0; background: #07041F; pointer-events: none; }
  </style>

  <div id="root" data-composition-id="25-end-card" data-width="1920" data-height="1080" data-duration="6.2">
    <div id="f25-ground" class="clip" data-start="0" data-duration="6.2" data-track-index="0"></div>

    <div id="f25-stage">
      <div id="f25-rays"></div>
      <div id="f25-glow"></div>
      <div id="f25-core"></div>
      <div id="f25-flash"></div>
      <div id="f25-shock"></div>
      <div id="f25-sparks"></div>

      <div id="f25-logo-wrap">
        <img id="f25-logo" src="assets/img/logo-nawar.png" alt="Nawar" />
        <div id="f25-shine-mask"><div id="f25-shine"></div></div>
      </div>

      <div id="f25-claim">
        <div class="f25-line">
          <span id="f25-w1" class="f25-w">Tu</span>
          <span id="f25-w2" class="f25-w">neerlandés</span>
          <span id="f25-w3" class="f25-w">empieza</span>
        </div>
        <div class="f25-line">
          <span id="f25-w4" class="f25-w f25-acc">cuando</span>
          <span id="f25-w5" class="f25-w f25-acc">lo</span>
          <span id="f25-w6" class="f25-w f25-acc">hablas.</span>
        </div>
      </div>

      <div id="f25-pill-row">
        <div id="f25-pill-wrap">
          <div id="f25-pill">
            <div id="f25-globe-disc">
              <svg id="f25-globe" viewBox="0 0 40 40" aria-hidden="true">
                <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="20" cy="20" r="15" />
                  <ellipse cx="20" cy="20" rx="6.5" ry="15" />
                  <path d="M5.5 15h29M5.5 25h29" />
                </g>
              </svg>
            </div>
            <span id="f25-url">holandesnawar.com</span>
            <div id="f25-pill-glint"></div>
          </div>
        </div>
      </div>

      <div id="f25-label">
        <span>Formación Nawar A0</span>
        <svg id="f25-arrow" viewBox="0 0 34 20" aria-hidden="true">
          <path d="M2 10h27M21 3l8 7-8 7" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>A1</span>
        <span class="f25-dot">·</span>
        <span>desde el español</span>
      </div>
    </div>

    <div id="f25-band"></div>
    <div id="f25-night"></div>
  </div>

  <script>
    (function () {
      const q = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const D = 6.2;

      // ---------------- deterministic spark burst around the logo (bookends frame 11) ----------------
      const sparks = q("f25-sparks");
      const N = 12;
      const streaks = [];
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2 + 0.26;
        const rx = 450, ry = 175;
        const cx = 960 + Math.cos(a) * rx;
        const cy = 290 + Math.sin(a) * ry;
        const s = document.createElement("div");
        s.className = "f25-spark";
        s.style.left = cx.toFixed(1) + "px";
        s.style.top = cy.toFixed(1) + "px";
        const nx = Math.cos(a) / rx, ny = Math.sin(a) / ry;
        s.style.transform = "rotate(" + (Math.atan2(ny, nx) * 180 / Math.PI).toFixed(2) + "deg)";
        const k = document.createElement("div");
        k.className = "f25-streak";
        k.style.width = [120, 84, 150, 100][i % 4] + "px";
        s.appendChild(k);
        sparks.appendChild(s);
        streaks.push(k);
      }

      // ---------------- Scene 1 (0.0–1.0) — logo bloom + light sweep ----------------
      const wrap = q("f25-logo-wrap");
      tl.fromTo(wrap, { scale: 0.6 }, { scale: 1.045, duration: 0.3, ease: "power3.out" }, 0);
      tl.to(wrap, { scale: 1, duration: 0.34, ease: "power2.inOut" }, 0.3);
      tl.fromTo(wrap, { opacity: 0.6 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, 0);
      tl.fromTo(q("f25-logo"), { filter: "blur(18px)" }, { filter: "blur(0px)", duration: 0.28, ease: "power2.out" }, 0);

      tl.fromTo(q("f25-glow"), { opacity: 0.45, scale: 0.45 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(q("f25-core"), { opacity: 1, scale: 0.7 }, { opacity: 0.5, scale: 1.1, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo(q("f25-rays"), { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 0);
      tl.fromTo(q("f25-rays"), { rotation: -4 }, { rotation: 8, duration: D, ease: "none" }, 0);

      tl.fromTo(q("f25-flash"), { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: 1.15, duration: 0.42, ease: "power2.out" }, 0);
      tl.fromTo(q("f25-shock"), { scale: 0.55, opacity: 0.9 }, { scale: 1.7, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.04);

      streaks.forEach((k, i) => {
        const at = 0.05 + (i % 3) * 0.014;
        tl.fromTo(k, { x: -30, opacity: 0, scaleX: 0.25 },
          { x: 40, opacity: 1, scaleX: 1, duration: 0.1, ease: "power2.out" }, at);
        tl.to(k, { x: 200 + (i % 4) * 24, opacity: 0, scaleX: 0.35, duration: 0.36, ease: "power2.out" }, at + 0.1);
      });

      // light sweep: masked shine across the wordmark + a soft full-frame band riding with it
      tl.fromTo(q("f25-shine"), { x: -380 }, { x: 900, duration: 0.6, ease: "power2.inOut" }, 0.16);
      tl.fromTo(q("f25-band"), { x: -2300 }, { x: 2300, duration: 0.95, ease: "power1.inOut" }, 0.02);
      tl.fromTo(q("f25-band"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, 0.02);
      tl.to(q("f25-band"), { opacity: 0, duration: 0.25, ease: "power1.in" }, 0.72);

      // ---------------- Scene 2 (1.0–2.6) — the claim builds word by word ----------------
      const rise = (el, at) =>
        tl.fromTo(el, { opacity: 0, y: 44, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, at);
      const slam = (el, at) =>
        tl.fromTo(el, { opacity: 0, scale: 1.28, filter: "blur(10px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, at);
      rise(q("f25-w1"), 1.0);
      rise(q("f25-w2"), 1.18);
      rise(q("f25-w3"), 1.36);
      slam(q("f25-w4"), 1.56);
      slam(q("f25-w5"), 1.74);
      slam(q("f25-w6"), 1.92);

      // ---------------- Scene 3 (2.8–6.2) — CTA pill + label, hold, fade to night ----------------
      tl.fromTo(q("f25-pill-wrap"), { opacity: 0, y: 70, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 2.9);
      tl.fromTo(q("f25-globe-disc"), { rotation: -90, scale: 0.4 },
        { rotation: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 2.98);
      tl.fromTo(q("f25-pill-glint"), { x: -220 }, { x: 760, duration: 0.6, ease: "power2.inOut" }, 3.3);

      tl.fromTo(q("f25-label"), { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 3.2);

      // macro camera: one quiet monotonic push under the whole card (no breathing)
      tl.fromTo(q("f25-stage"), { scale: 1 }, { scale: 1.022, duration: D - 0.6, ease: "power1.inOut" }, 0.6);

      // the only exit in the film: everything fades to night
      tl.fromTo(q("f25-night"), { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power1.inOut" }, 5.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["25-end-card"] = tl;
    })();
  </script>

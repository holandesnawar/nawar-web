    (function () {
      const q = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const D = 6.99;

      // ================= ENTRANCE + SCENE 1 (0.00–1.70): title zooms in from blur =================
      tl.fromTo(q("f16-bg"), { scale: 1.16 }, { scale: 1, duration: 0.7, ease: "expo.out" }, 0);

      // "Estructura" — zoom-in from blur on the cut

      tl.fromTo(t1, { opacity: 0.1 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0);

      // pill pops + 3rd segment fills

      // "y" 0.703 · "soltura." 0.777
      tl.fromTo(q("f16-wy"), { opacity: 0, y: 56, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 0.66);
      tl.fromTo(q("f16-wsol"), { opacity: 0, y: 56, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, 0.73);

      // ================= SEAM 1 -> 2 (cut the curve, upward) =================
      const s1 = q("f16-s1");
      tl.fromTo(s1, { y: 0, filter: "blur(0px)" }, { y: -230, filter: "blur(10px)", duration: 0.3, ease: "power4.in" }, 1.46);
      tl.fromTo(s1, { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "none" }, 1.54);
      // pill docks at the top as the chapter header
      tl.fromTo(q("f16-pillrow"), { y: 0 }, { y: -246, duration: 0.5, ease: "power3.inOut" }, 1.4);

      // ================= SCENE 2 (1.75–3.35): Ahora sí, GRAMÁTICA =================
      tl.fromTo(q("f16-w-ahora"), { opacity: 0, y: 230, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "power4.out" }, 1.74);
      tl.fromTo(q("f16-w-si"), { opacity: 0, y: 64, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, 2.03);

      // GRAMÁTICA slams letter by letter on "gramática:" (2.518)
      const GL = Array.from(document.querySelectorAll("#f16-gword .f16-gl"));
      GL.forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, scale: 1.7, y: -24, filter: "blur(10px)" },
          { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 2.47 + i * 0.022);
      });
      tl.fromTo(q("f16-glow"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 2.5);
      // deterministic 3-frame landing shake
      const s2k = q("f16-s2k");
      tl.set(s2k, { x: 0, y: 0 }, 0);
      tl.set(s2k, { x: 8, y: -4 }, 2.6);
      tl.set(s2k, { x: -6, y: 3 }, 2.633);
      tl.set(s2k, { x: 2, y: -1 }, 2.666);
      tl.set(s2k, { x: 0, y: 0 }, 2.7);
      // blue-light underline bar
      tl.fromTo(q("f16-gbar"), { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power3.out" }, 2.72);

      // ================= SEAM 2 -> 3 (cut the curve, upward) =================
      const s2 = q("f16-s2");
      tl.fromTo(s2, { y: 0, filter: "blur(0px)" }, { y: -230, filter: "blur(10px)", duration: 0.28, ease: "power4.in" }, 3.14);
      tl.fromTo(s2, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none" }, 3.22);

      // line 1 assembles on "dónde va el" (3.425 / 3.675 / 3.768) as a waterfall
      const L1 = [["f16-kf-ik", 3.38], ["f16-kf-ga", 3.5], ["f16-kf-mo", 3.62], ["f16-kf-na", 3.74]];

        tl.fromTo(q(id), { opacity: 0, y: 200, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.38, ease: "power4.out" }, t);
      });

      // "verbo" (3.870): ga turns blue-light, punches, VERBO tag drops in
      tl.fromTo(q("f16-kt-ga"), { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, 3.85);
      tl.fromTo(q("f16-kl-ga"), { color: "#1D0084" }, { color: "#FFFFFF", duration: 0.22, ease: "power2.out" }, 3.85);
      tl.fromTo(q("f16-k-ga"), { scale: 1.16 }, { scale: 1, duration: 0.42, ease: "expo.out", immediateRender: false }, 3.86);
      tl.fromTo(q("f16-tag"), { opacity: 0, y: -22 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 3.87);

      // "frases" (4.527): the two words that will swap get marked
      ["ik", "mo"].forEach((k, i) => {
        tl.fromTo(q("f16-kr-" + k), { opacity: 0, scale: 1.14 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power3.out" }, 4.5 + i * 0.04);
        tl.fromTo(q("f16-kf-" + k), { y: 0 }, { y: -10, duration: 0.26, ease: "power3.out", immediateRender: false }, 4.5 + i * 0.04);
      });

      // "invertidas" (4.833): FLIP re-order — Morgen arcs over, ik arcs under, ga stays pinned
      const F0 = 4.8, FD = 0.62, H = FD / 2;
      const mo = q("f16-k-mo"), ik = q("f16-k-ik"), na = q("f16-k-na");

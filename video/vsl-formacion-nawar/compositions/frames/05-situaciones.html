  <script>
    (function () {
      var $ = function (id) { return document.getElementById("f05-" + id); };
      var tl = gsap.timeline({ paused: true });

      // ---- exact word cues (frame-relative s) ----
      var T = {
        pero: 0.12, llegas: 0.287, a: 0.537, caja: 0.666, supermercado: 1.028,
        medico: 2.12, reunion: 3.055, entrevista: 3.745
      };
      var LEAD = 0.04;

      // ---- camera: row recentres + pulls back on each landing (card centres in row coords: 300 / 740 / 1180 / 1620) ----
      // screen = 960 + s * (p - 960) + x  ->  x = s * (960 - centre of the visible group)
      // phase 1 group = lead block (row x -600..10) + card 1 (98..502) -> centre -49
      var CAM = [
        { scale: 1.38, x: 1.38 * 1009 },  // t = 0 (entrance, tight on lead + card 1)
        { scale: 1.3, x: 1.3 * 1009 },    // lead + card 1
        { scale: 1.24, x: 1.24 * 440 },   // cards 1-2
        { scale: 1.13, x: 1.13 * 220 },   // cards 1-3
        { scale: 1.0, x: 0 }              // all four, centred
      ];
      var cam = $("cam");
      tl.fromTo(cam, CAM[0], Object.assign({ duration: 0.75, ease: "expo.out" }, CAM[1]), 0);
      tl.fromTo(cam, CAM[1], Object.assign({ duration: 0.55, ease: "expo.out", immediateRender: false }, CAM[2]), T.medico - 0.05);
      tl.fromTo(cam, CAM[2], Object.assign({ duration: 0.55, ease: "expo.out", immediateRender: false }, CAM[3]), T.reunion - 0.05);
      tl.fromTo(cam, CAM[3], Object.assign({ duration: 0.5, ease: "expo.out", immediateRender: false }, CAM[4]), T.entrevista - 0.05);

      // ---- ground settles with the cut ----
      tl.fromTo($("dots"), { scale: 1.08 }, { scale: 1, duration: 0.7, ease: "expo.out" }, 0);

      // ================= ENTRANCE: card 1 slides up from below with blur =================
      tl.fromTo($("c1"),
        { y: 340, rotation: -3, opacity: 0.7, filter: "blur(16px)" },
        { y: 0, rotation: 0, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0);

      // ---- lead-in "Pero llegas a…" ----
      function rise(id, t) {
        tl.fromTo($(id), { y: 46, opacity: 0, filter: "blur(8px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.26, ease: "power3.out" }, t - LEAD);
      }
      rise("h1", T.pero);
      rise("h2", T.llegas);
      rise("h3", T.a);
      // seam: the lead-in rides the conveyor out to the left as card 2 arrives (velocity-matched)
      tl.fromTo($("lead"), { x: 0, filter: "blur(0px)" },
        { x: -460, filter: "blur(16px)", duration: 0.26, ease: "power2.in", immediateRender: false }, T.medico - 0.08);
      tl.fromTo($("lead"), { opacity: 1 },
        { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, T.medico - 0.04);

      // ---- per-card beats ----
      function word(i, t) {
        tl.fromTo($("w" + i), { yPercent: 110 }, { yPercent: 0, duration: 0.3, ease: "expo.out" }, t - LEAD);
        tl.fromTo($("nl" + i), { x: -18, opacity: 0 }, { x: 0, opacity: 1, duration: 0.26, ease: "power3.out" }, t + 0.06);
      }
      function bubble(i, t) {
        tl.fromTo($("b" + i), { scale: 0.62, y: 16, opacity: 0 },
          { scale: 1, y: 0, opacity: 1, duration: 0.28, ease: "power3.out" }, t);
      }
      function reply(i, t) {
        tl.fromTo($("r" + i), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power3.out" }, t);
        tl.fromTo($("r" + i).querySelectorAll(".f05-dot"), { opacity: 0, y: 7 },
          { opacity: 1, y: 0, duration: 0.14, ease: "power2.out", stagger: 0.12 }, t + 0.07);
      }
      function enter(i, t) {
        tl.fromTo($("c" + i),
          { x: 300, y: 40, rotation: 5, opacity: 0, filter: "blur(14px)" },
          { x: 0, y: 0, rotation: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, t);
      }

      // ================= 1 · "caja del supermercado" =================
      // "caja": the register rings up and the receipt prints
      tl.fromTo($("price"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, T.caja - LEAD);
      tl.fromTo($("receipt"), { scaleY: 0, transformOrigin: "50% 100%" },
        { scaleY: 1, transformOrigin: "50% 100%", duration: 0.42, ease: "power2.out" }, T.caja - 0.02);
      // the cart rolls up to the till on "caja"
      tl.fromTo($("cart"), { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, T.caja - 0.04);
      // the cashier speaks while "la caja" is said, so the card fills right after the cut
      bubble(1, T.caja + 0.1);
      word(1, T.supermercado);
      reply(1, T.supermercado + 0.2);

      // ================= 2 · "al médico" =================
      enter(2, T.medico - 0.05);
      word(2, T.medico);
      tl.fromTo($("ecg"), { attr: { "stroke-dashoffset": 1 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.42, ease: "power2.inOut" }, T.medico + 0.12);
      bubble(2, T.medico + 0.18);
      reply(2, T.medico + 0.38);

      // ================= 3 · "a una reunión" =================
      enter(3, T.reunion - 0.05);
      word(3, T.reunion);
      tl.fromTo($("bars").querySelectorAll(".f05-bar"), { scaleY: 0, transformOrigin: "50% 100%" },
        { scaleY: 1, transformOrigin: "50% 100%", duration: 0.3, ease: "expo.out", stagger: 0.06 }, T.reunion + 0.08);
      tl.fromTo($("chalk"), { attr: { "stroke-dashoffset": 1 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.out" }, T.reunion + 0.16);
      bubble(3, T.reunion + 0.18);
      reply(3, T.reunion + 0.36);

      // ================= 4 · "o a una entrevista…" =================
      enter(4, T.entrevista - 0.05);
      word(4, T.entrevista);
      // climax accent: "entrevista" lands oversized and settles, so the last word hits hardest.
      // A gentler settle than expo so the oversize still reads once the card's entrance blur clears (~3.85 s).

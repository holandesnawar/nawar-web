  <script>
    (function () {
      const q = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const D = 5.6;
      const LEAD = 0.04;
      // cue table (frame-relative seconds, from the packet)
      const T = {
        no: 0.12, prometemos: 0.37, milagros: 0.93, prometemos2: 1.70, claridad: 2.23, cercania: 2.99,
        un: 3.90, metodo: 4.07, pensado: 4.44, para: 4.97, ti: 5.15, riser: 4.89
      };
      const rise = (el, cue, dy) => tl.fromTo(el, { opacity: 0, y: dy || 44, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, cue - LEAD);

      // ================= GROUND (entrance: dots settle out of depth) =================
      tl.fromTo(q("f36-dots"), { scale: 1.1 }, { scale: 1, duration: 0.8, ease: "expo.out" }, 0);

      // ================= SCENE 1 — «No prometemos» rises from blur out of a soft light opening =================
      tl.fromTo(q("f36-oglow"), { opacity: 0, scale: 0.35 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo(q("f36-w-no"), { opacity: 0, y: 60, filter: "blur(16px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, T.no - 0.08);
      rise(q("f36-w-prom"), T.prometemos, 50);

      // MILAGROS lands on its cue — the lead line steps up to make room
      const MIL = T.milagros;
      tl.fromTo(q("f36-lead1"), { y: 0, scale: 1 }, { y: -128, scale: 0.88, duration: 0.34, ease: "power3.out" }, MIL - 0.08);
      tl.fromTo(q("f36-mil"), { opacity: 0, scale: 1.1, filter: "blur(8px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, MIL - LEAD);

      // the red strike draws 0.12 s later; the word dims (no jolt, no particles)
      const STR = MIL + 0.12;
      tl.fromTo(q("f36-strike"), { scaleX: 0, rotation: -2 }, { scaleX: 1, rotation: -2, duration: 0.2, ease: "power3.inOut" }, STR);
      tl.fromTo(q("f36-milfade"), { opacity: 1 }, { opacity: 0.5, duration: 0.3, ease: "power2.out" }, STR + 0.16);

      // ================= SEAM — scene 1 sinks, «Prometemos» drops in (same direction) =================
      const s1 = q("f36-s1");
      tl.fromTo(s1, { y: 0, opacity: 1, filter: "blur(0px)" },
        { y: 280, opacity: 0, filter: "blur(10px)", duration: 0.24, ease: "power2.in" }, 1.5);
      tl.fromTo(q("f36-lead2"), { opacity: 0, y: -56, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, T.prometemos2 - LEAD);

      // ================= SCENE 2 — promise rows =================
      const drawIcon = (badge, t) => {
        const d = badge.querySelectorAll(".f36-d");
        const f = badge.querySelectorAll(".f36-f");
        tl.fromTo(d, { strokeDasharray: "1 2", strokeDashoffset: 1 }, { strokeDasharray: "1 2", strokeDashoffset: 0, duration: 0.36, ease: "power2.out", stagger: 0.04 }, t + 0.06);
        tl.fromTo(f, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.22, ease: "power3.out", stagger: 0.03 }, t + 0.2);
      };
      const badgeIn = (badge, t) => {
        tl.fromTo(badge, { opacity: 0, scale: 0.8 },
          { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" }, t);
        drawIcon(badge, t);
      };
      const textIn = (el, t) => tl.fromTo(el, { opacity: 0, x: -56, filter: "blur(10px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, t);

      // CLARIDAD
      badgeIn(q("f36-b1"), T.claridad - LEAD);
      textIn(q("f36-t1"), T.claridad - LEAD + 0.02);
      // CERCANÍA (rail grows down to row 2)
      badgeIn(q("f36-b2"), T.cercania - LEAD);
      textIn(q("f36-t2"), T.cercania - LEAD + 0.02);
      tl.fromTo(q("f36-rail"), { scaleY: 0 }, { scaleY: 0.5, duration: 0.34, ease: "power3.out" }, T.cercania - LEAD);
      // UN MÉTODO · PENSADO · [PARA TI]
      badgeIn(q("f36-b3"), T.metodo - LEAD);
      textIn(q("f36-t3a"), T.metodo - LEAD + 0.02);
      tl.fromTo(q("f36-rail"), { scaleY: 0.5 }, { scaleY: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, T.metodo - LEAD);
      // the block is framed on the short rows, then glides left to re-centre as row 3 grows
      tl.fromTo(q("f36-block"), { x: 282 }, { x: 0, duration: 0.56, ease: "power2.inOut" }, T.pensado - 0.08);
      tl.fromTo(q("f36-t3b"), { opacity: 0, x: 80, filter: "blur(10px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, T.pensado - LEAD);

      // word-chip: lands with PARA, then widens for TI
      const chip = q("f36-chip");
      tl.fromTo(chip, { opacity: 0, scale: 1.08, rotation: -1.5, filter: "blur(6px)" },
        { opacity: 1, scale: 1, rotation: -1.5, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, T.para - LEAD);
      tl.fromTo(q("f36-chipbg"), { clipPath: "inset(0px 26% 0px 0px round 22px)" },
        { clipPath: "inset(0px 26% 0px 0px round 22px)", duration: 0.01, ease: "none" }, 0);
      tl.fromTo(q("f36-c-ti"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.24, ease: "power3.out" }, T.ti - LEAD);
      tl.to(q("f36-chipbg"), { clipPath: "inset(0px 0% 0px 0px round 22px)", duration: 0.22, ease: "power3.out" }, T.ti - LEAD);

      // ================= CAMERA =================
      // quiet drift under scene 2 (monotonic)
      tl.fromTo(q("f36-cam"), { scale: 1 }, { scale: 1.014, duration: T.riser - 1.6, ease: "power1.inOut" }, 1.6);
      // RISER (4.89): slow brighten + push-in + a light glow rising behind the rows
      const RD = D - T.riser;
      tl.fromTo(q("f36-push"), { scale: 1 }, { scale: 1.06, duration: RD, ease: "power1.in" }, T.riser);
      tl.fromTo(q("f36-rglow"), { opacity: 0, y: 160, scale: 0.8 }, { opacity: 1, y: 0, scale: 1.08, duration: RD, ease: "power1.in" }, T.riser);
      tl.fromTo(q("f36-bright"), { opacity: 0 }, { opacity: 1, duration: RD, ease: "power1.in" }, T.riser);
      tl.fromTo(q("f36-dots"), { y: 0 }, { y: -40, duration: RD, ease: "power1.in" }, T.riser);

      window.__timelines = window.__timelines || {};
      // voice retime (tools/retime_v4.py): design-time cues → v4 voice cues (earlier takes folded in), piecewise linear. Design untouched.
      ((tl, A) => {
        const f = (t) => {
          if (t <= A[0][0]) return t - A[0][0] + A[0][1];
          for (let i = 1; i < A.length; i++) if (t <= A[i][0]) { const [a0, b0] = A[i - 1], [a1, b1] = A[i]; return b0 + (t - a0) * (b1 - b0) / (a1 - a0); }
          const [a, b] = A[A.length - 1]; return b + (t - a);
        };
        tl.getChildren(false, true, true).forEach((c) => {
          const s = c.startTime(), d = c.duration(), ns = f(s);
          if (d >= 1.0 && !(c.vars && c.vars.repeat)) {
            const nd = Math.max(0.05, f(s + d) - ns);
            if (c instanceof gsap.core.Timeline) c.timeScale((c.timeScale() || 1) * d / nd); else c.duration(nd);
          }
          c.startTime(ns);
        });
      })(tl, [[-0.0, 0.0], [0.12, 0.12], [0.37, 0.308], [0.93, 0.862], [1.7, 1.613], [2.23, 2.12], [2.99, 2.806], [3.82, 3.416], [3.9, 3.482], [4.07, 3.641], [4.44, 4.083], [4.97, 4.543], [5.15, 4.702], [5.6, 5.07]]);
      window.__timelines["36-promesa"] = tl;
    })();

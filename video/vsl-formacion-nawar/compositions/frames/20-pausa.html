  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);

      // ===== Scene 1 (0.0-0.6): hard cut to a FROZEN image. Only the pause flash + player bar move. =====
      tl.fromTo($("f20-pause"), { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.15, duration: 0.25, ease: "power2.out" }, 0);
      tl.fromTo($("f20-bar"), { y: 170 }, { y: 0, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo($("f20-shade"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);
      // the lid itself is still: rotationX 0 until the very end
      tl.fromTo($("f20-lid"), { rotationX: 0 }, { rotationX: 0, duration: 0.01, ease: "none" }, 0);

      // ===== Scene 2 (0.6-2.2): the question builds ON the lid =====
      tl.fromTo($("f20-vale"), { opacity: 0, y: 22, rotation: -6 }, { opacity: 1, y: 0, rotation: 0, duration: 0.3, ease: "power3.out" }, 0.58);
      [["f20-w1", 1.05], ["f20-w2", 1.20], ["f20-w3", 1.41]].forEach(([id, t]) => {
        tl.fromTo($(id), { opacity: 0, y: 40, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.26, ease: "power3.out" }, t);
      });
      tl.fromTo($("f20-dentro"), { opacity: 0, scale: 1.25, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, 1.53);
      // 3-frame micro-shake of the text only
      tl.set($("f20-shake"), { x: 0 }, 0);
      tl.set($("f20-shake"), { x: 7, y: -2 }, 1.70);
      tl.set($("f20-shake"), { x: -6, y: 2 }, 1.7334);
      tl.set($("f20-shake"), { x: 3, y: -1 }, 1.7667);
      tl.set($("f20-shake"), { x: 0, y: 0 }, 1.80);

      // ===== Scene 3 (2.2-3.22): "Te lo cuento." + cursor clicks play =====
      [["f20-w5", 2.24], ["f20-w6", 2.36], ["f20-w7", 2.45]].forEach(([id, t]) => {
        tl.fromTo($(id), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.24, ease: "power2.out" }, t);
      });
      // cursor enters from bottom-right, glides to the play disc
      tl.fromTo($("f20-cursor"), { x: 1020, y: 700 }, { x: 0, y: 0, duration: 0.65, ease: "power2.inOut" }, 2.30);

      tl.fromTo($("f20-cursori"), { scale: 1 }, { scale: 0.86, duration: 0.05, ease: "power2.out" }, 3.05);
      tl.to($("f20-cursori"), { scale: 1, duration: 0.08, ease: "power2.out" }, 3.10);
      tl.fromTo($("f20-press"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power2.out" }, 3.05);
      tl.fromTo($("f20-ripple"), { opacity: 0.7, scale: 1 }, { opacity: 0, scale: 1.8, duration: 0.35, ease: "power2.out", immediateRender: false }, 3.05);
      tl.set($("f20-ripple"), { opacity: 0 }, 0);
      // player icon flips to pause (= playing)
      tl.set($("f20-bplay"), { opacity: 1 }, 0);
      tl.set($("f20-bpause"), { opacity: 0 }, 0);
      tl.set($("f20-bplay"), { opacity: 0 }, 3.12);
      tl.set($("f20-bpause"), { opacity: 1 }, 3.12);
      // the lid starts to lift on its hinge (continues in 21)
      tl.to($("f20-lid"), { rotationX: 4, duration: 0.09, ease: "power2.in" }, 3.10);

      window.__timelines["20-pausa"] = tl;
    })();
  </script>

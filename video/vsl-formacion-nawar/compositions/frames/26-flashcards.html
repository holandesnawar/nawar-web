  <script>
    (function () {
      const q = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const D = 3.89, LEAD = 0.05;
      // v3 voice cues (frame-relative)
      const T = {
        flash: 0.12, incl: 0.616, para: 1.285, que: 1.423, el: 1.496, vocab: 1.57, se: 2.083, quede: 2.194,
        y: 2.437, no: 2.588, se2: 2.726, te: 2.863, escape: 2.946, a: 3.294, la: 3.34, semana: 3.414
      };
      const rise = (el, cue, dy, dur) => tl.fromTo(el, { opacity: 0, y: dy },
        { opacity: 1, y: 0, duration: dur || 0.36, ease: "power3.out" }, cue - LEAD);

      // ================= ENTRANCE: the MacBook rises into place (one move) =================
      tl.fromTo(q("f26-lap"), { y: 64 }, { y: 0, duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo(q("f26-lap"), { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out" }, 0);
      tl.fromTo(q("f26-amb"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
      // slow, purposeful camera: the device breathes in by 1.5 % over the shot (footage never zoomed)
      tl.fromTo(q("f26-drift"), { scale: 1 }, { scale: 1.015, duration: D, ease: "power1.inOut" }, 0);

      // ================= «Flashcards incluidas,» =================
      rise(q("f26-h1"), T.flash, 46, 0.5);
      rise(q("f26-h2"), T.incl, 46, 0.5);

      // ================= «para que el vocabulario se quede» =================
      [["para", T.para], ["que", T.que], ["el", T.el], ["vocab", T.vocab], ["se", T.se], ["quede", T.quede]]
        .forEach(([id, t]) => rise(q("f26-w-" + id), t, 18, 0.32));
      // the real word cards arrive with «vocabulario» and the stack settles on «quede»
      [["f26-c3", 0.92, 34, T.vocab - LEAD], ["f26-c2", 0.96, 34, T.vocab + 0.14], ["f26-c1", 1, 40, T.quede - LEAD]].forEach(([id, s, dy, at]) => {
        tl.fromTo(q(id), { y: dy, scale: s }, { y: 0, scale: s, duration: 0.5, ease: "power3.out" }, at);
        tl.fromTo(q(id), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, at);
      });

      // ================= «y no se te escape a la semana.» =================
      [["y", T.y], ["no", T.no], ["se2", T.se2], ["te", T.te], ["escape", T.escape], ["a", T.a], ["la", T.la], ["semana", T.semana]]
        .forEach(([id, t]) => rise(q("f26-w-" + id), t, 18, 0.32));
      tl.fromTo(q("f26-week"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, T.y - LEAD);
      // every day of the week ticks in #4da3ff, the last one on «semana»
      const step = (T.semana - T.no) / 6;
      for (let i = 0; i < 7; i++) {
        const at = T.no + i * step - 0.03;
        tl.fromTo(q("f26-df" + i), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power3.out" }, at);
        tl.fromTo(q("f26-dt" + i), { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, at + 0.06);
        tl.fromTo(q("f26-dl" + i), { color: "rgba(255,255,255,0.72)" }, { color: "#FFFFFF", duration: 0.2, ease: "power1.out" }, at);
      }

      window.__timelines = window.__timelines || {};
      // voice retime (tools/retime_v4.py): design-time cues → v4 voice cues (earlier takes folded in), piecewise linear. Design untouched.
      ((tl, A) => {
        const f = (t) => {
          if (t <= A[0][0]) return t - A[0][0] + A[0][1];
          for (let i = 1; i < A.length; i++) if (t <= A[i][0]) { const [a0, b0] = A[i - 1], [a1, b1] = A[i]; return b0 + (t - a0) * (b1 - b0) / (a1 - a0); }
          const [a, b] = A[A.length - 1]; return b + (t - a);
        };
        tl.getChildren(false, true, true).forEach((c) => {
          const s = c.startTime(), d = c.duration(), ns = f(s);
          if (d >= 1.0 && !(c.vars && c.vars.repeat)) {
            const nd = Math.max(0.05, f(s + d) - ns);
            if (c instanceof gsap.core.Timeline) c.timeScale((c.timeScale() || 1) * d / nd); else c.duration(nd);
          }
          c.startTime(ns);
        });
      })(tl, [[-0.0, 0.0], [0.12, 0.12], [0.616, 0.59], [1.285, 1.247], [1.423, 1.379], [1.496, 1.473], [1.57, 1.557], [2.083, 2.102], [2.194, 2.186], [2.437, 2.444], [2.588, 2.609], [2.726, 2.75], [2.863, 2.89], [2.946, 2.966], [3.294, 3.322], [3.34, 3.369], [3.414, 3.444], [3.89, 3.907]]);
      window.__timelines["26-flashcards"] = tl;
    })();
  </script>

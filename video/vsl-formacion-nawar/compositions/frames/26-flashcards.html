  <script>
    (function () {
      const q = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const D = 4.55, LEAD = 0.04, F = 1 / 30;
      const T = {
        ademas: 0.12, tienes: 0.50, flashcards: 0.80, para: 1.39, que: 1.63, el: 1.76, vocab: 1.82,
        se: 2.42, quede: 2.51, y: 2.79, no: 2.96, se2: 3.10, te: 3.26, escape: 3.37, a: 3.74, la: 3.80, semana: 3.89

      const slam = (id, cue, s) => tl.fromTo(q(id), { opacity: 0, scale: s, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, cue - LEAD);

      // ---------- build the weekly strip (L M X J V S D) ----------
      const days = ["L", "M", "X", "J", "V", "S", "D"];
      const dayEls = days.map((d, i) => {
        const c = document.createElement("div"); c.className = "f26-day"; c.id = "f26-day" + i;
        c.innerHTML = '<div class="f26-dl">' + d + '</div><div class="f26-dc"><div class="f26-df" id="f26-df' + i + '"></div>' +
          '<svg class="f26-dsvg" viewBox="0 0 36 36" aria-hidden="true"><path id="f26-dt' + i + '" d="M10,18.5 L15.5,24 L26,12.5" pathLength="100" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100 100" stroke-dashoffset="100"/></svg></div>';
        q("f26-cal").appendChild(c);
        return c;
      });

      // ---------- resting states ----------
      tl.set(q("f26-dim"), { opacity: 0 }, 0);
      tl.set(q("f26-focus"), { opacity: 0 }, 0);
      tl.set([q("f26-k1"), q("f26-k2"), q("f26-k3"), q("f26-k0")], { opacity: 0 }, 0);
      tl.set(q("f26-pin"), { opacity: 0, scale: 0 }, 0);
      tl.set(q("f26-pin-ring"), { opacity: 0 }, 0);
      tl.set(q("f26-cal"), { opacity: 0 }, 0);
      tl.set(dayEls.map((d, i) => q("f26-df" + i)), { scale: 0, opacity: 0 }, 0);

      // ================= ENTRANCE (0.00-0.45) =================
      // the flashcard prop flips in from edge-on; the laptop settles in from a steeper angle
      tl.fromTo(q("f26-c0"), { rotationY: -90, transformPerspective: 1400 },
        { rotationY: 0, transformPerspective: 1400, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo(q("f26-c0pos"), { x: 40, y: 0, scale: 1.08 }, { x: 0, y: 0, scale: 1, duration: 0.36, ease: "power3.out" }, 0);
      tl.fromTo(q("f26-lap"), { rotationY: 28, rotationX: 6, x: -70 }, { rotationY: 12, rotationX: 3, x: 0, duration: 0.5, ease: "expo.out" }, 0);
      tl.fromTo(q("f26-dots"), { scale: 1.1 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(q("f26-lapback"), { scale: 1 }, { scale: 1.035, duration: 1.12, ease: "power1.inOut" }, 0.2);

      // ================= SCENE 1: "Además tienes FLASHCARDS" =================
      rise("f26-w-ademas", T.ademas); rise("f26-w-tienes", T.tienes);
      slam("f26-flash", T.flashcards, 1.34);
      // the prop flips el bocadillo -> het broodje on "flashcards" (the real card on screen flips at the same instant)
      tl.fromTo(q("f26-c0"), { rotationY: 0, transformPerspective: 1400 },
        { rotationY: 180, transformPerspective: 1400, duration: 0.42, ease: "power2.inOut", immediateRender: false }, T.flashcards - LEAD);
      tl.fromTo(q("f26-c0pos"), { y: 0, scale: 1 }, { y: -26, scale: 1.08, duration: 0.21, ease: "power2.out", immediateRender: false }, T.flashcards - LEAD);
      tl.fromTo(q("f26-c0pos"), { y: -26, scale: 1.08 }, { y: 0, scale: 1, duration: 0.24, ease: "power2.inOut", immediateRender: false }, T.flashcards - LEAD + 0.21);
      tl.fromTo(q("f26-focus"), { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power3.out", immediateRender: false }, T.flashcards - LEAD);

      // ================= SEAM 1 -> 2 (1.30-1.80): type cuts up, laptop steps back, card leaves the screen =================
      tl.to(q("f26-t1"), { y: -190, filter: "blur(8px)", duration: 0.18, ease: "power4.in" }, 1.2);
      tl.to(q("f26-t1"), { opacity: 0, duration: 0.06, ease: "none" }, 1.32);
      tl.to(q("f26-lapback"), { scale: 0.86, x: -40, y: 6, filter: "blur(5px)", duration: 0.55, ease: "power3.inOut" }, 1.34);
      tl.to(q("f26-lap"), { rotationY: 20, duration: 0.55, ease: "power3.inOut" }, 1.34);
      tl.to(q("f26-dim"), { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.36);
      tl.to(q("f26-focus"), { opacity: 0, duration: 0.3, ease: "power1.out" }, 1.36);
      // hand-off: the 3D prop becomes the flat top card of the deck (identical look), then travels to the deck
      tl.set(q("f26-c0pos"), { opacity: 0 }, 1.3);
      const S = 1.22;   // the deck is drawn at 1.22x: hand-off coords are the prop's box expressed in deck space
      tl.set(q("f26-k0"), { opacity: 1, x: 390 / S, y: 290 / S, rotation: 0, scale: 1 / S }, 1.3);
      tl.to(q("f26-k0"), { x: 30, y: 26, rotation: -5, scale: 1, duration: 0.5, ease: "power3.inOut" }, 1.34);

      // ================= SCENE 2: "para que el vocabulario SE QUEDE" =================
      rise("f26-w-para", T.para, 60); rise("f26-w-que", T.que); rise("f26-w-el", T.el); rise("f26-w-vocab", T.vocab);
      // the vocabulary flies in loose around the top card
      const loose = {
        k1: { from: { x: -560, y: -440, rotation: -38 }, to: { x: -200, y: -132, rotation: -11 } },
        k2: { from: { x: 520, y: -520, rotation: 34 }, to: { x: 180, y: -140, rotation: 9 } },
        k3: { from: { x: -440, y: 480, rotation: 28 }, to: { x: -196, y: 196, rotation: 8 } }
      };
      ["k1", "k2", "k3"].forEach((k, i) => {
        const at = T.vocab - LEAD + i * 0.05;
        tl.fromTo(q("f26-" + k), { opacity: 0, x: loose[k].from.x, y: loose[k].from.y, rotation: loose[k].from.rotation },

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);

      // ---------- camera: gentle push from frame 18's end state, a little closer on "delatan",
      //            eases back on "y" (no punches)
      tl.fromTo("#f19-cam", { scale: 1 }, { scale: 1.015, duration: 0.24, ease: "power2.out" }, 0);
      tl.to("#f19-cam", { scale: 1.02, duration: 0.42, ease: "none" }, 0.24);
      tl.to("#f19-cam", { scale: 1.045, duration: 0.42, ease: "power3.out" }, 0.68);
      tl.to("#f19-cam", { scale: 1.03, duration: 0.5, ease: "power2.inOut" }, 1.2);
      tl.to("#f19-cam", { scale: 1.035, duration: 0.4, ease: "power2.out" }, 2.42);

      // ---------- Scene 1 lead-in words: "Son los que"
      [["#f19-w-son", 0.08], ["#f19-w-los", 0.30], ["#f19-w-que", 0.46]].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0, y: 56, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.26, ease: "power3.out" }, t);
      });
      // "te" rises, "delatan" slams
      tl.fromTo("#f19-w-te", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, 0.55);
      tl.fromTo("#f19-w-delatan", { opacity: 0, scale: 1.1, filter: "blur(6px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0.67);

      // ---------- "delatan": red alert on every key
      for (let i = 0; i < 4; i++) {
        const t0 = 0.68 + i * 0.015;
        tl.fromTo("#f19-alert-" + i, { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, t0);
        tl.fromTo("#f19-tint-" + i, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, t0);
        // the ledge turns red with the face so the alert box reads fully filled
        tl.fromTo("#f19-key-" + i,
          { boxShadow: "0px 18px 0px rgb(221,230,245), 0px 30px 60px rgba(18,0,129,0.16)" },
          { boxShadow: "0px 18px 0px rgb(246,200,206), 0px 30px 60px rgba(224,45,60,0.18)", duration: 0.12, ease: "power2.out" }, t0);
      }

      // ---------- Scene 2 seam (1.22 "y"): red clears, headline line rolls up into the next one
      for (let i = 0; i < 4; i++) {
        tl.to("#f19-alert-" + i, { opacity: 0, scale: 1.03, duration: 0.2, ease: "power2.out" }, 1.2 + i * 0.02);
        tl.to("#f19-tint-" + i, { opacity: 0, duration: 0.2, ease: "power2.out" }, 1.2 + i * 0.02);
        tl.to("#f19-key-" + i, { boxShadow: "0px 18px 0px rgb(221,230,245), 0px 30px 60px rgba(18,0,129,0.16)", duration: 0.2, ease: "power2.out" }, 1.2 + i * 0.02);
      }
      tl.to("#f19-l1", { y: -190, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.13);
      [["#f19-w-y", 1.21], ["#f19-w-los2", 1.27]].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 1, y: 190, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, t);
      });
      tl.fromTo("#f19-w-entrenamos", { opacity: 1, y: 190, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 1.43);

      // ---------- checks: one by one (1.50, 1.85, 2.20, 2.45)
      const CHECKS = [1.50, 1.85, 2.20, 2.45];
      CHECKS.forEach((T, i) => {
        // badge appears (no overshoot) and its tick draws
        tl.fromTo("#f19-badge-" + i, { opacity: 0, scale: 0.6, rotation: 0 },
          { opacity: 1, scale: 1, rotation: 0, duration: 0.28, ease: "power3.out" }, T - 0.04);
        tl.fromTo("#f19-tick-" + i, { strokeDashoffset: 40 }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, T + 0.04);
        // indigo floods out of the badge corner
        tl.fromTo("#f19-fill-" + i, { clipPath: "circle(0px at 96% 4%)" },
          { clipPath: "circle(440px at 96% 4%)", duration: 0.34, ease: "power2.out" }, T - 0.03);
        // key press: down, then settle as a solid indigo key
        tl.fromTo("#f19-key-" + i,
          { y: 0, boxShadow: "0px 18px 0px rgb(221,230,245), 0px 30px 60px rgba(18,0,129,0.16)" },
          { y: 10, boxShadow: "0px 8px 0px rgb(14,0,102), 0px 16px 32px rgba(18,0,129,0.24)", duration: 0.08, ease: "power2.in" }, T - 0.03);
        tl.to("#f19-key-" + i,
          { y: 0, boxShadow: "0px 18px 0px rgb(14,0,102), 0px 30px 60px rgba(18,0,129,0.30)", duration: 0.32, ease: "power3.out" }, T + 0.05);
      });

      // ---------- "uno a uno" under the row
      tl.fromTo("#f19-hair-l", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 2.16);
      tl.fromTo("#f19-hair-r", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 2.16);
      [["#f19-u1", 2.16], ["#f19-u2", 2.34], ["#f19-u3", 2.40]].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0, y: 44, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.26, ease: "power3.out" }, t);
      });
      // voice retime (tools/retime_v4.py): design-time cues → v4 voice cues (earlier takes folded in), piecewise linear. Design untouched.
      ((tl, A) => {
        const f = (t) => {
          if (t <= A[0][0]) return t - A[0][0] + A[0][1];
          for (let i = 1; i < A.length; i++) if (t <= A[i][0]) { const [a0, b0] = A[i - 1], [a1, b1] = A[i]; return b0 + (t - a0) * (b1 - b0) / (a1 - a0); }
          const [a, b] = A[A.length - 1]; return b + (t - a);
        };
        tl.getChildren(false, true, true).forEach((c) => {
          const s = c.startTime(), d = c.duration(), ns = f(s);
          if (d >= 1.0 && !(c.vars && c.vars.repeat)) {
            const nd = Math.max(0.05, f(s + d) - ns);
            if (c instanceof gsap.core.Timeline) c.timeScale((c.timeScale() || 1) * d / nd); else c.duration(nd);
          }
          c.startTime(ns);
        });
      })(tl, [[-0.0, 0.0], [0.12, 0.12], [0.333, 0.317], [0.491, 0.496], [0.583, 0.59], [0.703, 0.683], [1.222, 1.247], [1.296, 1.322], [1.472, 1.491], [2.194, 2.176], [2.37, 2.345], [2.426, 2.411], [2.871, 2.907]]);

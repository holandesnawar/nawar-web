  <script>
    (function () {
      gsap.registerPlugin(MotionPathPlugin);
      const tl = gsap.timeline({ paused: true });
      const q = (id) => document.getElementById(id);

      const LEAD = 0.04;

      // ---- cue table (frame-relative seconds, from the packet) ----
      const T = {
        casi: 0.12, ninguna: 0.36, escuela: 0.78, piensa: 1.21, en: 1.55, ti: 1.59,

      const ROUTE = "M454,468 C490,330 620,250 848,250 L1072,250 C1300,250 1430,330 1466,468";

      // masked word rise (lands on its cue, <= 40 ms early)

      const slam = (id, t, from) => tl.fromTo(q(id),

        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "power4.out" }, t - LEAD);

      const shake = (id, t, a) => {
        tl.fromTo(q(id), { x: 0, y: 0 }, { x: a, y: -a * 0.5, duration: F, ease: "power2.out", immediateRender: false }, t);
        tl.to(q(id), { x: -a * 0.7, y: a * 0.35, duration: F, ease: "power2.out" }, t + F);
        tl.to(q(id), { x: 0, y: 0, duration: F, ease: "power2.out" }, t + 2 * F);
      };

      // ================= SCENE 1 (0.00 – 2.17) =================
      // entrance: the course wall cascades in from the top, row by row (stagger 0.04)
      // row 1 is already on screen (half-dropped, 50 %) at t=0 so the cut from the dark frame 09 never flashes blank
      const ROT = [-5, 3, -2, 4, 3, -4, 2, -3, -3, 5, -2, 3];
      for (let i = 0; i < 12; i++) {
        const t0 = 0.0 + i * 0.03;

        tl.fromTo(q("f10-c" + i),
          { y: first ? -110 : -220, scale: 1.06, rotation: ROT[i], filter: "blur(6px)" },
          { y: 0, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.38, ease: "power4.out" }, t0);

      tl.fromTo(q("f10-band-bg"), { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power4.out" }, 0.04);
      rise("f10-w-casi", T.casi);
      rise("f10-w-ninguna", T.ninguna);
      rise("f10-w-escuela", T.escuela);
      rise("f10-w-piensa", T.piensa);
      rise("f10-w-en", T.en, 0.22);
      // "piensa en ti": every card gets its EN badge and goes grey
      for (let i = 0; i < 12; i++) {
        const t = T.piensa - LEAD + [0, 1, 2, 3, 1, 2, 3, 4, 2, 3, 4, 5][i] * 0.035;
        tl.fromTo(q("f10-g" + i), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.26, ease: "power3.out" }, t);
        tl.fromTo(q("f10-b" + i), { filter: "grayscale(0)", opacity: 1 },
          { filter: "grayscale(1)", opacity: 0.5, duration: 0.42, ease: "power2.out" }, t);

      // "ti." — indigo word-chip slams in, band takes the hit
      tl.fromTo(q("f10-ti"),
        { scale: 1.8, opacity: 0, rotation: -7, filter: "blur(10px)" },
        { scale: 1, opacity: 1, rotation: -1.5, filter: "blur(0px)", duration: 0.32, ease: "power4.out" }, T.ti - LEAD);
      shake("f10-band", T.ti + 0.1, 7);

      // ---- full-screen push seam (no opacity): outgoing + incoming stacked 1080 px apart, moving as ONE sheet.
      // Accelerate on power3.in for the first half (0 -> -540), cut at peak velocity, decelerate on power4.out
      // for the second half (-540 -> -1080). Velocities at the cut: 3*540/ta vs 4*540/tb (matched within ~6 %).
      // A short blur streak rides the two fastest frames on each side of the cut.
      const push = (outId, inId, tA, durA, durB) => {
        const o = q(outId), n = q(inId), tB = tA + durA;
        tl.fromTo(o, { y: 0 }, { y: -540, duration: durA, ease: "power3.in", immediateRender: false }, tA);
        tl.fromTo(n, { y: 1080 }, { y: 540, duration: durA, ease: "power3.in" }, tA);
        tl.fromTo(o, { y: -540 }, { y: -1080, duration: durB, ease: "power4.out", immediateRender: false }, tB);
        tl.fromTo(n, { y: 540 }, { y: 0, duration: durB, ease: "power4.out", immediateRender: false }, tB);
        tl.fromTo([o, n], { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 0.07, ease: "power1.in", immediateRender: false }, tB - 0.07);
        tl.fromTo([o, n], { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.09, ease: "power1.out", immediateRender: false }, tB);
      };

      // seam 1 -> 2 (cut at 2.17, right before "Te")
      push("f10-s1", "f10-s2", 1.93, 0.24, 0.34);

      // ================= SCENE 2 (2.17 – 4.53) =================
      // nodes arrive solid (no opacity pop) and settle from 0.8 while the sheet decelerates

      tl.fromTo(q("f10-direct-lbl"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, T.como - LEAD);

      rise("f10-w-ensenan", T.ensenan);
      rise("f10-w-el", T.el);
      rise("f10-w-idioma", T.idioma);

      const D1 = 0.62, D2 = 0.32;

      tl.fromTo(q("f10-dot"), { scale: 0 }, { scale: 1, duration: 0.2, ease: "power3.out" }, T.ensenan - LEAD);

      tl.to(q("f10-dot"), { motionPath: { path: ROUTE, start: 0, end: F1 }, duration: D1, ease: "power2.inOut" }, T.ensenan);
      rise("f10-w-como", T.como);
      rise("f10-w-si", T.si);
      rise("f10-w-vinieras", T.vinieras);
      rise("f10-w-del", T.del);

      tl.to(q("f10-disc-en"), { scale: 1, duration: 0.3, ease: "power2.inOut" }, T.ingles - LEAD + 0.14);

      tl.to(q("f10-ring-en"), { scale: 1.24, opacity: 0, duration: 0.45, ease: "power2.out" }, T.ingles - LEAD + F);
      // EN -> NL lands at ~4.09 so the arrival gets a real beat before the seam
      const T_NL = T.ingles - LEAD + D2;
      tl.to([q("f10-route"), q("f10-route-shadow")], { strokeDashoffset: 0, duration: D2, ease: "power2.inOut" }, T.ingles - LEAD);
      tl.to(q("f10-dot"), { motionPath: { path: ROUTE, start: F1, end: 1 }, duration: D2, ease: "power2.inOut" }, T.ingles - LEAD);
      tl.fromTo(q("f10-disc-nl"), { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out" }, T_NL);
      tl.to(q("f10-disc-nl"), { scale: 1, duration: 0.2, ease: "power2.inOut" }, T_NL + 0.12);
      tl.fromTo(q("f10-ring-nl"), { scale: 1, opacity: 0 }, { scale: 1.03, opacity: 0.8, duration: F, ease: "none" }, T_NL);

      // seam 2 -> 3 (cut at 4.53, exactly on "y")
      push("f10-s2", "f10-s3", 4.29, 0.24, 0.36);

      // ================= SCENE 3 (4.53 – 6.611) =================
      rise("f10-w-y", T.y + 0.02);
      rise("f10-w-te2", T.te2);
      rise("f10-w-dejan", T.dejan);

      tl.fromTo(q("f10-sq2"), { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 4.9);
      // "solo": the word slams, the world around the lone learner dims

      tl.fromTo(q("f10-vig"), { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, T.solo - LEAD);

      const STEPS = {"f10-band-line": [[null, 672.5], [0.36, 476.6, 0.34], [0.78, 295.2, 0.34], [1.21, 136.5, 0.34], [1.55, 0.0, 0.34]], "f10-s2-lead": [[null, 113.5], [2.57, 87.4, 0.12], [2.69, 0.0, 0.34]], "f10-s2-main": [[null, 512.1], [3.24, 459.3, 0.15], [3.39, 247.7, 0.32], [3.71, 0.0, 0.34]], "f10-top": [[null, 395.1], [4.87, 359.0, 0.12], [4.99, 268.5, 0.34], [5.34, 0.0, 0.34]], "f10-bot": [[null, 516.1], [5.86, 463.3, 0.19], [6.05, 0.0, 0.34]]};
      Object.keys(STEPS).forEach((id) => {

        for (let k = 1; k < st.length; k++) {
          const t = st[k][0], x = st[k][1], d = st[k][2];
          if (k === 1) tl.fromTo(q(id), { x: st[0][1] }, { x: x, duration: d, ease: "power3.out" }, t - LEAD);

      ((tl, A) => {
        const f = (t) => {
          if (t <= A[0][0]) return t - A[0][0] + A[0][1];
          for (let i = 1; i < A.length; i++) if (t <= A[i][0]) { const [a0, b0] = A[i - 1], [a1, b1] = A[i]; return b0 + (t - a0) * (b1 - b0) / (a1 - a0); }
          const [a, b] = A[A.length - 1]; return b + (t - a);
        };
        tl.getChildren(false, true, true).forEach((c) => {
          const s = c.startTime(), d = c.duration(), ns = f(s);
          if (d >= 1.0 && !(c.vars && c.vars.repeat)) {
            const nd = Math.max(0.05, f(s + d) - ns);
            if (c instanceof gsap.core.Timeline) c.timeScale((c.timeScale() || 1) * d / nd); else c.duration(nd);
          }
          c.startTime(ns);
        });
      })(tl, [[0.0, 0.0], [0.12, 0.12], [0.361, 0.34], [0.782, 0.68], [1.213, 1.1], [1.555, 1.44], [1.592, 1.55], [2.204, 2.12], [2.287, 2.2], [2.574, 2.55], [2.694, 2.65], [3.046, 3.0], [3.241, 3.23], [3.389, 3.36], [3.713, 3.72], [3.815, 3.83], [4.528, 4.45], [4.574, 4.54], [4.87, 4.85], [4.991, 4.93], [5.342, 5.23], [5.667, 5.56], [5.861, 5.71], [6.055, 5.87], [6.611, 6.65]]);

    <div class="f27-h" id="f27-p1a" style="top:346px;"><span class="f27-w" id="f27-w-consultas">Consultas</span></div>

    <div class="f27-s" id="f27-p1s" style="top:658px;"><span class="f27-w" id="f27-w-te">¿Te</span><span class="f27-w" id="f27-w-atascas">atascas</span><span class="f27-w" id="f27-w-y">y</span><span class="f27-w" id="f27-w-necesitas">necesitas</span><span class="f27-w f27-hi" id="f27-w-ayuda">ayuda?</span></div>

    <div class="f27-s" id="f27-p2s" style="top:572px;"><span class="f27-w" id="f27-w-tus">Tus</span><span class="f27-w" id="f27-w-dudas">dudas</span><span class="f27-w" id="f27-w-no">no</span><span class="f27-w" id="f27-w-se">se</span><span class="f27-w" id="f27-w-quedan">quedan</span><span class="f27-w" id="f27-w-esperando">esperando,</span></div>
    <div class="f27-pill f27-pill-glass" id="f27-st-wait" style="top:644px;"><svg viewBox="0 0 28 28" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="10.5" /><path d="M14 8.2 V14 L18 16.4" /></g></svg><span>Pendiente</span></div>

    <!-- page 3 -->
    <div class="f27-h" id="f27-p3a" style="top:346px;"><span class="f27-w" id="f27-w-se3">Se</span><span class="f27-w" id="f27-w-quedan3">quedan</span></div>
    <div class="f27-h" id="f27-p3b" style="top:433px;"><span class="f27-w f27-acc" id="f27-w-guardadas">guardadas.</span></div>
    <div class="f27-pill f27-pill-glass" id="f27-vis" style="top:572px;"><svg viewBox="0 0 28 28" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="9.5" r="3.8" /><path d="M3.5 22 C3.5 17.6 6.6 14.8 10.5 14.8 C14.4 14.8 17.5 17.6 17.5 22" /><circle cx="19.2" cy="10.4" r="3" /><path d="M19 14.9 C22.3 14.9 24.6 17.4 24.6 21.2" /></g></svg><span>Visible para todos los alumnos</span></div>
  </div>

  <script>
    (function () {
      const q = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const D = 9.135, LEAD = 0.05;
      // v3 voice cues (frame-relative)
      const T = {
        consultas: 0.12, dentro: 0.661, de: 0.973, la: 1.056, escuela: 1.129,
        te: 1.844, atascas: 1.935, y: 2.44, necesitas: 2.523, ayuda: 3.009,
        preguntas: 3.668, y2: 4.421, te2: 4.503, responden: 4.613,
        tus: 5.494, dudas: 5.677, no: 6.012, se: 6.219, quedan: 6.356, esperando: 6.586,
        y3: 7.375, se3: 7.448, quedan3: 7.577, guardadas: 7.907, para: 8.411, todos: 8.577
      };
      const word = (id, cue, dy, dur) => tl.fromTo(q("f27-w-" + id), { opacity: 0, y: dy },
        { opacity: 1, y: 0, duration: dur, ease: "power3.out" }, cue - LEAD);
      const H = (id, cue) => word(id, cue, 44, 0.48);
      const S = (id, cue) => word(id, cue, 18, 0.32);
      // page change: the previous lines lift away together, just before the next line lands
      const pageOut = (ids, at) => ids.forEach((id) => {
        tl.fromTo(q(id), { y: 0, opacity: 1 }, { y: -34, opacity: 0, duration: 0.24, ease: "power2.in", immediateRender: false }, at);
      });

      // ================= ENTRANCE: the MacBook rises into place (one move) =================
      tl.fromTo(q("f27-lap"), { y: 64 }, { y: 0, duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo(q("f27-lap"), { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out" }, 0);
      tl.fromTo(q("f27-amb"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
      tl.fromTo(q("f27-drift"), { scale: 1 }, { scale: 1.012, duration: D, ease: "power1.inOut" }, 0);

      // ================= PAGE 1 — «Consultas dentro de la escuela. ¿Te atascas y necesitas ayuda?» =================
      H("consultas", T.consultas); H("dentro", T.dentro); H("de", T.de); H("la", T.la); H("escuela", T.escuela);
      S("te", T.te); S("atascas", T.atascas); S("y", T.y); S("necesitas", T.necesitas); S("ayuda", T.ayuda);

      // ================= PAGE 2 — «Preguntas, y te responden.» =================
      pageOut(["f27-p1a", "f27-p1b", "f27-p1c", "f27-p1s"], T.preguntas - 0.26);
      H("preguntas", T.preguntas); H("y2", T.y2); H("te2", T.te2); H("responden", T.responden);
      // the REAL answered consulta slides in front of the laptop; the laptop steps back in focus
      tl.fromTo(q("f27-answ"), { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.62, ease: "power3.out" }, T.te2 - LEAD);
      tl.fromTo(q("f27-lapf"), { filter: "brightness(1) blur(0px)" }, { filter: "brightness(0.78) blur(0px)", duration: 0.6, ease: "power2.out" }, T.te2 - LEAD);

      // ================= «Tus dudas no se quedan esperando,» — Pendiente → Respondida =================
      S("tus", T.tus); S("dudas", T.dudas); S("no", T.no); S("se", T.se); S("quedan", T.quedan); S("esperando", T.esperando);
      tl.fromTo(q("f27-st-wait"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, T.dudas - LEAD);
      tl.fromTo(q("f27-st-wait"), { opacity: 1, y: 0 }, { opacity: 0, y: -12, duration: 0.16, ease: "power2.in", immediateRender: false }, T.esperando - 0.16);
      tl.fromTo(q("f27-st-ok"), { y: 14 }, { y: 0, duration: 0.36, ease: "power3.out" }, T.esperando - 0.02);
      tl.fromTo(q("f27-st-ok"), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, T.esperando - 0.02);

      // ================= PAGE 3 — «y se quedan guardadas para todos.» =================
      pageOut(["f27-p2a", "f27-p2b", "f27-p2s", "f27-st-ok"], T.se3 - 0.28);
      H("se3", T.se3); H("quedan3", T.quedan3); H("guardadas", T.guardadas);
      // the laptop recedes further (focus pull) as the library takes the stage
      tl.fromTo(q("f27-lapf"), { filter: "brightness(0.78) blur(0px)" }, { filter: "brightness(0.56) blur(3px)", duration: 0.6, ease: "power2.out", immediateRender: false }, T.y3);
      // the answered consulta files itself into the library: it collapses into the first row's slot
      const F0 = T.quedan3 - 0.12, FD = T.guardadas + 0.02 - F0;
      tl.fromTo(q("f27-answ"), { x: 0, y: 0, scale: 1 }, { x: 34, y: -184, scale: 880 / 900, duration: FD, ease: "power3.inOut", immediateRender: false }, F0);
      tl.fromTo(q("f27-ansc"), { clipPath: "inset(0px 0px 0px 0px round 18px)" }, { clipPath: "inset(0px 0px 369px 0px round 18px)", duration: FD, ease: "power3.inOut", immediateRender: false }, F0);
      tl.fromTo(q("f27-r1"), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, F0 + FD - 0.14);
      tl.fromTo(q("f27-answ"), { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power1.in", immediateRender: false }, F0 + FD - 0.06);
      // the rest of the shared library settles in under it
      ["f27-r2", "f27-r3", "f27-r4", "f27-r5"].forEach((id, i) => {
        tl.fromTo(q(id), { y: 26 }, { y: 0, duration: 0.46, ease: "power3.out" }, T.guardadas + 0.04 + i * 0.12);
        tl.fromTo(q(id), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, T.guardadas + 0.04 + i * 0.12);
      });
      tl.fromTo(q("f27-vis"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, T.para - LEAD);

      window.__timelines = window.__timelines || {};
      // voice retime (tools/retime_v4.py): design-time cues → v4 voice cues (earlier takes folded in), piecewise linear. Design untouched.
      ((tl, A) => {
        const f = (t) => {
          if (t <= A[0][0]) return t - A[0][0] + A[0][1];
          for (let i = 1; i < A.length; i++) if (t <= A[i][0]) { const [a0, b0] = A[i - 1], [a1, b1] = A[i]; return b0 + (t - a0) * (b1 - b0) / (a1 - a0); }
          const [a, b] = A[A.length - 1]; return b + (t - a);
        };
        tl.getChildren(false, true, true).forEach((c) => {
          const s = c.startTime(), d = c.duration(), ns = f(s);
          if (d >= 1.0 && !(c.vars && c.vars.repeat)) {
            const nd = Math.max(0.05, f(s + d) - ns);
            if (c instanceof gsap.core.Timeline) c.timeScale((c.timeScale() || 1) * d / nd); else c.duration(nd);
          }
          c.startTime(ns);
        });
      })(tl, [[-0.0, 0.0], [0.12, 0.12], [0.661, 0.674], [0.973, 0.983], [1.056, 1.068], [1.129, 1.143], [1.844, 1.829], [1.935, 1.913], [2.44, 2.392], [2.523, 2.467], [3.009, 2.946], [3.668, 3.604], [4.421, 4.289], [4.503, 4.383], [4.613, 4.496], [5.494, 5.322], [5.677, 5.491], [6.012, 5.778], [6.219, 5.951], [6.356, 6.102], [6.586, 6.336], [7.375, 7.097], [7.448, 7.163], [7.577, 7.285], [7.907, 7.604], [8.411, 8.083], [8.577, 8.261], [9.135, 8.836]]);
      window.__timelines["27-consultas"] = tl;
    })();
  </script>

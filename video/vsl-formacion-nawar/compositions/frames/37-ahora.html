  <script>
    (function () {
      const q = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const D = 4.09;
      const LEAD = 0.04;
      // cue table (frame-relative seconds, from the packet)
      const T = { el: 0.12, algun: 0.29, dia: 0.45, ya: 0.52, lo: 0.64, has: 0.73, probado: 0.83, ahora: 1.43, tension: 1.69, toca: 2.60, hablar: 3.13 };
      const END = D - 0.25; // the final acceleration into the re-drop
      const rise = (el, cue, dy) => tl.fromTo(el, { opacity: 0, y: dy || 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, cue - LEAD);

      // ================= GROUND =================
      tl.fromTo(q("f37-dots"), { scale: 1.08 }, { scale: 1, duration: 0.7, ease: "expo.out" }, 0);

      // ================= SCENE 1 — the sticky note drops in (entrance, 0–0.3 s) =================
      tl.fromTo(q("f37-note"), { y: -860, rotation: -17 }, { y: 0, rotation: -4, duration: 0.32, ease: "power3.out" }, 0);
      rise(q("f37-w-el"), T.el, 44);

      // handwriting: each word is "written" (left→right wipe) on its cue
      const write = (el, t, d) => { tl.fromTo(el, { clipPath: "inset(-20% 100% -30% -5%)" }, { clipPath: "inset(-20% -5% -30% -5%)", duration: d, ease: "power1.inOut" }, t); };
      write(q("f37-h1"), T.algun - 0.03, 0.17);
      write(q("f37-h2"), T.dia - 0.03, 0.22);
      const ul = q("f37-ulineP");
      tl.fromTo(ul, { strokeDasharray: "1 2", strokeDashoffset: 1 }, { strokeDasharray: "1 2", strokeDashoffset: 0, duration: 0.2, ease: "power2.inOut" }, 0.6);

      // lead line «ya lo has probado.»
      rise(q("f37-w-ya"), T.ya);
      rise(q("f37-w-lo"), T.lo);
      rise(q("f37-w-has"), T.has);
      rise(q("f37-w-prob"), T.probado);

      // ---------- the crumple (deterministic polygon morph) ----------
      const W = 600, H = 470, CX = 300, CY = 235;
      const orig = [];
      const side = (x0, y0, x1, y1, n) => { for (let k = 0; k < n; k++) orig.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]); };
      side(0, 0, W, 0, 9); side(W, 0, W, H, 7); side(W, H, 0, H, 9); side(0, H, 0, 0, 7);
      const NP = orig.length;
      const frac = (v) => v - Math.floor(v);
      const tgt = orig.map((p, i) => {
        const a = Math.atan2(p[1] - CY, p[0] - CX);
        const R = 100 * (1 + 0.085 * Math.sin(i * 2.39 + 0.4) + 0.05 * Math.cos(i * 5.3));
        return [CX + Math.cos(a) * R, CY + Math.sin(a) * R * 0.9];
      });
      const delay = orig.map((p, i) => 0.14 * frac(i * 0.618 + 0.13));
      const ioq = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const lerp = (a, b, t) => a + (b - a) * t;
      // creases + facets in the flat note's coordinates; they squeeze toward the centre as it balls up
      const CREASES = [ [[30, 120], [210, 196], [330, 140], [570, 236]], [[80, 440], [250, 300], [310, 334], [530, 80]], [[150, 14], [232, 204], [196, 330], [262, 462]], [[384, 8], [424, 172], [356, 300], [432, 464]], [[8, 300], [184, 262], [424, 382], [594, 350]], [[60, 30], [170, 120], [120, 250]], [[470, 420], [500, 290], [590, 160]] ];
      const FACETS = [ { p: [[0, 0], [210, 196], [150, 14]], f: "rgba(29,0,132,0.10)" }, { p: [[210, 196], [330, 140], [384, 8], [232, 204]], f: "rgba(255,255,255,0.55)" }, { p: [[330, 140], [570, 236], [600, 0]], f: "rgba(29,0,132,0.07)" }, { p: [[250, 300], [310, 334], [356, 300], [424, 382]], f: "rgba(29,0,132,0.13)" }, { p: [[0, 470], [80, 440], [184, 262], [8, 300]], f: "rgba(29,0,132,0.09)" }, { p: [[424, 382], [594, 350], [600, 470], [432, 464]], f: "rgba(29,0,132,0.12)" }, { p: [[196, 330], [262, 462], [80, 440]], f: "rgba(255,255,255,0.5)" } ];
      const NS = "http://www.w3.org/2000/svg";
      const crG = q("f37-creases"), faG = q("f37-facets");
      const crEls = CREASES.map(() => { const e = document.createElementNS(NS, "path"); crG.appendChild(e); return e; });
      const faEls = FACETS.map((f) => { const e = document.createElementNS(NS, "path"); e.setAttribute("fill", f.f); faG.appendChild(e); return e; });
      const body = q("f37-pbody"), clipP = q("f37-pclipP"), hand = q("f37-hand");
      const squeeze = (pts, s, tw) => pts.map((v, k) => {
        const dx = v[0] - CX, dy = v[1] - CY;
        const j = Math.sin(Math.PI * clamp01(s)) * 14 * Math.sin(k * 2.1 + v[0] * 0.01);
        const sc = lerp(1, 0.3, ioq(clamp01(s)));
        const c = Math.cos(tw), sn = Math.sin(tw);
        return [CX + (dx * c - dy * sn) * sc + j, CY + (dx * sn + dy * c) * sc * 0.92 - j * 0.6];
      });
      const pstr = (pts, close) => "M " + pts.map((v) => v[0].toFixed(1) + " " + v[1].toFixed(1)).join(" L ") + (close ? " Z" : "");
      const cr = { p: 0 };
      function renderCrumple() {
        const p = cr.p;
        const pts = orig.map((o, i) => {
          const pi = clamp01((p - delay[i]) / 0.86);
          const e = ioq(pi);
          const a = Math.atan2(o[1] - CY, o[0] - CX);
          const buckle = Math.sin(Math.PI * pi) * 16 * Math.sin(i * 3.3 + 0.7);
          return [lerp(o[0], tgt[i][0], e) - Math.sin(a) * buckle, lerp(o[1], tgt[i][1], e) + Math.cos(a) * buckle];
        });
        const d = pstr(pts, true);
        body.setAttribute("d", d);
        clipP.setAttribute("d", d);
        const tw = p * 0.35;
        CREASES.forEach((c, k) => crEls[k].setAttribute("d", pstr(squeeze(c, p, tw), false)));
        FACETS.forEach((f, k) => faEls[k].setAttribute("d", pstr(squeeze(f.p, p, tw), true)));
        crG.setAttribute("opacity", (clamp01(p * 3.2) * 1).toFixed(3));
        faG.setAttribute("opacity", clamp01(p * 2.2).toFixed(3));
        hand.style.transform = "scale(" + lerp(1, 0.3, ioq(p)).toFixed(4) + ")";
        hand.style.opacity = (1 - clamp01(p * 2.4)).toFixed(3);
      }
      renderCrumple();
      const CRU = T.probado - 0.02;
      tl.fromTo(cr, { p: 0 }, { p: 1, duration: 0.26, ease: "power2.out", onUpdate: renderCrumple }, CRU);
      tl.fromTo(q("f37-crum"), { rotation: 0, scale: 1 }, { rotation: 22, scale: 1.04, duration: 0.26, ease: "power2.out" }, CRU);

      // ---------- the toss: off-frame down-left ----------
      const TOSS = CRU + 0.15;
      tl.fromTo(q("f37-notex"), { x: 0 }, { x: -1200, duration: 0.42, ease: "power1.in" }, TOSS);
      tl.fromTo(q("f37-notey"), { y: 0 }, { y: -90, duration: 0.13, ease: "power2.out" }, TOSS);
      tl.fromTo(q("f37-notey"), { y: -90 }, { y: 760, duration: 0.3, ease: "power2.in", immediateRender: false }, TOSS + 0.13);
      tl.fromTo(q("f37-notey"), { rotation: 0, scale: 1 }, { rotation: -220, scale: 0.8, duration: 0.44, ease: "power1.in", immediateRender: false }, TOSS);

      // scene-1 type clears just before the slam
      tl.fromTo([q("f37-el"), q("f37-lead")], { opacity: 1, y: 0, filter: "blur(0px)" },
        { opacity: 0, y: 26, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, T.ahora - 0.26);

      // ================= SCENE 2 — AHORA slams =================
      const SLAM = T.ahora - 0.03;
      // v3 polish: one confident landing (no flash, rings or shake)
      tl.fromTo(q("f37-ahora"), { opacity: 0, scale: 1.15, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, SLAM);

      // ================= TENSION (bass out at 1.69): held, pushed, charged =================
      const TEN = T.tension;
      // ground: the edges sink, the centre charges with light
      tl.fromTo(q("f37-dark"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, TEN);
      tl.fromTo(q("f37-bright"), { opacity: 0 }, { opacity: 1, duration: D - TEN, ease: "power2.in" }, TEN);
      tl.fromTo(q("f37-glow"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1.35, duration: D - TEN, ease: "power1.in" }, TEN);

      // camera: slow power1.in push 1 → 1.12 until END, then an accelerating rush to 1.4 (velocity-continuous)
      const cam = q("f37-cam");
      // v3 polish: gentler push (1 → 1.08) and a short ease into the cut (+0.08), no blur / bloom
      const P1 = END - TEN, V = 0.16 / P1, A1 = V * 0.25, B1 = 0.08 - A1;
      const camScale = (t) => { if (t <= TEN) return 1; if (t <= END) { const u = (t - TEN) / P1; return 1 + 0.08 * u * u; } const u = Math.min(1, (t - END) / 0.25); return 1.08 + A1 * u + B1 * u * u * u; };
      const ck = { t: TEN };
      tl.fromTo(ck, { t: TEN }, { t: D, duration: D - TEN, ease: "none", immediateRender: false, onUpdate: () => gsap.set(cam, { scale: camScale(ck.t) }) }, TEN);

      // ================= «toca» =================
      rise(q("f37-w-toca"), T.toca, 36);

      // ================= HABLAR. + mic + voice bars =================
      const HB = T.hablar - LEAD;
      tl.fromTo(q("f37-hablar"), { opacity: 0, scale: 1.1, filter: "blur(8px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, HB);
      tl.fromTo(q("f37-mic"), { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out" }, HB + 0.02);
      const bars = Array.from(document.querySelectorAll("#f37-bars .f37-bar"));
      bars.forEach((b, i) => {
        tl.fromTo(b, { opacity: 0, scaleY: 0.1 }, { opacity: 1, scaleY: 0.35 + 0.4 * Math.abs(Math.sin(i * 1.3 + 0.4)), duration: 0.12, ease: "power2.out" }, HB + 0.06 + i * 0.02);
        let t = HB + 0.18 + i * 0.02, k = 0;
        while (t < D - 0.04) {
          const h = 0.2 + 0.8 * Math.abs(Math.sin(1.3 * i + 0.9 * k + 0.5 * Math.sin(k * 1.7)));
          tl.to(b, { scaleY: 0.25 + 0.6 * h, duration: 0.14, ease: "sine.inOut" }, t);
          t += 0.14; k++;
        }
      });

      // ================= THE RUSH (last 0.25 s) — sucked into the re-drop =================
      tl.fromTo(q("f37-dots"), { y: 0 }, { y: 0, scale: 1.08, duration: 0.25, ease: "power2.in", immediateRender: false }, END);

      window.__timelines = window.__timelines || {};
      // voice retime (tools/retime_v4.py): design-time cues → v4 voice cues (earlier takes folded in), piecewise linear. Design untouched.
      ((tl, A) => {
        const f = (t) => {
          if (t <= A[0][0]) return t - A[0][0] + A[0][1];
          for (let i = 1; i < A.length; i++) if (t <= A[i][0]) { const [a0, b0] = A[i - 1], [a1, b1] = A[i]; return b0 + (t - a0) * (b1 - b0) / (a1 - a0); }
          const [a, b] = A[A.length - 1]; return b + (t - a);
        };
        tl.getChildren(false, true, true).forEach((c) => {
          const s = c.startTime(), d = c.duration(), ns = f(s);
          if (d >= 1.0 && !(c.vars && c.vars.repeat)) {
            const nd = Math.max(0.05, f(s + d) - ns);
            if (c instanceof gsap.core.Timeline) c.timeScale((c.timeScale() || 1) * d / nd); else c.duration(nd);
          }

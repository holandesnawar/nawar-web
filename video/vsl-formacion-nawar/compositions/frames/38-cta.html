    (function () {
      const q = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const D = 8.4;

      // ---------------- deterministic spark burst around the button ----------------
      const sparks = q("f38-sparks");
      const N = 14;
      const streaks = [];
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2 + 0.2;
        const rx = 610, ry = 120;
        const cx = 960 + Math.cos(a) * rx;
        const cy = 475 + Math.sin(a) * ry;
        const s = document.createElement("div");
        s.className = "f38-spark";
        s.style.left = cx.toFixed(1) + "px";
        s.style.top = cy.toFixed(1) + "px";
        const nx = Math.cos(a) / rx, ny = Math.sin(a) / ry;
        s.style.transform = "rotate(" + (Math.atan2(ny, nx) * 180 / Math.PI).toFixed(2) + "deg)";
        const k = document.createElement("div");
        k.className = "f38-streak";
        k.style.width = [130, 90, 160, 104][i % 4] + "px";
        s.appendChild(k);
        sparks.appendChild(s);
        streaks.push(k);
      }

      // =====================================================================
      // Scene 1 (0.00–2.00) — RE-DROP: flash + CTA button slam + shockwave; cursor clicks on "siguiente paso"
      // =====================================================================
      tl.fromTo(q("f38-flash"), { opacity: 0.5 }, { opacity: 0, duration: 0.2, ease: "power1.out" }, 0);

      tl.fromTo(q("f38-btnunit"), { scale: 1.6, opacity: 0, filter: "blur(16px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0);
      tl.fromTo(q("f38-shock"), { scale: 1, opacity: 0.95 }, { scale: 1.45, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.08);
      tl.fromTo(q("f38-glow"), { opacity: 0.4, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(q("f38-rays"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 0);
      tl.fromTo(q("f38-rays"), { rotation: -4 }, { rotation: 6, duration: D, ease: "none" }, 0);
      streaks.forEach((k, i) => {
        const at = 0.06 + (i % 3) * 0.014;
        tl.fromTo(k, { x: -30, opacity: 0, scaleX: 0.25 },
          { x: 40, opacity: 1, scaleX: 1, duration: 0.1, ease: "power2.out" }, at);
        tl.to(k, { x: 220 + (i % 4) * 26, opacity: 0, scaleX: 0.35, duration: 0.38, ease: "power2.out" }, at + 0.1);
      });

      // button text builds: Completa (with the slam) · tu 0.44 · matrícula 0.57
      tl.fromTo(q("f38-bw2"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, 0.41);
      tl.fromTo(q("f38-bw3"), { opacity: 0, y: 26, scale: 1.14 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "power3.out" }, 0.54);
      tl.fromTo(q("f38-btn-glint"), { x: -300 }, { x: 1300, duration: 0.62, ease: "power2.inOut" }, 0.72);

      // lead: "en el" 0.97 · siguiente 1.18 · paso 1.57
      const rise = (el, at) => tl.fromTo(el, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, at);
      rise(q("f38-lw1"), 0.94);
      rise(q("f38-lw2"), 1.15);
      rise(q("f38-lw3"), 1.54);

      // cursor glides in and CLICKS on "siguiente paso" (1.30)
      const cur = q("f38-cursor");
      tl.fromTo(cur, { x: 430, y: 380, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.62, ease: "power3.out" }, 0.62);
      tl.fromTo(cur, { scale: 1 }, { scale: 0.8, duration: 0.06, ease: "power2.out" }, 1.26);
      tl.fromTo(cur, { scale: 0.8 }, { scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, 1.32);
      const unit = q("f38-btnunit");

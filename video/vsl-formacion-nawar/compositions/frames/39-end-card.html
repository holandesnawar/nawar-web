      <div id="f39-rays"></div>
      <div id="f39-glow"></div>
      <div id="f39-core"></div>
      <div id="f39-flash"></div>

        <div id="f39-shine-mask">

  <script>
    (function () {
      const q = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const D = 7.2;
      const HIT = 3.6; // the song's FINAL HIT

      // ---------------- deterministic spark burst around the logo ----------------
      const sparks = q("f39-sparks");
      const N = 12;
      const streaks = [];
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2 + 0.26;
        const rx = 450, ry = 175;
        const cx = 960 + Math.cos(a) * rx;
        const cy = 254 + Math.sin(a) * ry;
        const s = document.createElement("div");
        s.className = "f39-spark";
        s.style.left = cx.toFixed(1) + "px";
        s.style.top = cy.toFixed(1) + "px";
        const nx = Math.cos(a) / rx, ny = Math.sin(a) / ry;
        s.style.transform = "rotate(" + (Math.atan2(ny, nx) * 180 / Math.PI).toFixed(2) + "deg)";
        const k = document.createElement("div");
        k.className = "f39-streak";
        k.style.width = [120, 84, 150, 100][i % 4] + "px";
        s.appendChild(k);
        sparks.appendChild(s);
        streaks.push(k);
      }

      // ---------------- Scene 1 (0.0–1.4) — logo bloom + light sweep on "Formación" (0.12) ----------------
      const B = 0.06;
      const wrap = q("f39-logo-wrap");
      tl.fromTo(wrap, { scale: 0.6 }, { scale: 1.045, duration: 0.3, ease: "power3.out" }, B);
      tl.to(wrap, { scale: 1, duration: 0.34, ease: "power2.inOut" }, B + 0.3);
      tl.fromTo(wrap, { opacity: 0.6 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, B);
      tl.fromTo(q("f39-logo"), { filter: "blur(18px)" }, { filter: "blur(0px)", duration: 0.28, ease: "power2.out" }, B);

      tl.fromTo(q("f39-glow"), { opacity: 0.45, scale: 0.45 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, B);
      tl.fromTo(q("f39-core"), { opacity: 1, scale: 0.7 }, { opacity: 0.5, scale: 1.1, duration: 0.5, ease: "power2.out" }, B);
      tl.fromTo(q("f39-rays"), { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, B);
      tl.fromTo(q("f39-rays"), { rotation: -4 }, { rotation: 8, duration: D, ease: "none" }, 0);

      tl.fromTo(q("f39-flash"), { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: 1.15, duration: 0.42, ease: "power2.out" }, B);
      tl.fromTo(q("f39-shock"), { scale: 0.55, opacity: 0.9 }, { scale: 1.7, opacity: 0, duration: 0.6, ease: "power2.out" }, B);

      streaks.forEach((k, i) => {
        const at = B + 0.05 + (i % 3) * 0.014;
        tl.fromTo(k, { x: -30, opacity: 0, scaleX: 0.25 },
          { x: 40, opacity: 1, scaleX: 1, duration: 0.1, ease: "power2.out" }, at);
        tl.to(k, { x: 200 + (i % 4) * 24, opacity: 0, scaleX: 0.35, duration: 0.36, ease: "power2.out" }, at + 0.1);
      });

      // entrance light sweep: masked shine across the wordmark + a soft full-frame band riding with it
      tl.fromTo(q("f39-shine1"), { x: -380 }, { x: 900, duration: 0.6, ease: "power2.inOut" }, B + 0.16);
      tl.fromTo(q("f39-band1"), { x: -2300 }, { x: 2300, duration: 0.95, ease: "power1.inOut" }, B + 0.02);
      tl.fromTo(q("f39-band1"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, B + 0.02);
      tl.to(q("f39-band1"), { opacity: 0, duration: 0.25, ease: "power1.in" }, B + 0.72);

      // "Nawar." (0.74): FORMACIÓN NAWAR under the logo
      tl.fromTo(q("f39-label"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 0.71);

      // ---------------- Scene 2 (1.4–3.6) — the claim builds word by word on the voice ----------------
      const rise = (el, at) =>
        tl.fromTo(el, { opacity: 0, y: 44, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, at);
      const slam = (el, at) =>
        tl.fromTo(el, { opacity: 0, scale: 1.28, filter: "blur(10px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, at);
      rise(q("f39-w1"), 1.51);   // Tu 1.54
      rise(q("f39-w2"), 1.62);   // neerlandés 1.65
      rise(q("f39-w3"), 2.13);   // empieza 2.16
      slam(q("f39-w4"), 2.61);   // cuando 2.64
      slam(q("f39-w5"), 2.96);   // lo 2.99
      slam(q("f39-w6"), 3.07);   // hablas. 3.10

      // ---------------- Scene 3 (3.6–7.2) — FINAL HIT: light sweep + pulse ring; URL pill; social line ----------------
      tl.fromTo(wrap, { scale: 1 }, { scale: 1.05, duration: 0.1, ease: "power2.out", immediateRender: false }, HIT);
      tl.fromTo(wrap, { scale: 1.05 }, { scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, HIT + 0.1);
      tl.fromTo(q("f39-pulse"), { scale: 0.8, opacity: 0.85 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, HIT);
      tl.fromTo(q("f39-core"), { opacity: 0.5, scale: 1.1 }, { opacity: 1, scale: 1.25, duration: 0.12, ease: "power2.out", immediateRender: false }, HIT);
      tl.fromTo(q("f39-core"), { opacity: 1, scale: 1.25 }, { opacity: 0.5, scale: 1.1, duration: 0.7, ease: "power2.out", immediateRender: false }, HIT + 0.12);
      tl.fromTo(q("f39-flash"), { opacity: 0, scale: 0.8 }, { opacity: 0.45, scale: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, HIT);
      tl.fromTo(q("f39-flash"), { opacity: 0.45, scale: 1 }, { opacity: 0, scale: 1.15, duration: 0.5, ease: "power2.out", immediateRender: false }, HIT + 0.1);
      tl.fromTo(q("f39-shine2"), { x: -380 }, { x: 900, duration: 0.62, ease: "power2.inOut" }, HIT);
      tl.fromTo(q("f39-band2"), { x: -2300 }, { x: 2300, duration: 1.0, ease: "power1.inOut" }, HIT - 0.12);
      tl.fromTo(q("f39-band2"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, HIT - 0.12);
      tl.to(q("f39-band2"), { opacity: 0, duration: 0.25, ease: "power1.in" }, HIT + 0.62);

      // URL pill rises at 3.7
      tl.fromTo(q("f39-pill-wrap"), { opacity: 0, y: 70, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 3.7);
      tl.fromTo(q("f39-globe-disc"), { rotation: -90, scale: 0.4 },
        { rotation: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 3.78);
      tl.fromTo(q("f39-pill-glint"), { x: -220 }, { x: 760, duration: 0.6, ease: "power2.inOut" }, 4.15);

      // +30.000 line at 4.0 (count-up, deterministic)
      tl.fromTo(q("f39-social"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 4.0);
      const numEl = q("f39-num");
      const fmt = (n) => "+" + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      const ctr = { v: 0 };
      tl.fromTo(ctr, { v: 0 }, {
        v: 30000, duration: 0.9, ease: "power3.out",
        onUpdate: () => { numEl.textContent = fmt(Math.round(ctr.v)); },
      }, 4.0);

      // macro camera: one quiet monotonic push under the whole card (no breathing)
      tl.fromTo(q("f39-stage"), { scale: 1 }, { scale: 1.022, duration: D - 0.6, ease: "power1.inOut" }, 0.6);

      // the only exit of the film: everything fades to night (6.3 -> 7.2)
      tl.fromTo(q("f39-night"), { opacity: 0 }, { opacity: 1, duration: 0.86, ease: "power1.inOut" }, 6.3);

      tl.set({}, {}, D);
      window.__timelines = window.__timelines || {};
      window.__timelines["39-end-card"] = tl;
    })();
  </script>

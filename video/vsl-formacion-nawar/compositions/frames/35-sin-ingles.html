  <div id="root" data-composition-id="35-sin-ingles" data-width="1920" data-height="1080" data-duration="3.229">

        <svg viewBox="0 0 104 104" aria-hidden="true">

      <!-- NL / EN toggle -->
      <div id="f35-tpos">
        <div id="f35-toggle">
          <div id="f35-track"></div>
          <div id="f35-en"><span id="f35-uk"><svg viewBox="0 0 40 27" aria-hidden="true"><rect width="40" height="27" fill="#21468C" /><path d="M0 0 L40 27 M40 0 L0 27" stroke="#FFFFFF" stroke-width="6" /><path d="M0 0 L40 27 M40 0 L0 27" stroke="#AE1C27" stroke-width="2.2" /><path d="M20 0 V27 M0 13.5 H40" stroke="#FFFFFF" stroke-width="9" /><path d="M20 0 V27 M0 13.5 H40" stroke="#AE1C27" stroke-width="5" /></svg></span><span id="f35-en-t">EN</span></div>
          <div id="f35-knob">
            <div class="f35-stripe" style="top:0; height:47px; background:#AE1C27;"></div>

            <div id="f35-knob-t">NL</div>

            </svg>
          </div>
        </div>

      <!-- headline -->
      <div id="f35-head"><span class="f35-hw" id="f35-h1">No</span><span class="f35-hw" id="f35-h2">le</span><span class="f35-hw" id="f35-h3">va</span><span class="f35-hw" id="f35-h4">a</span><span class="f35-hw" id="f35-h5">hacer</span><span class="f35-hw" id="f35-h6">falta.</span></div>

  <script>
    (function () {
      var $ = function (id) { return document.getElementById("f35-" + id); };
      var tl = gsap.timeline({ paused: true });
      var D = 3.44;
      var T = { otro: 0.61, vaya: 0.76, cambiar: 1.04, ingles: 1.46, no: 2.24, le: 2.44, va: 2.55, a: 2.64, hacer: 2.64, falta: 2.83 };
      var FR = 1 / 30;
      var HALF = 180; // knob stalls halfway (full travel 360)

      // ================= ENTRANCE: the toggle slides up into the centre =================
      tl.fromTo($("toggle"), { y: 280, scale: 0.92, opacity: 0, filter: "blur(10px)" },
        { y: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo($("world"), { scale: 1.03 }, { scale: 1, duration: 1.2, ease: "power2.out" }, 0);
      tl.fromTo($("glow"), { opacity: 0.4 }, { opacity: 0.75, duration: 1.0, ease: "power2.out" }, 0.1);
      tl.set($("lock"), { scale: 0.4, opacity: 0 }, 0);
      tl.set($("txt"), { textContent: "" }, 0);
      tl.set($("dots"), { display: "flex" }, 0);

      // ================= SCENE 1: the other one tries English =================
      // "el otro": the other person pops in (same avatar as v1 frame 06)
      tl.fromTo($("av"), { scale: 0.5, x: -40, opacity: 0 }, { scale: 1, x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, T.otro - 0.04);
      // "vaya": typing bubble
      tl.fromTo($("bub"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "power3.out" }, T.vaya - 0.04);
      var dots = $("dots").querySelectorAll(".f35-dot");
      tl.set(dots, { y: 0, opacity: 0.5 }, 0);
      for (var d = 0; d < 3; d++) {
        var t0 = T.vaya + 0.08 + d * 0.06;
        tl.fromTo(dots[d], { y: 0, opacity: 0.5 }, { y: -9, opacity: 1, duration: 0.09, ease: "power1.out", immediateRender: false }, t0);
        tl.fromTo(dots[d], { y: -9, opacity: 1 }, { y: 0, opacity: 0.5, duration: 0.09, ease: "power1.in", immediateRender: false }, t0 + 0.09);
      }
      // "cambiar": the English starts typing…
      var EN = "Oh, shall we speak Eng—";
      tl.set($("dots"), { display: "none" }, T.cambiar - 0.02);
      var times = [];
      for (var i = 0; i < 19; i++) times.push(T.cambiar - 0.02 + i * 0.022);   // "Oh, shall we speak "
      times.push(T.ingles - 0.02, T.ingles + 0.05, T.ingles + 0.12);           // "Eng"
      times.push(1.72);                                                         // "—" cut off
      for (var c = 0; c < EN.length; c++) tl.set($("txt"), { textContent: EN.slice(0, c + 1) }, times[c]);

      // …and the knob slides toward EN
      tl.fromTo($("knob"), { x: 0 }, { x: HALF, duration: T.ingles - T.cambiar, ease: "power1.inOut" }, T.cambiar);
      // "inglés": EN lights up as the knob reaches it…
      tl.fromTo($("en"), { color: "#5A6480", scale: 1 }, { color: "#1D0084", scale: 1.05, duration: 0.24, ease: "power3.out" }, T.ingles - 0.06);
      tl.fromTo($("uk"), { filter: "grayscale(1)", opacity: 0.45 }, { filter: "grayscale(0)", opacity: 1, duration: 0.24, ease: "power2.out" }, T.ingles - 0.06);
      // …but it stalls halfway (a quiet hold, no strain jitter)
      tl.fromTo($("knob"), { x: HALF }, { x: HALF - 4, duration: 0.3, ease: "power2.out", immediateRender: false }, T.ingles);

      // ================= SCENE 2: no le va a hacer falta =================
      var SNAP = T.no - 0.06, HIT = SNAP + 0.13;
      tl.fromTo($("knob"), { x: HALF - 4 }, { x: 0, duration: HIT - SNAP + 0.06, ease: "power3.inOut", immediateRender: false }, SNAP);
      // the knob lands firmly back on NL (no squash, no overshoot, no shock ring)
      tl.fromTo($("en"), { color: "#1D0084", scale: 1.05, opacity: 1 }, { color: "#5A6480", scale: 1, opacity: 0.55, duration: 0.25, ease: "power2.out", immediateRender: false }, HIT);
      tl.fromTo($("uk"), { filter: "grayscale(0)" }, { filter: "grayscale(1)", duration: 0.25, ease: "power2.out", immediateRender: false }, HIT);

      // the bubble deletes itself back to "O"… and rewrites in Dutch
      var NL = "Oké, gewoon in het Nederlands!";
      var del = EN.length - 1;   // keep the shared "O"
      for (var k = 1; k <= del; k++) tl.set($("txt"), { textContent: EN.slice(0, EN.length - k) }, T.no - 0.02 + k * 0.009);
      var T2 = 2.47;
      for (var n = 2; n <= NL.length; n++) tl.set($("txt"), { textContent: NL.slice(0, n) }, T2 + (n - 2) * 0.0155);

      // headline builds word by word on the voice
      function rise(id, t) {
        tl.fromTo($(id), { y: 46, opacity: 0, filter: "blur(8px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, t - 0.04);
      }
      rise("h1", T.no);
      rise("h2", T.le);
      rise("h3", T.va);
      rise("h4", T.a);
      rise("h5", T.hacer + 0.02);
      tl.fromTo($("h6"), { y: 46, opacity: 0, filter: "blur(8px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, T.falta - 0.04);

      // "falta.": the padlock locks NL in
      tl.fromTo($("lock"), { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, T.falta - 0.06);
      tl.fromTo($("shackle"), { y: -9 }, { y: 0, duration: 0.12, ease: "power3.in" }, T.falta + 0.1);

      tl.set({}, {}, D);
      window.__timelines = window.__timelines || {};
      // v3 retime (tools/retime_stack.py): previous voice cues → v3 voice cues, piecewise linear. Design untouched.
      ((tl, A) => {
        const f = (t) => {
          if (t <= A[0][0]) return t - A[0][0] + A[0][1];
          for (let i = 1; i < A.length; i++) if (t <= A[i][0]) { const [a0, b0] = A[i - 1], [a1, b1] = A[i]; return b0 + (t - a0) * (b1 - b0) / (a1 - a0); }
          const [a, b] = A[A.length - 1]; return b + (t - a);
        };
        tl.getChildren(false, true, true).forEach((c) => {
          const s = c.startTime(), d = c.duration(), ns = f(s);
          if (d >= 1.0 && !(c.vars && c.vars.repeat)) {
            const nd = Math.max(0.05, f(s + d) - ns);
            if (c instanceof gsap.core.Timeline) c.timeScale((c.timeScale() || 1) * d / nd); else c.duration(nd);
          }
          c.startTime(ns);
        });
      })(tl, [[0.0, 0.0], [0.12, 0.12], [0.21, 0.193], [0.51, 0.478], [0.61, 0.56], [0.76, 0.781], [0.98, 0.982], [1.04, 1.028], [1.36, 1.313], [1.46, 1.395], [2.24, 2.065], [2.44, 2.239], [2.55, 2.368], [2.64, 2.487], [2.83, 2.671], [3.44, 3.229]]);
      window.__timelines["35-sin-ingles"] = tl;
    })();
  </script>

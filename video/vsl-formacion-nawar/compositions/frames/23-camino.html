  <script>
    (function () {
      gsap.registerPlugin(MotionPathPlugin);
      const $ = (id) => document.getElementById("f23-" + id);

      // ---------- build nodes, companions, streaks (deterministic markup) ----------
      const NODES = [[300, 760], [640, 520], [980, 720], [1320, 470], [1640, 660]];
      const SH_CLOSED = "M 11 -6 V -15 A 11 11 0 0 0 -11 -15 V -6";
      const SH_OPEN = "M 11 -6 V -22 A 11 11 0 0 0 -11 -22 V -17";
      let h = "";
      NODES.forEach(([cx, cy], i) => {
        const k = i + 1;
        h += '<div class="f23-node" id="f23-n' + k + '" style="left:' + (cx - 52) + 'px; top:' + (cy - 52) + 'px;">' +
          '<div class="f23-disc f23-d-lock"></div>' +
          '<div class="f23-disc f23-d-open" id="f23-op' + k + '"></div><div class="f23-disc f23-d-done" id="f23-dn' + k + '"></div>' +
          '<svg class="f23-ic f23-lockic" id="f23-lk' + k + '" viewBox="-52 -52 104 104"><g transform="translate(0 5)">' +
          '<path id="f23-sh' + k + '" d="' + SH_CLOSED + '" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"></path>' +
          '<rect x="-17" y="-6" width="34" height="28" rx="6" fill="#FFFFFF"></rect>' +
          '<circle id="f23-kh' + k + '" cx="0" cy="6" r="4" fill="#4da3ff" opacity="0"></circle></g></svg>' +
          '<svg class="f23-ic f23-ckic" id="f23-ck' + k + '" viewBox="-52 -52 104 104"><path id="f23-ckp' + k + '" d="M -17 1 L -6 12 L 17 -12" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="50" stroke-dashoffset="50"></path></svg></div>';
      });
      $("nodes").innerHTML = h;
      // companions: [initials, fill, left, top, pop time, advance dx, dy]  (positions from v1 21, centred on node 3)
      const C = [
        ["JL", "sky",   1042.5, 632,   4.74,  27.0, -27.2],
        ["MA", "vivid", 815.4,  623.5, 4.815, 27.0,  22.6],
        ["AN", "ind",   1096,   559.8, 4.89,  24.0, -29.9],
        ["SO", "white", 773.4,  541.1, 4.965, 27.4,  27.2],
        ["PE", "light", 1139.3, 482.6, 5.04,  26.2, -27.2],
        ["LU", "nl",    705.5,  481.4, 5.115, 34.7,  25.0]
      ];
      h = "";
      C.forEach(([n, f, x, y]) => {
        h += '<div class="f23-c" id="f23-c-' + n + '" style="left:' + x + 'px; top:' + y + 'px">' +
          '<div class="f23-pop" id="f23-pop-' + n + '"><div class="f23-av f23-av-' + f + '"><span>' + n + '</span></div></div></div>';
      });
      $("comps").innerHTML = h;

      // ---------- path lengths (bezier LUT scaled to the browser's own length) ----------
      const SEGS = [
        [120, 840, 210, 830, 250, 790, 300, 760], [300, 760, 420, 690, 500, 520, 640, 520],
        [640, 520, 780, 520, 840, 720, 980, 720], [980, 720, 1120, 720, 1180, 470, 1320, 470],
        [1320, 470, 1460, 470, 1540, 660, 1640, 660], [1640, 660, 1720, 660, 1760, 620, 1820, 600]
      ];
      function bez(s, t) { const u = 1 - t; return [u*u*u*s[0] + 3*u*u*t*s[2] + 3*u*t*t*s[4] + t*t*t*s[6], u*u*u*s[1] + 3*u*u*t*s[3] + 3*u*t*t*s[5] + t*t*t*s[7]]; }
      function segLen(s) { let len = 0, p = bez(s, 0); for (let i = 1; i <= 600; i++) { const q = bez(s, i / 600); len += Math.hypot(q[0] - p[0], q[1] - p[1]); p = q; } return len; }
      const SL = SEGS.map(segLen);
      let Llut = 0; SL.forEach((v) => { Llut += v; });
      let L = Llut;
      try { const b = $("road").getTotalLength(); if (b > 100) L = b; } catch (e) {}
      const kk = L / Llut;
      const lenN = []; let acc = 0;
      for (let i = 0; i < 5; i++) { acc += SL[i]; lenN.push(acc * kk); }
      ["road", "prog", "pulse"].forEach((id) => { $(id).style.strokeDasharray = L + " " + (2 * L); });
      $("pulse").style.strokeDasharray = "240 " + (3 * L);

      const tl = gsap.timeline({ paused: true });

      // ================= ENTRANCE (0.00–0.30): camera slides in from the right under a light motion blur =================
      const mb = { v: 12 };
      const mbg = $("mblur-g");
      tl.fromTo(mb, { v: 12 }, { v: 0, duration: 0.3, ease: "expo.out", onUpdate: function () { mbg.setAttribute("stdDeviation", mb.v.toFixed(2) + " 0"); } }, 0);
      tl.set("#f23-cam", { filter: "none" }, 0.31);
      tl.fromTo("#f23-cam", { x: 240 }, { x: 0, duration: 0.3, ease: "expo.out" }, 0);
      tl.fromTo("#f23-pill", { x: 120, opacity: 0.4 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, 0);
      // the road draws in from the left; each node appears as the line reaches it
      const DRAW = 0.5;
      tl.fromTo("#f23-road", { strokeDashoffset: L }, { strokeDashoffset: 0, duration: DRAW, ease: "power2.out" }, 0);
      tl.set("#f23-prog", { strokeDashoffset: L + 20 }, 0);
      lenN.forEach((len, i) => {
        const T = DRAW * (1 - Math.sqrt(1 - len / L));   // power2.out inverse
        const k = i + 1;
        tl.fromTo("#f23-n" + k, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" }, T);
        tl.fromTo("#f23-lb" + k, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, T + 0.06);
      });
      // node 1 is the open module at the start
      tl.fromTo("#f23-op1", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#f23-sh1", { attr: { d: SH_OPEN } }, { attr: { d: SH_OPEN }, duration: 0.01 }, 0);
      tl.fromTo("#f23-kh1", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#f23-lk1", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);

      // ================= "Cada · módulo" — lead =================
      [["#f23-w-cada", 0.12], ["#f23-w-modulo", 0.29]].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0, y: 34, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.26, ease: "power3.out" }, t);
      });
      // ================= "se · desbloquea" — key line + inline padlock =================
      tl.fromTo("#f23-w-se", { opacity: 0, y: 44, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, 0.65);
      tl.fromTo("#f23-w-desb", { opacity: 0, scale: 1.08, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0.78);
      tl.fromTo("#f23-klock", { opacity: 0, scale: 1.1, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0.84);
      tl.fromTo("#f23-ksh", { attr: { d: "M 14 -6 V -17 A 14 14 0 0 0 -14 -17 V -6" } },
        { attr: { d: "M 14 -6 V -27 A 14 14 0 0 0 -14 -27 V -20" }, duration: 0.24, ease: "expo.out" }, 1.06);
      tl.fromTo("#f23-ksh", { stroke: "#FFFFFF" }, { stroke: "#4da3ff", duration: 0.2, ease: "power2.out", immediateRender: false }, 1.06);
      tl.fromTo("#f23-kbody", { fill: "#FFFFFF" }, { fill: "#4da3ff", duration: 0.2, ease: "power2.out" }, 1.06);

      // ================= "cuando terminas" — progress reaches node 1, node 1 completed =================
      function complete(k, T) {
        tl.fromTo("#f23-dn" + k, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, T);
        tl.to("#f23-lk" + k, { opacity: 0, scale: 0.7, duration: 0.14, ease: "power2.in" }, T);
        tl.fromTo("#f23-ck" + k, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, T + 0.03);
        tl.fromTo("#f23-ckp" + k, { strokeDashoffset: 50 }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, T + 0.06);
        tl.to("#f23-n" + k, { scale: 1.05, duration: 0.08, ease: "power2.out" }, T);
        tl.to("#f23-n" + k, { scale: 1, duration: 0.32, ease: "power3.out" }, T + 0.08);
      }
      function unlock(k, T) {
        tl.fromTo("#f23-sh" + k, { attr: { d: SH_CLOSED } }, { attr: { d: SH_OPEN }, duration: 0.24, ease: "expo.out" }, T - 0.04);
        tl.fromTo("#f23-kh" + k, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, T);
        tl.to("#f23-lk" + k, { opacity: 1, duration: 0.14, ease: "power2.out" }, T - 0.04);
        tl.fromTo("#f23-op" + k, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" }, T - 0.04);
        tl.to("#f23-n" + k, { scale: 1.05, duration: 0.08, ease: "power2.out" }, T - 0.04);
        tl.to("#f23-n" + k, { scale: 1, duration: 0.32, ease: "power3.out" }, T + 0.04);
      }
      tl.to("#f23-prog", { strokeDashoffset: L - lenN[0], duration: 0.26, ease: "power2.in" }, 1.29);
      complete(1, 1.55);

      // ================= "el anterior," — progress runs node 1 → node 2, lock 2 opens =================
      tl.to("#f23-prog", { strokeDashoffset: L - lenN[1], duration: 0.33, ease: "power2.in" }, 1.72);
      unlock(2, 2.05);

      // ================= "así que" — TÚ drops onto node 2 =================
      const DROP = 2.93;
      tl.fromTo("#f23-tu-drop", { scale: 1.3, filter: "blur(6px)" }, { scale: 1, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, DROP);
      tl.fromTo("#f23-tu-drop", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none", immediateRender: false }, DROP + 0.02);

      // ================= "avanzas a tu ritmo," — TÚ travels node 2 → node 3, arriving on "ritmo" =================
      const TA = 3.15, TD = 0.68, TE = "power1.inOut";
      tl.to("#f23-tu-pos", { motionPath: { path: "M 0 0 C 140 0 200 200 340 200" }, duration: TD, ease: TE }, TA);
      tl.to("#f23-prog", { strokeDashoffset: L - lenN[2], duration: TD, ease: TE }, TA);
      complete(2, 3.28);     // node 2 done as TÚ leaves it
      unlock(3, 3.44);       // ... which opens node 3 ahead of TÚ

      // kinetic-type-swap: masked slots roll up to the next phrase
      function rollOut(sel, dist, T) {
        tl.to(sel, { opacity: 0, duration: 0.1, ease: "power1.in" }, T);
        tl.to(sel, { y: -dist, filter: "blur(8px)", duration: 0.12, ease: "power2.in" }, T);

  <script>
    (function () {
      const q = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const D = 3.288;
      // one shared word-entrance (each word lands on its VO cue, ≤ 40 ms early)
      const wordIn = (el, t) => tl.fromTo(el, { opacity: 0, y: 44, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, t - 0.04);

      // ================= GROUND =================
      tl.fromTo(q("f17-dots"), { scale: 1.05 }, { scale: 1, duration: 0.7, ease: "expo.out" }, 0);

      // ================= SCENE 1 — ENTRANCE: the target settles in (0.00–0.42) =================
      tl.fromTo(q("f17-tgt"), { rotation: 0, scale: 0.88, filter: "blur(8px)" },
        { rotation: 0, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, 0);
      tl.fromTo(q("f17-tgt"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 0);

      // lead-in words
      [["f17-w-todo", 0.12], ["f17-w-con", 0.352], ["f17-w-un", 0.454]].forEach(([id, t]) => wordIn(q(id), t));

      // the dart flies in along its own axis (30deg) and lands in the bullseye on "objetivo"
      const HIT = 0.574;
      const dart = q("f17-dart");
      const A = 30 * Math.PI / 180, BACK = 950;
      tl.fromTo(dart, { x: -Math.cos(A) * BACK, y: -Math.sin(A) * BACK, rotation: 30 },
        { x: 0, y: 0, rotation: 30, duration: 0.2, ease: "power1.in" }, HIT - 0.2);
      // the board takes the hit: a small, physical give
      const tin = q("f17-tgt-in");
      tl.fromTo(tin, { scale: 1, x: 0, y: 0 }, { scale: 0.985, x: 4, y: 2, duration: 0.05, ease: "power2.out" }, HIT);
      tl.to(tin, { scale: 1, x: 0, y: 0, duration: 0.4, ease: "power3.out" }, HIT + 0.05);

      // OBJETIVO lands on its cue
      tl.fromTo(q("f17-obj"), { opacity: 0, scale: 1.1, filter: "blur(6px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, HIT - 0.03);

      // hold: slow push-in on the target
      tl.fromTo(q("f17-s1cam"), { scale: 1 }, { scale: 1.02, duration: 0.8, ease: "power1.inOut" }, 0.6);

      // ================= SEAM (1.36–1.98): scene 1 whips up, the head rises in the same direction =================
      const s1 = q("f17-s1");
      const vb1 = q("f17-vb1n"), vb2 = q("f17-vb2n");
      const b1 = { v: 0 }, b2 = { v: 20 };
      function w1() { vb1.setAttribute("stdDeviation", "0 " + b1.v.toFixed(2)); }
      function w2() { vb2.setAttribute("stdDeviation", "0 " + b2.v.toFixed(2)); }
      w1(); w2();
      tl.set(s1, { filter: "none" }, 0);
      tl.set(s1, { filter: "url(#f17-vb1)" }, 1.36);
      tl.fromTo(s1, { y: 0 }, { y: -1100, duration: 0.2, ease: "power2.in" }, 1.36);
      tl.fromTo(b1, { v: 0 }, { v: 22, duration: 0.2, ease: "power2.in", onUpdate: w1, immediateRender: false }, 1.36);
      tl.fromTo(s1, { opacity: 1 }, { opacity: 0, duration: 0.02, ease: "none" }, 1.56);
      tl.fromTo(q("f17-dots"), { y: 0 }, { y: -150, duration: 0.6, ease: "power3.inOut" }, 1.34);

      const rise = q("f17-s2rise");
      tl.set(rise, { filter: "none" }, 0);
      tl.set(rise, { filter: "url(#f17-vb2)" }, 1.44);
      tl.fromTo(rise, { y: 1000 }, { y: 0, duration: 0.55, ease: "expo.out" }, 1.44);
      tl.fromTo(b2, { v: 20 }, { v: 0, duration: 0.55, ease: "expo.out", onUpdate: w2, immediateRender: false }, 1.44);
      tl.set(rise, { filter: "none" }, 2.0);

      // head outline draws while it rises; fill blooms in
      const hl = q("f17-head-line");
      const HL = hl.getTotalLength();
      hl.style.strokeDasharray = HL + " " + HL;
      tl.fromTo(hl, { strokeDashoffset: HL }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 1.44);
      tl.fromTo(q("f17-head-fill"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, 1.48);

      // ================= SCENE 2 — the ES⇄NL loop spins while the line builds =================
      tl.fromTo(q("f17-loop"), { opacity: 0, scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" }, 1.52);
      const BREAK = 2.12;
      tl.fromTo(q("f17-spin"), { rotation: 0 }, { rotation: 360, duration: BREAK - 1.5, ease: "power1.inOut" }, 1.5);

      [["f17-w-que", 1.565], ["f17-w-dejes", 1.704], ["f17-w-de", 2.028]].forEach(([id, t]) => wordIn(q(id), t));

      // ================= BREAK on "traducir" (2.12) =================
      tl.fromTo(q("f17-trad"), { opacity: 0, scale: 1.1, filter: "blur(6px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, BREAK - 0.03);

      // the two arcs fly apart (local coords — the spinner sits at 180deg, so these read down-left / up-right)
      tl.fromTo(q("f17-arcA"), { x: 0, y: 0, rotation: 0, filter: "blur(0px)" },
        { x: 90, y: -160, rotation: 40, filter: "blur(3px)", duration: 0.4, ease: "power3.out" }, BREAK);
      tl.fromTo(q("f17-arcB"), { x: 0, y: 0, rotation: 0, filter: "blur(0px)" },
        { x: -90, y: 160, rotation: 40, filter: "blur(3px)", duration: 0.4, ease: "power3.out" }, BREAK);
      tl.fromTo([q("f17-arcA"), q("f17-arcB")], { opacity: 1 }, { opacity: 0, duration: 0.34, ease: "power2.in" }, BREAK + 0.02);

      // ES is thrown out, NL takes the centre of the head
      tl.fromTo(q("f17-es-in"), { x: 0, scale: 1, opacity: 1, filter: "blur(0px)" },
        { x: -80, scale: 0.4, opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power3.out" }, BREAK);
      tl.fromTo(q("f17-nl"), { x: 0, scale: 1 }, { x: -63, scale: 1.45, duration: 0.38, ease: "power3.out" }, BREAK + 0.02);

      // red strike draws through TRADUCIR, the word dims
      tl.fromTo(q("f17-strike"), { scaleX: 0, rotation: -1.2 }, { scaleX: 1, rotation: -1.2, duration: 0.2, ease: "power3.inOut" }, 2.22);
      tl.fromTo(q("f17-tradfade"), { opacity: 1 }, { opacity: 0.55, duration: 0.3, ease: "power2.out" }, 2.34);

      // ================= one clean arrow: NL -> mouth (2.38–2.70) =================
      const cl = q("f17-cline"), ch = q("f17-chead");
      const CL = cl.getTotalLength();
      cl.style.strokeDasharray = CL + " " + CL;
      // sample the (static) path once at build time — the callback only interpolates numbers
      const NSMP = 160, PX = [], PY = [];
      for (let i = 0; i <= NSMP; i++) {
        const pt = cl.getPointAtLength(CL * i / NSMP);
        PX.push(pt.x); PY.push(pt.y);
      }
      const ap = { p: 0 };
      function writeArrow() {
        const f = Math.max(0, Math.min(1, ap.p)) * NSMP;
        const i0 = Math.min(NSMP - 1, Math.floor(f)), fr = f - i0;
        const x = PX[i0] + (PX[i0 + 1] - PX[i0]) * fr;
        const y = PY[i0] + (PY[i0 + 1] - PY[i0]) * fr;
        const ang = Math.atan2(PY[i0 + 1] - PY[i0], PX[i0 + 1] - PX[i0]) * 180 / Math.PI;
        const off = (CL * (1 - ap.p)).toFixed(2);
        cl.style.strokeDashoffset = off;
        ch.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") rotate(" + ang.toFixed(2) + ")");
      }
      writeArrow();
      tl.fromTo(q("f17-carrow"), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 2.38);
      tl.fromTo(ap, { p: 0 }, { p: 1, duration: 0.32, ease: "power2.inOut", onUpdate: writeArrow, immediateRender: false }, 2.38);

      // ================= «Ja, natuurlijk!» comes out of the mouth on "cabeza" =================

      tl.set(q("f12-nodes"), { filter: "none" }, 0.4);
      tl.fromTo(q("f12-n-es"), { x: 540, scale: 0.42 }, { x: 0, scale: 1, duration: 0.36, ease: "expo.out" }, 0);

      rise("f12-w-un", T.un); rise("f12-w-metodo", T.metodo); rise("f12-w-construido", T.construido);
      rise("f12-w-desde", T.desde); rise("f12-w-el", T.el); slam("f12-w-espanol", T.espanol, 1.42);
      const STEPS = {

      tl.fromTo([q("f12-head"), q("f12-trail")], { x: 0 }, { x: 900, duration: BD, ease: "power2.inOut" }, B0);
      tl.fromTo(q("f12-head"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, B0);
      tl.fromTo(q("f12-trail"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, B0);

      tl.fromTo(q("f12-nl-glow"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, ARR);

      // ================= INGLÉS: off the path, greyed, crossed out on "español" =================

      shake("f12-n-en", T.espanol + 0.14, 6);
      tl.to(q("f12-ghost"), { opacity: 0.32, duration: 0.3, ease: "power1.out" }, T.espanol);
      tl.to(q("f12-disc-en"), { opacity: 0.7, duration: 0.3, ease: "power1.out" }, T.espanol);

      // ================= SEAM 1 -> 2: cut-the-curve to the LEFT (velocity-matched, x-blur) =================

      tl.set(q("f12-s2"), { filter: "none" }, S1 + SN + 0.02);
      tl.fromTo(q("f12-lap"), { rotationY: 30, rotationX: 4 }, { rotationY: 12, rotationX: 3, duration: 0.7, ease: "power3.out" }, S1);

      // ================= SCENE 2: native teachers, live =================
      tl.fromTo(q("f12-push"), { scale: 0.88, x: 0, y: 0 }, { scale: 0.98, x: 0, y: 0, duration: 1.6, ease: "power2.inOut" }, 2.62);
      pop("f12-pill1", T.profesores);
      tl.fromTo(q("f12-nl-ico"), { scale: 0.3, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.34, ease: "power3.out" }, T.profesores + 0.04);
      tl.fromTo(q("f12-focus"), { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power3.out" }, T.nativos - LEAD);
      pop("f12-pill2", T.saben);
      tl.fromTo(q("f12-es-ico"), { scale: 0.3, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.34, ease: "power3.out" }, T.saben + 0.04);

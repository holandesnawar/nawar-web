    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <filter id="f25-tint" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 0.043  0 0 0 0 0.427  0 0 0 0 0.941  -5.5 0 0 0 5.5" /></filter>

        <div class="f25-nl" id="f25-nl3"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 17 V14 a9 9 0 0 1 18 0 V17 M5 17 h3.5 v6.5 H6.5 A1.5 1.5 0 0 1 5 22 Z M23 17 h-3.5 v6.5 h2 A1.5 1.5 0 0 0 23 22 Z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" /></svg><span>Luisteren</span></div>

  <script>
    (function () {
      const q = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const T = { lectura: 0.12, escritura: 0.76, y: 1.35, escucha: 1.55, activa: 1.97 };
      const D = 2.66;

      // directional blur proxies (seeded so a seek to t=0 is right)
      const blurProxy = (id, seed, axis) => {
        const node = q(id), p = { v: seed };
        const write = () => node.setAttribute("stdDeviation", axis === "x" ? p.v.toFixed(2) + " 0" : "0 " + p.v.toFixed(2));
        write();
        return { p, write };
      };
      const label = (id, cue) => tl.fromTo(q(id), { opacity: 0, y: 34, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, cue);
      const recoil = (ids, t) => ids.forEach((id) => {
        tl.to(q(id), { x: -12, duration: 0.07, ease: "power2.out" }, t);
        tl.to(q(id), { x: 0, duration: 0.32, ease: "power3.out" }, t + 0.07);
      });

      tl.fromTo(q("f25-cam"), { scale: 1 }, { scale: 1.02, duration: D, ease: "none" }, 0);
      tl.fromTo(q("f25-dots"), { x: 0 }, { x: -56, duration: D, ease: "power1.out" }, 0);

      // ===== 1 · Lectura — slams in from the LEFT with a motion-blur streak (entrance, 0–0.28) =====
      const b1 = blurProxy("f25-mb1-b", 46, "x");
      q("f25-c1").style.filter = "url(#f25-mb1)";
      tl.fromTo(q("f25-c1"), { x: -1180 }, { x: 0, duration: 0.3, ease: "expo.out" }, 0);
      tl.fromTo(b1.p, { v: 46 }, { v: 0, duration: 0.28, ease: "expo.out", onUpdate: b1.write }, 0);
      tl.set(q("f25-c1"), { filter: "none" }, 0.3);
      gsap.utils.toArray("#f25-speed .f25-sl").forEach((el, i) => {
        const at = (i % 3) * 0.02;
        tl.fromTo(el, { x: -700, opacity: 0, scaleX: 0.3 }, { x: 260 + i * 40, opacity: 1, scaleX: 1, duration: 0.14, ease: "power2.out" }, at);
        tl.to(el, { x: 980 + i * 60, opacity: 0, scaleX: 0.4, duration: 0.24, ease: "power2.out" }, at + 0.14);
      });
      label("f25-lbl1", T.lectura);
      tl.fromTo(q("f25-nl1"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out" }, T.lectura + 0.1);

      // ===== 2 · Escritura — slams DOWN from the top on "escritura" =====
      const b2 = blurProxy("f25-mb2-b", 0, "y");
      tl.set(q("f25-c2"), { filter: "url(#f25-mb2)" }, 0);
      tl.fromTo(q("f25-c2"), { y: -1000, opacity: 1 }, { y: 0, duration: 0.3, ease: "expo.out" }, T.escritura - 0.05);
      tl.fromTo(b2.p, { v: 40 }, { v: 0, duration: 0.28, ease: "expo.out", onUpdate: b2.write }, T.escritura - 0.05);
      tl.set(q("f25-c2"), { filter: "none" }, T.escritura + 0.26);
      recoil(["f25-c1"], T.escritura + 0.13);
      label("f25-lbl2", T.escritura + 0.04);
      tl.fromTo(q("f25-nl2"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out" }, T.escritura + 0.14);

      // ===== 3 · Escucha activa — slams in from the RIGHT on "escucha" =====
      const b3 = blurProxy("f25-mb3-b", 0, "x");
      tl.set(q("f25-c3"), { filter: "url(#f25-mb3)" }, 0);
      tl.fromTo(q("f25-c3"), { x: 1000 }, { x: 0, duration: 0.3, ease: "expo.out" }, T.escucha - 0.05);
      tl.fromTo(b3.p, { v: 46 }, { v: 0, duration: 0.28, ease: "expo.out", onUpdate: b3.write }, T.escucha - 0.05);
      tl.set(q("f25-c3"), { filter: "none" }, T.escucha + 0.26);
      recoil(["f25-c1", "f25-c2"], T.escucha + 0.12);
      tl.fromTo(q("f25-w-escucha"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, T.escucha + 0.04);
      tl.fromTo(q("f25-nl3"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out" }, T.escucha + 0.14);
      tl.fromTo(q("f25-w-activa"), { opacity: 0, scale: 1.4, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, T.activa - 0.03);

      // playhead sweeps the real waveform; played bars turn blue
      const P0 = T.escucha + 0.2, PD = D - P0;
      tl.fromTo(q("f25-head"), { x: 0, opacity: 0 }, { x: 0, opacity: 1, duration: 0.12, ease: "power1.out" }, P0 - 0.12);
      tl.to(q("f25-head"), { x: 230, duration: PD, ease: "none" }, P0);
      tl.fromTo(q("f25-tintclip"), { width: 6 }, { width: 236, duration: PD, ease: "none" }, P0);

      window.__timelines = window.__timelines || {};
      window.__timelines["25-practica"] = tl;
    })();
  </script>

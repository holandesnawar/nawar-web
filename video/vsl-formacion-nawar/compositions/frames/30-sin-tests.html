  <div id="root" data-composition-id="30-sin-tests" data-width="1920" data-height="1080" data-duration="4.57">

    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <filter id="f30-vbOut" x="-0.2" y="-0.6" width="1.4" height="2.2"><feGaussianBlur id="f30-vbOutN" in="SourceGraphic" stdDeviation="0 0" /></filter>
      <filter id="f30-vbIn" x="-0.2" y="-0.6" width="1.4" height="2.2"><feGaussianBlur id="f30-vbInN" in="SourceGraphic" stdDeviation="0 0" /></filter>
    </svg>

    <div id="f30-par">
      <div id="f30-dots"></div>
      <div id="f30-amb"></div>

            <svg id="f30-hand" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">

              <path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2" />
              <path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1" />

              <path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" />

  <script>
    (function () {
      var $ = function (id) { return document.getElementById("f30-" + id); };
      var tl = gsap.timeline({ paused: true });
      var L = 0.04;
      var F = 1 / 30;
      var D = 4.57;

      // exact word cues (frame-relative s)
      var T = { y: 0.12, una: 0.30, cosa: 0.48, mas: 0.70, aqui: 1.30, no: 1.58, hay: 1.69, tests: 1.81,
                a: 2.43, be: 3.02, ce: 3.55, de: 4.16 };

      var word = function (el, t, dy) {
        tl.fromTo(el, { y: dy || 40, opacity: 0, filter: "blur(8px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.26, ease: "power3.out" }, t - L);
      };
      var shake = function (el, t, amp) {
        var xs = [amp, -amp * 0.7, amp * 0.4, 0];
        var ys = [-amp * 0.3, amp * 0.25, -amp * 0.1, 0];
        tl.fromTo(el, { x: 0, y: 0 }, { x: xs[0], y: ys[0], duration: F, ease: "none", immediateRender: false }, t);
        tl.to(el, { x: xs[1], y: ys[1], duration: F, ease: "none" }, t + F);
        tl.to(el, { x: xs[2], y: ys[2], duration: F, ease: "none" }, t + 2 * F);
        tl.to(el, { x: 0, y: 0, duration: F * 2, ease: "power2.out" }, t + 3 * F);
      };

      // ================= ENTRANCE: camera settle + the raised finger pops =================
      tl.fromTo($("dots"), { scale: 1.16 }, { scale: 1, duration: 0.6, ease: "expo.out" }, 0);
      tl.fromTo($("amb"), { opacity: 0.2, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo($("disc"), { scale: 0.35, opacity: 0, y: 40 },
        { scale: 1, opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 0);
      tl.fromTo($("hand"), { scale: 0.5, rotation: -14, y: 30 },
        { scale: 1, rotation: 0, y: 0, duration: 0.34, ease: "power3.out" }, 0.02);

      // "Y una cosa más." word by word
      word($("wY"), T.y);
      word($("wUna"), T.una);
      word($("wCosa"), T.cosa);
      word($("mas"), T.mas);

      // "+1" badge pops on "más." and the finger nudges up with it
      tl.fromTo($("plus"), { scale: 0, opacity: 0, rotation: 16 },
        { scale: 1, opacity: 1, rotation: -6, duration: 0.3, ease: "expo.out" }, T.mas - L);
      tl.fromTo($("hand"), { y: 0 }, { y: -12, duration: 0.1, ease: "power2.out", immediateRender: false }, T.mas - L);
      tl.to($("hand"), { y: 0, duration: 0.3, ease: "power3.out" }, T.mas - L + 0.1);

      // slow push while scene 1 is up
      tl.fromTo($("s1push"), { scale: 1 }, { scale: 1.05, duration: 1.1, ease: "sine.out" }, 0.1);

      // ================= SEAM (camera dives DOWN: scene 1 whips up, scene 2 rises in) =================
      var C = 1.27;
      var vOutN = $("vbOutN"), vInN = $("vbInN");
      var vOut = { v: 0 }, vIn = { v: 0 };
      var writeOut = function () { vOutN.setAttribute("stdDeviation", "0 " + vOut.v.toFixed(2)); };
      var writeIn = function () { vInN.setAttribute("stdDeviation", "0 " + vIn.v.toFixed(2)); };
      writeOut(); writeIn();
      tl.set($("s1"), { filter: "url(#f30-vbOut)" }, C - 0.2);
      tl.fromTo($("s1"), { y: 0 }, { y: -900, duration: 0.2, ease: "power3.in", immediateRender: false }, C - 0.2);
      tl.fromTo(vOut, { v: 0 }, { v: 24, duration: 0.2, ease: "power2.in", onUpdate: writeOut, immediateRender: false }, C - 0.2);
      tl.set($("s1"), { visibility: "hidden", filter: "none" }, C);
      // ground parallax follows the dive
      tl.fromTo($("par"), { y: 0 }, { y: -110, duration: 0.6, ease: "power3.inOut" }, C - 0.24);

      tl.set($("s2"), { visibility: "visible" }, C - 0.04);
      tl.set($("head"), { filter: "url(#f30-vbIn)" }, C - 0.04);
      tl.fromTo(vIn, { v: 20 }, { v: 0, duration: 0.2, ease: "power2.out", onUpdate: writeIn, immediateRender: false }, C - 0.04);
      tl.set($("head"), { filter: "none" }, C + 0.17);

      // ================= SCENE 2 — AQUÍ · NO · HAY · TESTS =================
      tl.fromTo($("hAqui"), { y: 320, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "expo.out" }, C - 0.03);
      // red word-chip on "no"
      tl.fromTo($("chip"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, T.no - L);
      tl.fromTo($("chip"), { scale: 0.5, rotation: 7, y: 26 },
        { scale: 1, rotation: -2, y: 0, duration: 0.32, ease: "expo.out" }, T.no - L);
      word($("hHay"), T.hay, 46);
      tl.fromTo($("hTests"), { scale: 1.35, opacity: 0, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, T.tests - L);

      // quiz card slams up out of the dive on "tests"
      var CS = T.tests - 0.05;
      tl.fromTo($("card"), { y: 520, rotationX: 38, scale: 0.94, opacity: 0, transformPerspective: 1700 },
        { y: 0, rotationX: 0, scale: 1, opacity: 1, transformPerspective: 1700, duration: 0.46, ease: "power4.out" }, CS);
      [0, 1, 2, 3].forEach(function (i) {
        tl.fromTo($("r" + i), { y: 36 + i * 14, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, CS + 0.06 + i * 0.045);
      });
      shake($("cardpos"), CS + 0.2, 7);

      // slow camera push on the card through the letter beats
      tl.fromTo($("s2cam"), { scale: 1 }, { scale: 1.03, duration: D - 2.2, ease: "sine.inOut" }, 2.2);

      // ================= THE LETTERS — each badge is crossed exactly on its spoken letter =================
      var cross = function (i, c) {
        var a = $("x" + i + "a"), b = $("x" + i + "b");
        a.setAttribute("stroke-dasharray", "1 1");
        b.setAttribute("stroke-dasharray", "1 1");
        tl.fromTo(a, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.1, ease: "power2.out" }, c - 0.04);
        tl.fromTo(b, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.1, ease: "power2.out" }, c + 0.04);
        // stamp hit on the badge
        tl.fromTo($("bw" + i), { scale: 1 }, { scale: 1.28, duration: 0.05, ease: "power2.out", immediateRender: false }, c - 0.03);
        tl.to($("bw" + i), { scale: 1, duration: 0.26, ease: "power3.out" }, c + 0.02);
        // row greys out
        tl.fromTo($("b" + i), { backgroundColor: "#1D0084" }, { backgroundColor: "#BFC6D6", duration: 0.2, ease: "power2.out" }, c + 0.02);
        tl.fromTo($("r" + i), { backgroundColor: "#F1F4FB", borderColor: "#DDE6F5" },
          { backgroundColor: "#E9ECF2", borderColor: "#E2E6EE", duration: 0.24, ease: "power2.out" }, c + 0.02);
        tl.fromTo($("t" + i), { color: "#0C0C1E" }, { color: "#A7AEBE", duration: 0.24, ease: "power2.out" }, c + 0.02);
        shake($("r" + i), c + 0.03, 9);
      };
      cross(0, T.a);
      cross(1, T.be);
      cross(2, T.ce);
      cross(3, T.de);

      window.__timelines = window.__timelines || {};
      window.__timelines["30-sin-tests"] = tl;
    })();
  </script>

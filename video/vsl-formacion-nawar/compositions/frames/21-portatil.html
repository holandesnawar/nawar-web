  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);

      // ===== Scene 1 (0.0-1.0): ON THE DROP the lid swings open in 3D =====
      tl.fromTo($("f21-flash"), { opacity: 0.55 }, { opacity: 0, duration: 0.25, ease: "power2.out" }, 0);
      tl.fromTo($("f21-dim"), { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, 0);
      // lid: hinge rotation 4 deg (seam) -> 112 deg
      tl.fromTo($("f21-lid"), { rotationX: 4 }, { rotationX: 112, duration: 0.85, ease: "power3.out" }, 0);
      // whole laptop: top-down diagonal -> 3/4 front view
      tl.fromTo($("f21-lap"), { rotation: -24, rotationX: 0, rotationY: 0, x: 0, y: 0, z: 400 },
        { rotation: 0, rotationX: 66, rotationY: 18, x: 0, y: 272, z: -800, duration: 1.0, ease: "power3.out" }, 0);
      // the pressed play disc releases; the click ripple finishes; the cursor is flung off with the lid
      tl.fromTo($("f21-press"), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.out" }, 0);
      tl.fromTo($("f21-ripple"), { opacity: 0.1306, scale: 1.6507 }, { opacity: 0, scale: 1.8, duration: 0.15, ease: "power1.out" }, 0);
      tl.fromTo($("f21-cursor"), { x: 0, y: 0, opacity: 1 }, { x: 160, y: -560, opacity: 0, duration: 0.32, ease: "power2.out" }, 0);
      tl.fromTo($("f21-cursori"), { scale: 1, rotation: 0 }, { scale: 1.5, rotation: 28, duration: 0.32, ease: "power2.out" }, 0);
      // screen powers on, light streak crosses the glass
      tl.fromTo($("f21-off"), { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.inOut" }, 0.5);
      // the screen's light spills onto the keyboard deck
      tl.fromTo($("f21-deckglow"), { opacity: 0 }, { opacity: 0.55, duration: 0.6, ease: "power2.out" }, 0.9);
      tl.to($("f21-deckglow"), { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.9);
      tl.fromTo($("f21-sweep1"), { x: -420, rotation: 22 }, { x: 1420, rotation: 22, duration: 0.55, ease: "power2.inOut" }, 0.6);

      // ===== Scene 2 (0.9-2.0): boot screen - the logo blooms; orbit starts =====
      tl.fromTo($("f21-logo"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 0.9);
      tl.fromTo($("f21-bootglow"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" }, 0.9);
      tl.fromTo($("f21-lap"), { rotationY: 18 }, { rotationY: -12, duration: 5.22, ease: "sine.inOut", immediateRender: false }, 1.0);
      tl.fromTo($("f21-cam"), { scale: 1 }, { scale: 1.035, duration: 2.72, ease: "sine.inOut" }, 1.0);

      // ===== Scene 3 (2.0-3.9): the logo dissolves into the school; real footage inside the screen =====
      tl.fromTo($("f21-boot"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 1.86);
      tl.fromTo($("f21-logo"), { filter: "blur(0px)" }, { scale: 1.22, filter: "blur(8px)", duration: 0.4, ease: "power2.in", immediateRender: false }, 1.86);
      tl.fromTo($("f21-v1wrap"), { scale: 1.12 }, { scale: 1, duration: 1.5, ease: "power2.out" }, 1.8);
      // in-screen cut to the platform dashboard
      tl.fromTo($("f21-cutflash"), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo($("f21-cutflash"), { opacity: 0.45 }, { opacity: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, 3.3);
      tl.fromTo($("f21-v2wrap"), { scale: 1.08 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 3.3);
      // the screen catches a light sweep as it turns
      tl.fromTo($("f21-sweep2"), { x: -420, rotation: 22 }, { x: 1420, rotation: 22, duration: 0.8, ease: "power1.inOut" }, 2.55);

      // ===== Scene 4 (3.9-6.22): laptop glides to the left third; 16 SEMANAS lands on the voice =====
      tl.to($("f21-cam"), { scale: 0.82, x: -330, y: 0, duration: 0.55, ease: "power3.inOut" }, 3.72);
      // 16 slams on "Dieciseis" with a 1 -> 16 count
      const cnt = { v: 1 };
      const numtxt = $("f21-numtxt");
      tl.fromTo(cnt, { v: 1 }, { v: 16, duration: 0.35, ease: "power2.out",
        onUpdate: () => { numtxt.textContent = String(Math.round(cnt.v)); } }, 4.17);
      tl.fromTo($("f21-num"), { opacity: 0, scale: 1.25, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 4.17);
      tl.fromTo($("f21-sem"), { opacity: 0, y: 46, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 4.80);
      tl.fromTo($("f21-w3"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, 5.14);
      tl.fromTo($("f21-w4"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, 5.23);
      tl.fromTo($("f21-guiada"), { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, 5.76);
      // the 16-week route: empty pills arrive with "semanas", fill left -> right up to "guiada"
      tl.fromTo(Array.from($("f21-pills").children), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out", stagger: 0.012 }, 4.84);
      for (let i = 0; i < 16; i++) {
        tl.fromTo($("f21-pf" + i), { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power2.out" }, 4.98 + i * 0.05);
      }

      window.__timelines["21-portatil"] = tl;
    })();
  </script>

        { x: 470, y: 426, t: 1.62 },  // C

      path.forEach(function (p) {
        tl.to(cur, { x: p.x, y: p.y, duration: 0.24, ease: "power2.inOut" }, p.t);

      tl.fromTo($("cursorIn"), { scale: 1 }, { scale: 0.8, duration: 0.06, ease: "power2.out", immediateRender: false }, CK - 0.03);
      tl.to($("cursorIn"), { scale: 1, duration: 0.18, ease: "power3.out" }, CK + 0.05);
      tl.fromTo($("ripple"), { opacity: 0 }, { opacity: 0.9, duration: 0.01, ease: "none" }, CK);
      tl.fromTo($("ripple"), { scale: 0.2 }, { scale: 1.7, duration: 0.45, ease: "power2.out" }, CK);
      tl.to($("ripple"), { opacity: 0, duration: 0.43, ease: "power2.out" }, CK + 0.02);
      tl.to($("r1"), { backgroundColor: "#E7F8EE", borderColor: "#16A34A", duration: 0.12, ease: "power2.out" }, CK + 0.02);
      tl.fromTo($("b1"), { backgroundColor: "#1D0084" }, { backgroundColor: "#16A34A", duration: 0.12, ease: "power2.out" }, CK + 0.02);
      tl.fromTo($("bL"), { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "none" }, CK + 0.02);
      var tk = $("tickP");
      tk.setAttribute("stroke-dasharray", "1 1");
      tl.fromTo(tk, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.2, ease: "power2.out" }, CK + 0.06);
      tl.fromTo($("bw1"), { scale: 1 }, { scale: 1.2, duration: 0.08, ease: "power2.out", immediateRender: false }, CK + 0.02);
      tl.to($("bw1"), { scale: 1, duration: 0.3, ease: "power3.out" }, CK + 0.1);
      tl.fromTo($("t1"), { color: "#0C0C1E" }, { color: "#15803D", duration: 0.12, ease: "none" }, CK + 0.02);
      tl.fromTo($("ok"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, CK + 0.05);
      // cursor slides off the answer so the green row reads
      tl.to(cur, { x: 640, y: 420, opacity: 0, duration: 0.35, ease: "power2.in" }, CK + 0.45);

      // confetti — deterministic by index
      var colors = ["#16A34A", "#4da3ff", "#0b6df0", "#34D399", "#1D0084", "#9fd5f5"];
      var cf = $("confetti");
      var N = 22;
      for (var i = 0; i < N; i++) {
        var d = document.createElement("div");
        d.className = "f31-cf";
        d.style.background = colors[i % colors.length];
        if (i % 3 === 0) { d.style.width = "16px"; d.style.height = "12px"; d.style.left = "-8px"; d.style.top = "-6px"; }
        cf.appendChild(d);
        var a = (-172 + i * (164 / (N - 1))) * Math.PI / 180;
        var sp = 150 + ((i * 53) % 130);
        var dx = Math.cos(a) * sp * 1.25, dy = Math.sin(a) * sp;
        var rot = ((i * 67) % 360) - 180;
        var t0 = CK + 0.04 + (i % 4) * 0.012;
        tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, t0);
        tl.fromTo(d, { x: 0, y: 0, rotation: 0, scale: 0.4 },
          { x: dx, y: dy, rotation: rot, scale: 1, duration: 0.42, ease: "power3.out" }, t0);
        tl.to(d, { y: dy + 150 + ((i * 29) % 80), rotation: rot * 1.8, duration: 0.6, ease: "power1.in" }, t0 + 0.42);
        tl.to(d, { opacity: 0, duration: 0.24, ease: "none" }, t0 + 0.78);
      }

      // ================= the die tumbles in on "pura" and lands showing 4 on "suerte" =================
      whipOut($("col1"), $("vbOutN"), 2.9);
      var DI = 2.86;
      tl.fromTo($("dieX"), { x: 760 }, { x: 0, duration: 0.42, ease: "power2.out" }, DI);
      tl.fromTo($("dieY"), { y: -300 }, { y: 0, duration: 0.24, ease: "power2.in" }, DI);
      tl.to($("dieY"), { y: -54, duration: 0.11, ease: "power2.out" }, DI + 0.24);
      tl.to($("dieY"), { y: 0, duration: 0.11, ease: "power2.in" }, DI + 0.35);
      tl.fromTo($("cube"), { rotationX: 520, rotationY: -560, rotation: 160 },
        { rotationX: -20, rotationY: -26, rotation: 0, duration: 0.52, ease: "power3.out" }, DI);
      tl.fromTo($("dieShadow"), { scale: 0.4, opacity: 0.2 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power2.in" }, DI);
      tl.to($("dieShadow"), { scale: 0.8, opacity: 0.6, duration: 0.11, ease: "power2.out" }, DI + 0.24);
      tl.to($("dieShadow"), { scale: 1, opacity: 1, duration: 0.11, ease: "power2.in" }, DI + 0.35);
      shake($("col2"), DI + 0.24, 6);

      slam($("wPura"), T.pura, 1.3, 12);
      slam($("wSuerte"), T.suerte, 1.34, 14);

      // ================= SCENE 3 — y te crees que vas «avanzando» → the bar cracks =================
      whipOut($("col2"), $("vbOut2N"), 3.82);
      // the die hops onto the card's corner (it was luck all along)
      tl.to($("dieX"), { x: -462, duration: 0.46, ease: "power3.inOut" }, 3.66);
      tl.to($("dieY"), { y: -66, scale: 0.52, duration: 0.46, ease: "power3.inOut" }, 3.66);
      tl.to($("cube"), { rotationX: -24, rotationY: 34, rotation: 12, duration: 0.46, ease: "power3.inOut" }, 3.66);
      tl.to($("dieShadow"), { opacity: 0, duration: 0.2, ease: "none" }, 3.66);

      tl.set($("col3"), { visibility: "visible" }, 3.76);
      word($("wY"), T.y, 60);
      word($("wTe"), T.te, 60);
      word($("wCrees"), T.crees, 60);
      word($("wQue"), T.que, 40);
      word($("wVas"), T.vas, 40);
      tl.fromTo($("prog"), { y: 220, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 3.8);

      // fast fill 0 → 80 %
      var W = 662;
      var fp = { p: 0 };
      var writeFill = function () {
        $("fill").style.clipPath = "inset(0px " + ((1 - fp.p) * W).toFixed(1) + "px 0px 0px round 18px)";
      };
      writeFill();
      tl.fromTo(fp, { p: 0 }, { p: 0.8, duration: 0.36, ease: "power2.inOut", onUpdate: writeFill }, 4.3);
      tl.fromTo($("plus"), { scale: 0, opacity: 0, y: 10 }, { scale: 1, opacity: 1, y: 0, duration: 0.3, ease: "back.out(2.2)" }, T.avanzando - L);
      tl.fromTo($("wAvz"), { opacity: 0, x: -40, filter: "blur(8px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, T.avanzando - L);

      // ---- CRACK + glitch at 4.90 ----
      var CR = 4.9;
      ["crk1", "crk2", "crk3", "crk4", "crk5"].forEach(function (id, k) {
        var el = $(id);
        el.setAttribute("stroke-dasharray", "1 1");
        tl.fromTo(el, { attr: { "stroke-dashoffset": 1 } },
          { attr: { "stroke-dashoffset": 0 }, duration: k === 0 ? 0.1 : 0.08, ease: "power2.out" }, CR + (k === 0 ? 0 : 0.04 + k * 0.02));
      });
      // flicker red / blue, then red
      [[0, 1], [0.033, 0], [0.066, 1], [0.1, 0], [0.133, 1]].forEach(function (s) {
        tl.set($("fillRed"), { opacity: s[1] }, CR + s[0]);
      });
      // glitch jitter on the panel and the quoted word
      [[0, 16, -6], [0.033, -12, 4], [0.066, 8, -2], [0.1, -4, 0], [0.133, 0, 0]].forEach(function (s) {
        tl.set($("prog"), { x: s[1], skewX: s[2] }, CR + s[0]);
      });
      [[0.02, -10], [0.053, 8], [0.086, -4], [0.12, 0]].forEach(function (s) {
        tl.set($("wAvz"), { x: s[1] }, CR + s[0]);
      });
      // drop back to 20 %: the broken piece falls out of the track
      [[0.0, 0.8, 0.52], [0.033, 0.52, 0.68], [0.066, 0.68, 0.2]].forEach(function (s) {
        tl.fromTo(fp, { p: s[1] }, { p: s[2], duration: 0.01, ease: "none", onUpdate: writeFill, immediateRender: false }, CR + 0.02 + s[0]);
      });
      tl.set($("shard"), { opacity: 1 }, CR + 0.05);
      tl.set($("fill"), { clipPath: "polygon(0% 0%, 20.4% 0%, 19.2% 28%, 21.6% 52%, 19% 76%, 20.6% 100%, 0% 100%)" }, CR + 0.1);
      tl.fromTo($("shard"), { y: 0, rotation: 0, x: 0 },
        { y: 170, rotation: 9, x: 40, duration: 0.3, ease: "power2.in", immediateRender: false }, CR + 0.06);
      tl.fromTo($("shard"), { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "none", immediateRender: false }, CR + 0.22);
      [[0.05, 0.9], [0.083, 0.4], [0.116, 1]].forEach(function (s) {
        tl.set($("shard"), { filter: "brightness(" + s[1] + ")" }, CR + s[0]);
      });
      // "+10 %" goes red and drops with it
      tl.to($("plus"), { backgroundColor: "#E02D3C", color: "#FFFFFF", duration: 0.04, ease: "none" }, CR + 0.02);
      tl.to($("plus"), { y: 140, rotation: 16, duration: 0.3, ease: "power2.in" }, CR + 0.08);
      tl.to($("plus"), { opacity: 0, duration: 0.12, ease: "none" }, CR + 0.24);

      window.__timelines = window.__timelines || {};
      window.__timelines["31-suerte"] = tl;
    })();
  </script>
</template>
